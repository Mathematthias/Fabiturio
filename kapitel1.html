  afterLock() { this.gotoMap(false); },

  /* Aufgabe vertagen und anderswo weitermachen */
  abortTask() {
    if (this.cur < 0) return;
    Sound.sfx('move');
    this.task = null; this.mini = null; this.ueb = null;
    this.gotoMap(false);
  },

  /* ---------------- Minispiel ---------------- */
  /* Kammer fluten (fn 'flut', 2026-11-17): Echtzeit. Schieber auf, die Zeit läuft (FLUT_TEMPO Minuten je Sekunde),
     die Fläche unter der Zuflussrate wächst. Schieber zu: geprüft wird die Schließzeit. */
  flutTaste() {
    const m = this.mini, T = this.task;
    if (!m || T.fn !== 'flut' || this.taskPhase !== 'ask' || m.zu) return;
    if (!m.lauf) { m.lauf = true; Sound.sfx('move'); }
    else { m.lauf = false; m.zu = true; Sound.sfx('tick'); this.miniCheck(); }
  },
  flutUpdate(dt) {
    const m = this.mini, T = this.task;
    if (!m || !m.lauf) return;
    m.A += dt * FLUT_TEMPO;
    if (m.A >= T.xmax) { m.A = T.xmax; m.lauf = false; m.zu = true; this.miniCheck(); }
  },
  miniCheck() {
    const m = this.mini, T = this.task;
    m.checked = true;
    const keys = miniKeys(T);
    m.dev = {};
    for (const k of keys) m.dev[k] = m[k] - T.target[k];
    m.ok = keys.every(k => Math.abs(m.dev[k]) < T['tol' + k]);
    if (m.ok) this.gotRight();
    else {
      // Beim Minispiel ist die Erklaerung, welche Werte noch nicht stimmen.
      const names = T.names || { A: 'die Amplitude A', B: 'die Streckung B', C: 'die Verschiebung C', D: 'der Mittelwert D' };
      const bad = keys.filter(k => Math.abs(m.dev[k]) >= T['tol' + k])
        .map(k => names[k] + (T.richtung && T.richtung[k] ? ' ' + T.richtung[k][m.dev[k] < 0 ? 0 : 1] : (m.dev[k] < 0 ? ' ist zu klein' : ' ist zu groß')));
      this.wrongWhy = 'Noch nicht: ' + bad.join(', ') + '.';
      if (T.fehl) this.wrongWhy = T.fehl[m.dev.A < 0 ? 0 : 1];          // eigene Sätze (Kammer fluten: zu früh, zu spät)
      this.gotWrong();
    }
  },

  /* Ziehen im Zeichenfeld (K4, 2026-11-18): Steigung abfahren zieht P waagerecht, Asymptoten anlegen fasst die Gerade,
     die beim Aufsetzen näher liegt, und zieht sie. Gerastert auf die Schrittweite, begrenzt durch minK/maxK. */
  miniZieh(px, py) {
    const T = this.task, m = this.mini, F = MINI_FELD[T.fn];
    if (!m || !F || this.taskPhase !== 'ask') return;
    const xv = (px - F.L) / (F.R - F.L) * (T.xmax - T.xmin) + T.xmin;
    let k = 'A', wert = xv;
    if (T.fn === 'asymp') {
      const Y = y => F.B - (y - T.ymin) / (T.ymax - T.ymin) * (F.B - F.T);
      const X = x => F.L + (x - T.xmin) / (T.xmax - T.xmin) * (F.R - F.L);
      if (m.zk === undefined || m.zk === null) { m.zk = Math.abs(px - X(m.A)) <= Math.abs(py - Y(m.D)) ? 'A' : 'D'; m.sel = m.zk === 'A' ? 0 : 1; }
      k = m.zk;
      if (k === 'D') wert = (F.B - py) / (F.B - F.T) * (T.ymax - T.ymin) + T.ymin;
    }
    const st = T['step' + k], s0 = T['start' + k];
    let v = s0 + Math.round((wert - s0) / st) * st;
    v = miniGrenze(T, k, Math.round(v * 1000) / 1000);
    if (Math.abs(v - m[k]) > 1e-9) { m[k] = v; Sound.sfx('tick'); }
  },

  /* ---------------- Bosskampf ---------------- */
  toBoss() {
    Sound.setLayer('full');
    this.playTalk(this.chapter.bossIntro, 'boss');
  },

  /* island: Index der Insel mit eigenem Endgegner, sonst der Kapitel-Boss */
  beginBoss(island) {
    const isl = (typeof island === 'number' && island >= 0) ? island : -1;
    const b = isl >= 0 ? this.gates()[isl].boss : this.chapter.boss;
    this.bossDef = b; this.bossIsland = isl;
    const R = RNG(this.nextSeed());
    // Fragen mit wenn(Game) kommen nur unter einer Bedingung (Asymptotenfrage nur nach dem Ausflug)
    const defs = b.questions.filter(q => !q.wenn || q.wenn(this));
    const qs = defs.map(q => aufTaste(buildTask(q, R.next()), this.ziehTaste()));
    this.boss = { hp: qs.length, max: qs.length, q: 0, phase: 'ask', shake: 0, flashT: 0, qs, defs, tries: 0, rescue: false };
    this.lives = 3;
    this.view = 'boss';
    this.sel = 0;
    Sound.setLayer('full'); Sound.play('boss');
    this.save();
  },

  bossPick(i) {
    const b = this.boss;
    if (b.phase !== 'ask') return;
    const q = b.qs[b.q];
    b.lastPick = i;
    b.correct = !!q.options[i].ok;
    b.phase = 'fb';
    if (b.correct) {
      // boss.drehen: volle Punkte nur beim ersten Versuch, die Hälfte beim zweiten, danach keine
      const pts = this.bossDef.drehen ? [this.bossDef.pts, Math.round(this.bossDef.pts / 2), 0][Math.min(2, b.tries || 0)] : this.bossDef.pts;
      b.hp--; b.flashT = 0.25; this.score += pts; this.right++;
      if (this.bossIsland < 0 && !this.bossLog[b.q]) this.bossLog[b.q] = Math.min(3, (b.tries || 0) + 1);
      this.fbLine = pickLine(this.bossDef.praise || this.chapter.praise, 'Treffer!');
      Sound.sfx('treffer');                   // seit 2026-11-18: belohnend, F'Abiturio ärgert sich hörbar
    } else {
      this.lives--; this.wrong++; b.shake = 0.4; Sound.sfx('patzer'); b.tries = (b.tries || 0) + 1;   // Treffer und fieses Lachen
      this.gloatLine = pickLine(this.bossDef.gloat || this.chapter.gloat, 'Hihi!');
      if (this.lives <= 0) { b.rescue = true; this.lives = 1; }
    }
  },

  bossNext() {
    const b = this.boss;
    /* boss.drehen (ab Kapitel 4 Neubau): Nach einer falschen Antwort dreht der Boss in einer kurzen
       Zwischensequenz an den Zahlen, dann kommt dieselbe Frage mit neuen Zahlen. */
    if (b.phase === 'fb' && !b.correct && !b.rescue && this.bossDef.drehen) {
      b.phase = 'dreh'; this.gloatLine = pickLine(this.bossDef.gloat || this.chapter.gloat, 'Hihi!'); Sound.sfx('magic'); return;
    }
    if (b.phase === 'dreh') {
      const def = b.defs[b.q], sig = t => (t.q || '') + '|' + (t.formula || ''), prev = sig(b.qs[b.q]);
      for (let k = 0; k < 12; k++) { b.qs[b.q] = buildTask(def, this.nextSeed()); if (sig(b.qs[b.q]) !== prev) break; }
      aufTaste(b.qs[b.q], this.ziehTaste());
      b.phase = 'ask'; this.sel = 0; return;
    }
    b.phase = 'ask';
    if (b.rescue) { b.rescue = false; b.hp--; if (this.bossIsland < 0 && !this.bossLog[b.q]) this.bossLog[b.q] = 3; }
    else if (!b.correct) return;
    b.q++; b.tries = 0;
    this.sel = 0;
    if (b.hp <= 0 || b.q >= b.qs.length) {
      if (this.bossIsland >= 0) {
        // Inselboss besiegt: weiter zum nächsten Tor, der Kampf ist abgehakt
        this.islandBossDone[this.bossIsland] = true;
        const def = this.bossDef;
        this.boss = null; this.bossDef = null; this.bossIsland = -1;
        this.playTalk(def.outro, 'islandBossDone');
      } else this.playTalk(this.chapter.outro, 'outro');
    }
    this.save();
  },

  /* ---------------- Abschluss ---------------- */
  /* status: 0 abgebrochen, 1 geloest, 2 Teilsieg, 3 am Tor gescheitert */
  finish(status) {
    this.mode = 'end';
    this.endStatus = status;
    if (this.isEk()) {
      this.code = makeCode3({
        kap: this.chapterId, min: this.minutes(), ses: this.sessions || 1, status, gw: this.gateWrong || 0,
        st: this.stations.map(s => ({ done: s.state === ST_DONE, m: s.ek.m, mw: s.ek.mw, pw: s.ek.pw, h: s.ek.h }))
      }, this.name);
    } else this.code = makeCode({
      ver: 2, kap: this.chapterId, pts: Math.min(1023, this.score),
      right: Math.min(63, this.right), wrong: Math.min(63, this.wrong),
      hints: Math.min(63, this.hintsUsed), min: this.minutes(), status
    }, this.name);
    // Stufe 2: der lange Code geht ins Kopierfeld und in die Mail, der kurze bleibt auf dem Schlussbild
    this.codeLang = (this.chapter.codeLang && !this.isEk()) ? this.makeCodeLang(status) : null;
    this.transfer = makeTransfer(this.chapterId, this.name, this.codeLang || this.code);
    Sound.setLayer('full');
    Sound.play(status === 1 ? 'victory' : (status === 2 ? 'calm' : 'defeat'));
    // Nur ein abgeschlossenes Kapitel loescht den Stand. Wer mit Q eine
    // Pause macht, findet sein Spiel beim naechsten Start wieder.
    if (status !== 0) { try { localStorage.removeItem(this.saveKey()); } catch (e) {} }
  },

  /* Langer Ergebnis-Code (47_code4.js): Stand je Ort, Protokoll je Teilaufgabe, Bossfragen */
  makeCodeLang(status) {
    const nb = this.chapter.boss ? this.chapter.boss.questions.filter(q => !q.wenn || q.wenn(this)).length : 0;
    const boss = []; for (let i = 0; i < Math.min(15, nb); i++) boss.push(this.bossLog[i] || 0);
    return makeCode4({
      kap: this.chapterId, status, min: this.minutes(), ses: this.sessions || 1, pts: this.score, gw: this.gateWrong || 0, ueb: this.geuebt || 0,
      orte: this.stations.slice(0, 15).map((st, i) => ({
        stand: st.state === ST_DONE ? 2 : (st.state === ST_LOCKED ? 1 : 0), ti: st.ti, n: this.prot[i].n,
        t: this.prot[i].t.slice(0, 7)
      })),
      boss
    }, this.name);
  },
  /* was: 0 Fehlversuch (mit erstem Ablenker), 1 selbst geholter Tipp */
  protokoll(was, ablenker) {
    if (this.cur < 0 || !this.prot || !this.prot[this.cur]) return;
    const a = this.prot[this.cur].t[this.curSt().ti]; if (!a) return;
    if (was === 0) { a[0] = Math.min(3, a[0] + 1); if (!a[2] && ablenker) a[2] = Math.min(3, ablenker); }
    else a[1] = Math.min(3, a[1] + 1);
  },

  /* ---------------- Spielstand ---------------- */
  save() {
    if (this.mode !== 'play') return;
    try {
      localStorage.setItem(this.saveKey(), JSON.stringify({
        v: 2, k: this.chapterId, n: this.name, t: this.startedAt,
        p: this.score, r: this.right, w: this.wrong, h: this.hintsUsed,
        sd: this.seed, lc: this.lockCounter, gp: this.gatesPassed, gi: this.gateIx, il: this.island,
        gs: this.gateScored,
        view: this.view,
        st: this.stations.map(s => [s.state, s.ti, s.seed, s.tries, s.hints, s.lockAt, s.seen ? 1 : 0, s.auto || 0, s.sz || 0]),
        as: this.ausflugSeen || {},
        cur: this.cur,
        g: this.gate ? { i: this.gate.i, r: this.gate.right } : null,
        b: this.boss ? { q: this.boss.q, hp: this.boss.hp, lv: this.lives, ib: this.bossIsland } : null,
        ibd: this.islandBossDone,
        am: Math.round(this.activeMs || 0), ss: this.sessions || 1, gw: this.gateWrong || 0, gu: this.geuebt || 0,
        ek: this.isEk() ? this.ekState() : null,
        pr: this.prot, bl: this.bossLog
      }));
    } catch (e) {}
  },

  hasSave() {
    try {
      const d = JSON.parse(localStorage.getItem(this.saveKey()) || 'null');
      return !!(d && d.v === 2 && d.k === this.chapterId);
    } catch (e) { return false; }
  },

  savedName() {
    try { return (JSON.parse(localStorage.getItem(this.saveKey()) || 'null') || {}).n || ''; }
    catch (e) { return ''; }
  },

  load() {
    let d;
    try { d = JSON.parse(localStorage.getItem(this.saveKey()) || 'null'); } catch (e) { return false; }
    if (!d || d.v !== 2 || d.k !== this.chapterId) return false;
    this.reset();
    this.name = d.n; this.startedAt = d.t;
    this.score = d.p; this.right = d.r; this.wrong = d.w; this.hintsUsed = d.h;
    this.seed = d.sd; this.lockCounter = d.lc || 0; this.gatePassed = !!d.gp;
    this.gatesPassed = d.gp || 0; this.gateIx = d.gi || 0; this.island = d.il || 0;
    this.gateScored = d.gs || [];
    this.stations = d.st.map(a => ({ state: a[0], ti: a[1], seed: a[2], tries: a[3], hints: a[4], lockAt: a[5], seen: !!a[6], auto: a[7] || 0, sz: a[8] || a[2] || 1 }));
    this.ausflugSeen = d.as || {};
    this.cur = d.cur;
    // Alte Spielstände kennen die aktive Zeit noch nicht: dann zählt sie ab jetzt.
    this.activeMs = d.am || 0; this.sessions = Math.min(15, (d.ss || 1) + 1); this.gateWrong = d.gw || 0;
    this.ekLoad(d.ek); this.geuebt = d.gu || 0;
    if (d.pr && d.pr.length === this.chapter.stations.length) this.prot = d.pr;
    this.bossLog = d.bl || [];
    this.mode = 'play';
    // Beim Fortsetzen immer auf der Karte einsteigen - das ist der
    // verlaesslichste Punkt, und die Station laeuft dort weiter, wo sie stand.
    this.islandBossDone = d.ibd || [];
    if (d.b) {
      this.beginBoss(d.b.ib);
      this.boss.q = Math.min(d.b.q, this.boss.qs.length - 1);
      this.boss.hp = d.b.hp; this.lives = d.b.lv;
    } else if (d.g && d.view === 'gate') {
      this.startGate();
      this.gate.i = d.g.i; this.gate.right = d.g.r;
      if (this.gate.i >= this.gate.qs.length) this.gate.i = this.gate.qs.length - 1;
    } else if (!this.gatesPassed) {
      this.startWalk();            // vor dem ersten Tor gespeichert: noch einmal hinlaufen
    } else if (this.gateIx >= this.gatesPassed) {
      this.playTalk(this.curGate().intro, 'gate');   // zwischen zwei Inseln gespeichert
    } else {
      this.gotoMap(false);
    }
    return true;
  }
};

/* ============================================================
   AUFGABE AUS EINER VORLAGE BAUEN
   Entweder aus einem Generator (Zahlenaufgaben) oder aus einem
   Variantenvorrat (Begriffsaufgaben ohne Zahlen). Die Antworten
   werden in jedem Fall gemischt - die richtige steht nie fest oben.
   ============================================================ */
/* Die richtige Antwort auf eine bestimmte Taste legen (nur bei vier Antworten); die übrigen bleiben gemischt */
function aufTaste(t, pos) {
  if (!t || !t.options || pos === undefined || pos < 0 || t.options.length !== 4) return t;
  const k = t.options.findIndex(o => o.ok);
  if (k >= 0 && k !== pos) { const o = t.options.slice(); const x = o[k]; o[k] = o[pos]; o[pos] = x; t.options = o; }
  return t;
}

function buildTask(def, seed, S) {
  const R = RNG(seed);
  let d;
  if (def.gen) d = def.gen(R, S);                // S: gemeinsames Szenario der Station, sonst undefined
  else if (def.variants) d = Object.assign({}, R.pick(def.variants));
  else d = Object.assign({}, def);
  const t = Object.assign({}, d);
  // falsche Antworten tragen ihre Nummer aus der Inhaltsdatei (1..3) - für den langen Ergebnis-Code
  if (t.options) { let k = 0; t.options = R.shuffle(t.options.map(o => o.ok ? o : Object.assign({}, o, { nr: ++k }))); }
  t.kind = def.kind || 'quiz';
  t.pts = def.pts || d.pts || 50;
  t.id = def.id;
  return t;
}

/* ============================================================
   LEVELCODE  (12 Zeichen, an den Namen gebunden)
   ============================================================ */
const B32 = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';

/* Vornamen vereinheitlichen, damit Code und Name immer zusammenpassen -
   auch wenn Umlaute im Spiel und im Sammelcode unterschiedlich aussehen. */
function normName(name) {
  return (name || '').toUpperCase()
    .replace(/\u00C4/g, 'AE').replace(/\u00D6/g, 'OE').replace(/\u00DC/g, 'UE')
    .replace(/\u00DF/g, 'SS')
    .replace(/[^A-Z0-9]/g, '')
    .substr(0, 12);
}

function nameKey(name) {
  let h = 5381;
  const up = normName(name);
  for (let i = 0; i < up.length; i++) h = ((h * 33) ^ up.charCodeAt(i)) >>> 0;
  return h;
}

function packBits(vals) {
  let bits = '';
  for (const [v, n] of vals) bits += (v >>> 0).toString(2).padStart(n, '0').slice(-n);
  return bits;
}

function makeCode(d, name) {
  const body = packBits([[d.ver,3],[d.kap,5],[d.pts,10],[d.right,6],[d.wrong,6],[d.hints,6],[d.min,9],[d.status,2]]);
  const key = nameKey(name);
  let sum = key % 8191;
  for (let i = 0; i < body.length; i += 8) sum = (sum * 31 + parseInt(body.substr(i, 8).padEnd(8, '0'), 2)) % 8191;
  const full = body + sum.toString(2).padStart(13, '0');   // 47 + 13 = 60 bit
  let out = '';
  for (let i = 0; i < 60; i += 5) out += B32[parseInt(full.substr(i, 5), 2)];
  return out.substr(0, 4) + '-' + out.substr(4, 4) + '-' + out.substr(8, 4);
}

function readCode(code, name) {
  const c = (code || '').toUpperCase().replace(/[^0-9A-Z]/g, '')
              .replace(/O/g, '0').replace(/I/g, '1').replace(/L/g, '1').replace(/U/g, 'V');
  if (c.length === CODE3_LEN) return readCode3(c, name);
  if (c.length > 24) return readCode4(c, name);
  if (c.length !== 12) return { ok: false, err: 'Code muss 12, 16 oder über 24 Zeichen haben.' };
  let bits = '';
  for (const ch of c) {
    const v = B32.indexOf(ch);
    if (v < 0) return { ok: false, err: 'Ungültiges Zeichen: ' + ch };
    bits += v.toString(2).padStart(5, '0');
  }
  const body = bits.substr(0, 47), sum = parseInt(bits.substr(47, 13), 2);
  const key = nameKey(name);
  let s2 = key % 8191;
  for (let i = 0; i < body.length; i += 8) s2 = (s2 * 31 + parseInt(body.substr(i, 8).padEnd(8, '0'), 2)) % 8191;
  const take = (off, n) => parseInt(body.substr(off, n), 2);
  const res = {
    ok: s2 === sum,
    ver: take(0,3), kap: take(3,5), pts: take(8,10), right: take(18,6),
    wrong: take(24,6), hints: take(30,6), min: take(36,9), status: take(45,2)
  };
  if (!res.ok) res.err = 'Code passt nicht zu diesem Namen.';
  return res;
}

const STATUS_TEXT = ['abgebrochen', 'vollständig gelöst', 'Teilsieg - eine Station blieb zu', 'am Tor gescheitert'];

/* Welche Regler ein Minispiel hat: Sinus und Kosinus A bis D, die Parabel
   nur a, d, e (intern A, C, D). */
function miniKeys(T) { return T.keys || ['A', 'B', 'C', 'D']; }
function miniGrenze(T, k, v) {        // Regler bleibt im Fenster, wenn die Aufgabe minK/maxK nennt
  if (T['min' + k] !== undefined) v = Math.max(T['min' + k], v);
  if (T['max' + k] !== undefined) v = Math.min(T['max' + k], v);
  return v;
}
const FLUT_TEMPO = 0.5;     // Kammer fluten: eine Minute dauert zwei Sekunden

/* ============================================================
   SAMMELCODE
   Ein einziger Text, den die Schuelerin kopiert und der Lehrkraft
   schickt: Kapitel, Vorname und der an den Namen gebundene Leistungscode.
   Format:  FAB-K1-LENA-4F3K9P2TW7XM
   Wer den Vornamen im Code aendert, zerstoert die Pruefsumme - die
   Codepruefung meldet das.
   ============================================================ */
function makeTransfer(chapterId, name, code) {
  return 'FAB-K' + chapterId + '-' + normName(name) + '-' + (code || '').replace(/-/g, '');
}

function parseTransfer(s) {
  const t = (s || '').toUpperCase().replace(/\s+/g, '');
  const m = t.match(/^FAB-K(\d+)-([A-Z0-9]{2,12})-([A-Z0-9-]{12,280})$/);
  if (!m) return null;
  return { kap: parseInt(m[1], 10), name: m[2], code: m[3].replace(/-/g, '') };
}

/* Eine Zeile aus einem Vorrat ziehen - fuer Lob, Schreck und Hohn. */
function pickLine(pool, fallback) {
  if (!pool || !pool.length) return fallback;
  return pool[Math.floor(Math.random() * pool.length)];
}

/* Gesammelte Belohnungen ergeben sich aus den erledigten Stationen -
   so muessen sie nicht eigens gespeichert werden. */
function earnedRewards() {
  return Game.chapter.stations.map((sd, i) => ({ r: sd.reward, got: Game.stations[i] && Game.stations[i].state === ST_DONE }))
    .filter(x => x.r);
}

/* ===== 45_erklaer.js ===== */
/* ============================================================
   ERKLÄRINSEL (ab Kapitel 3, Kapitelformat v2.4)
   Ein Kapitel mit erklaerinsel: true hat statt Aufgaben Erklärstationen.
   Ablauf je Station: Ankunft -> Minispiel -> Mathematthias übersetzt in den
   Unterricht (mit Erklärbild) -> Nachfrage „Nochmal ausprobieren? Leicht /
   Meister" -> die Stationsleitung übergibt die Seite (outro) -> erst jetzt
   öffnet sich die Buchseite -> Probefrage -> Karte.
   Meisterproben sind nie gesperrt: Es gibt sie in der Nachfrage und an jeder
   erledigten Station auf der Karte. Eine erledigte Station lässt sich von der
   Karte aus wieder anwählen: dieselbe Nachfrage, nur mit „Zur Karte". Sind am Ende noch welche offen, wirbt der
   Steiger dafür; sind alle geschafft, vergoldet er das Buch sofort.
   Keine Punkte, keine Sperren, keine Extra-Fundstücke. Belohnung ist das
   Steigerbuch selbst: Es füllt sich und bekommt Beschläge in Bronze (ab
   2 Stationen), Silber (alle Stationen) und Gold (alle Meisterproben).
   Das Kapitel endet an der Brücke zur gesperrten Nachbarinsel.
   ============================================================ */

/* Die Funktionen hinter den Minispielen, über die Stations-ID gewählt */
const EKF = {
  stollen:   x => 0.03125 * x * x * x - 0.375 * x * x,         // Schiene am Stolleneingang, x von 0 bis 8
  bremsberg: x => -0.25 * x * x,                               // Bremsberg, Bremsstelle bei x = 2
  karten:    x => 0.1 * x * x * x - 0.9 * x * x + 2.4 * x,     // Höhenprofil der neuen Strecke, x von 0 bis 6
  kartenAbl: x => 0.3 * x * x - 1.8 * x + 2.4
};
const EK_LATTE = { xmax: 8, schritt: 0.5 };
/* Pendel: hs sind die Abstände, bei denen die Tabelle eine Zeile bekommt; tritte die Stufen der Pfeiltasten */
const EK_UEBERGABE = 2.6;   // Sekunden: feierliche Übergabe einer neuen Seite, bevor das Buch aufgeht (seit 2026-11-18)
const EK_PENDEL = { x0: 2, hs: [1, 0.5, 0.1, 0.01, 0.001], hsMeister: [-1, -0.5, -0.1, -0.01],
                    tritte: [1.5, 1, 0.75, 0.5, 0.25, 0.1, 0.05, 0.01, 0.001], hmax: 1.6, lang: 1.5 };   // lang: Achsabstand des Messhunts zu Beginn
/* Seit 2026-11-16 in glaubhaftem Maßstab (Matthias: 2 m/s sind für einen vollen Hunt viel zu schnell): 18 m Strecke,
   Tür bei 12 m, Höchsttempo 1,5 m/s, an der Tür höchstens 0,5 m/s, Meisterprobe im Schnitt mindestens 1 m/s.
   Vorher 60 m / 40 m / 5 / 2 / 3; alles mit 0,3 verkleinert, eine Fahrt dauert so lange wie zuvor.
   bremse: Der Hunt rollt beim Loslassen aus (im alten Maßstab 1,2 statt 3 m/s²). Vorher stand er aus voller
   Fahrt sofort; um die Tür langsam genug zu passieren, blieb ein Fenster von 0,13 s zum Loslassen. */
/* Fahrt seit 2026-11-20 mit Gas und Bremse (Studierende: nur mit Stottertippen zu schaffen): schub = Gas, bremse = Bremse,
   rollen = ohne beides rollt der Hunt sanft aus */
const EK_FAHRT = { lang: 18, tuer: 12, vmax: 1.5, schub: 0.6, bremse: 1.0, rollen: 0.12, vTuer: 0.5, schnittMeister: 1 };
/* Knöpfe unter dem Fahrtenschreiber (alte Koordinaten) */
const FAHRT_KNOPF = { brems: { x: 4, y: 174, w: 116, h: 16 }, gas: { x: 200, y: 174, w: 116, h: 16 } };
function fahrtKnopf(p, k) { const b = FAHRT_KNOPF[k]; return !!(p && p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y - 2 && p.y <= b.y + b.h + 2); }
const EK_PLAN = { halte: [0, 1, 2, 3, 4, 5, 6], raster: 0.3, vmin: -1.2, vmax: 3 };

function ekLatteSteigung(a, w) { return (EKF.stollen(a + w) - EKF.stollen(a)) / w; }
function ekLatteBeste(w) {
  let best = 0, m = 1e9;
  for (let a = 0; a <= EK_LATTE.xmax - w + 1e-9; a += EK_LATTE.schritt) { const s = ekLatteSteigung(a, w); if (s < m - 1e-9) { m = s; best = a; } }
  return best;
}
function ekPendelSteigung(h) { const x0 = EK_PENDEL.x0; return (EKF.bremsberg(x0 + h) - EKF.bremsberg(x0)) / h; }
/* Erklärbild zum Erfolgssatz der Meisterprobe: dasselbe wie beim ersten Mal, wenn eines hinterlegt ist */
function E_FIG(sd, meister) { return meister && sd.erklaer.mini.erfolgFig ? sd.erklaer.mini.erfolgFig : undefined; }
/* Zahl mit Komma, ohne überflüssige Nullen, höchstens n Nachkommastellen; gerundet wie in der Schule (0,625 wird 0,63, auch mit Minus) */
function ekZahl(v, n) {
  const p = Math.pow(10, n === undefined ? 5 : n);
  let s = (Math.sign(v) * Math.round(Math.abs(v) * p + 1e-9) / p).toFixed(n === undefined ? 5 : n);
  if (n === undefined) s = s.replace(/0+$/, '').replace(/\.$/, '');
  return s.replace('.', ',');
}
/* Die Fahrt wird mit einer Nachkommastelle angezeigt; bestanden ist, was die Anzeige zeigt (3,0 gilt als 3) */
function ekRund1(v) { return Math.round(v * 10 + 1e-9) / 10; }
function ekPlanOk(x, val) {
  const soll = EKF.kartenAbl(x), kl = v => Math.abs(v) < 1e-6 ? 0 : (v > 0 ? 1 : -1);
  if (kl(soll) !== kl(val)) return false;
  return Math.abs(val - soll) <= EK_PLAN.raster + 1e-6;
}

Object.assign(Game, {
  isEk() { return !!(this.chapter && this.chapter.erklaerinsel); },
  ekN() { return this.chapter.stations.length; },
  ekDone() { return this.stations.filter(s => s.state === ST_DONE).length; },
  ekMeister() { return this.stations.filter(s => s.ek && s.ek.m).length; },
  /* 0 keine, 2 Silber, 3 Gold (Bronze gibt es seit 2026-11-19 nicht mehr, Matthias: nur Silber für alle Stationen, Gold für alle Meisterproben) */
  ekMedal() {
    const d = this.ekDone(), n = this.ekN();
    return (d === n && this.ekMeister() === n) ? 3 : (d === n ? 2 : 0);
  },
  ekHasPage(i) { const s = this.stations[i]; return !!s && (s.state === ST_DONE || (s.ek && s.ek.step >= 2)); },
  ekAllPages() { return this.stations.every((_, i) => this.ekHasPage(i)); },

  ekInit() {
    for (const s of this.stations) if (!s.ek) s.ek = { step: 0, mw: 0, pw: 0, h: 0, m: false, pv: 0 };
    if (!this.ekSeen) this.ekSeen = { b: false, s: false, g: false };
  },
  ekState() {
    return { st: this.stations.map(s => [s.ek.step, s.ek.mw, s.ek.pw, s.ek.h, s.ek.m ? 1 : 0, s.ek.pv]), seen: this.ekSeen };
  },
  ekLoad(d) {
    this.ekSeen = (d && d.seen) || { b: false, s: false, g: false };
    this.stations.forEach((s, i) => {
      const a = d && d.st && d.st[i];
      s.ek = a ? { step: a[0], mw: a[1], pw: a[2], h: a[3], m: !!a[4], pv: a[5] || 0 } : { step: 0, mw: 0, pw: 0, h: 0, m: false, pv: 0 };
    });
  },

  /* ---------------- Karte ---------------- */
  ekEnter(i) {
    if (i === this.ekN()) { this.ekBridge(); return; }
    const st = this.stations[i], sd = this.chapter.stations[i];
    if (!st) return;
    this.cur = i; this.ekConfirm = false;
    if (st.state === ST_DONE) {
      // erledigte Station: nochmal ausprobieren, leicht oder als Meisterprobe (die Buchseite gibt es über „Buch")
      Sound.sfx('move'); Sound.setLayer('full'); Sound.play(sd.music || 'field');
      this.ekFrageStart(true); return;
    }
    Sound.setLayer('full'); Sound.play(sd.music || 'field');      // jeder Ort hat sein Stück
    if (!st.seen) { st.seen = true; this.playTalk(sd.intro, 'ekMini'); return; }
    this.ekResume();
  },
  ekResume() {
    const st = this.stations[this.cur], E = this.chapter.stations[this.cur].erklaer;
    if (st.ek.step <= 0) this.ekStartMini(false);
    else if (st.ek.step === 1) this.playTalk(E.uebersetzung, 'ekNochmal');
    else if (st.ek.step === 2) this.ekOpenBook(this.cur, true);
    else this.ekStartProbe();
  },
  ekBridge() {
    const n = this.ekN(), g = this.gates().find(x => x.gesperrt) || {};
    if (this.ekDone() < n) { this.playTalk(g.locked, 'map'); return; }
    if (this.ekMeister() < n && !this.ekConfirm) {
      this.ekConfirm = true; Sound.sfx('move');
      return;
    }
    Sound.setLayer('full');
    this.playTalk(this.chapter.finale, 'ekFinale');
  },

  /* Zusätzliche Dialog-Ausgänge; true = hier erledigt */
  ekAfterTalk(then) {
    const sd = this.cur >= 0 ? this.chapter.stations[this.cur] : null;
    const st = this.cur >= 0 ? this.stations[this.cur] : null;
    switch (then) {
      case 'ekMini':  this.ekStartMini(false); return true;
      case 'ekUeber': st.ek.step = 1; this.playTalk(sd.erklaer.uebersetzung, 'ekNochmal'); return true;
      case 'ekNochmal': this.ekFrageStart(); return true;                 // „Willst du das nochmal ausprobieren?"
      case 'ekNochmalK': this.ekFrageStart(true); return true;            // Erklärung von der Karte aus wiederholt
      case 'ekMeisterDoneF': st.ek.m = true; Sound.sfx('save'); this.save(); this.ekFrageStart(); return true;
      case 'ekSeite': {                     // seit 2026-11-18 wie in Kapitel 4: Die Stationsleitung reicht die Seite herüber, dann geht das Buch auf
        st.ek.step = 2; const S = this.chapter.stations[this.cur].erklaer.seite;
        this.gabe = { t0: this.t, st: this.cur, seite: true, rw: { name: Screen.fein ? 'eine Seite fürs Steigerbuch' : 'eine Seite fürs Buch', verb: 'Du erhältst', bild: 'seite', icon: '⚒', titel: S && S.titel } };
        this.view = 'gabe'; Sound.sfx('gabeFlug'); this.gabeKlang(); return true; }
      case 'ekOut':   this.ekAfterStation(); return true;
      case 'ekMeisterDone': this.ekAfterMeister(); return true;
      case 'ekFinale': this.playTalk(this.chapter.outro, 'outro'); return true;
    }
    return false;
  },

  /* ---------------- Nachfrage nach der Erklärung ---------------- */
  /* karte = true: von der Karte aus an einer erledigten Station; die erste Taste führt dann zurück zur Karte */
  ekFrageStart(karte) {
    this.em = null; this.task = null;
    this.ekf = { sel: 0, karte: !!karte };
    this.view = 'ekfrage';
    Sound.setLayer('full');
    this.save();
  },
  /* 0 weiter (die Stationsleitung übergibt die Seite, dann öffnet sich das Buch) bzw. zurück zur Karte,
     1 die Erklärung von Mathematthias nochmal, 2 dasselbe Minispiel nochmal, 3 Meisterprobe */
  ekFrageWahl(i) {
    if (!this.ekf) return;
    const karte = this.ekf.karte, sd = this.chapter.stations[this.cur];
    this.ekf = null;
    if (i === 1) { Sound.sfx('move'); this.playTalk(sd.erklaer.uebersetzung, karte ? 'ekNochmalK' : 'ekNochmal'); }
    else if (i === 2) { Sound.sfx('move'); this.ekStartMini(false, karte ? 'karte' : 'frage'); }
    else if (i === 3) { Sound.sfx('move'); this.ekStartMini(true, karte ? null : 'frage'); }
    else if (karte) { Sound.sfx('move'); this.gotoMap(false); }
    else this.playTalk(sd.outro, 'ekSeite');
  },

  /* ---------------- Minispiele ---------------- */
  /* rueck = 'frage': Das Spiel wurde aus der Nachfrage gestartet und kehrt dorthin zurück */
  ekStartMini(meister, rueck) {
    const sd = this.chapter.stations[this.cur], E = sd.erklaer, M = meister ? E.meister : E.mini;
    const em = { id: sd.id, meister: !!meister, M, hintN: 0, msg: null, won: false, t0: this.t, rueck: rueck || null };
    if (sd.id === 'stollen') { em.kind = 'latte'; em.w = meister ? 1 : 2; em.a = 0; }
    else if (sd.id === 'bremsberg') {
      em.kind = 'pendel'; em.hs = meister ? EK_PENDEL.hsMeister : EK_PENDEL.hs;
      em.sign = meister ? -1 : 1; em.h = em.sign * 1.5; em.min = 1.5;
      // Messhunt (seit 2026-11-17): Schritt 1 den langen Hunt an die Bremsstelle schieben (p = Lage der roten Achse), Schritt 2 kürzen
      em.phase = 'schieben'; em.p = meister ? 3.9 : 0.6; em.warteLos = false;
    }
    else if (sd.id === 'strecke') { em.kind = 'fahrt'; this.ekFahrtReset(em); }
    else if (M.korb) { em.kind = 'korb'; em.stufe = 0; this.ekKorbStufe(em); }
    else { em.kind = 'plan'; em.i = 0; em.val = 0; em.set = []; em.tri = false; }
    this.em = em; this.task = null; this.mini = null;
    this.view = 'emini';
    // Beim Hunt-Schieben spielt die Musik voll mit, bei den Denkspielen tritt sie zurück
    Sound.setLayer(em.kind === 'fahrt' ? 'full' : 'soft'); Sound.play(sd.music || 'field');
    this.save();
  },
  ekFahrtReset(em) { Object.assign(em, { s: 0, v: 0, zeit: 0, phase: 'bereit', log: [[0, 0]], vTuer: null, tTuer: null, ok: false, ausT: 0, knall: 0 }); },

  ekHint() {
    const em = this.em, st = this.stations[this.cur];
    if (!em || em.won || !em.M.hints) return;
    if (em.hintN < em.M.hints.length) { em.hintN++; st.ek.h = Math.min(3, st.ek.h + 1); this.hintsUsed++; Sound.sfx('hint'); }
  },
  ekMiss(text) {
    const st = this.stations[this.cur], em = this.em;
    st.ek.mw = Math.min(3, st.ek.mw + 1); this.wrong++;
    em.msg = text; Sound.sfx('wrong');
    // Nach dem zweiten Fehlgriff kommt der erste Tipp von selbst, wie an den Aufgabenstationen
    if (st.ek.mw >= 2 && em.hintN === 0 && em.M.hints && em.M.hints.length) em.hintN = 1;
  },
  ekWin() { this.em.won = true; this.em.msg = null; this.right++; Sound.sfx('right'); },
  ekMiniDone() {
    const sd = this.chapter.stations[this.cur], em = this.em;
    const meister = em.meister, M = em.M, st = this.stations[this.cur], rueck = em.rueck;
    this.em = null; this.task = null;
    Sound.setLayer('full');
    if (!meister && !rueck) st.ek.step = Math.max(st.ek.step, 1);       // gelöst: das Stationsbild zeigt es
    if (rueck === 'frage' && !meister) { this.ekFrageStart(); return; }  // nochmal gespielt: zurück zur Nachfrage
    if (rueck === 'karte' && !meister) { this.gotoMap(false); return; }  // von der Karte aus nochmal gespielt
    // erfolgFig: Erklärbild zum Erfolgssatz, wenn er sich auf den Graphen bezieht
    this.playTalk([{ bg: sd.bg, speaker: sd.head, text: M.erfolg, fig: M.erfolgFig || E_FIG(sd, meister) }],
                  meister ? (rueck === 'frage' ? 'ekMeisterDoneF' : 'ekMeisterDone') : 'ekUeber');
  },

  /* Messlatte */
  ekLatteMove(d) {
    const em = this.em; if (em.won || em.msg) return;
    const a = Math.round((em.a + d * EK_LATTE.schritt) * 2) / 2;
    if (a < 0 || a > EK_LATTE.xmax - em.w + 1e-9) { Sound.sfx('wrong'); return; }
    em.a = a; Sound.sfx('tick');
  },
  /* Ziehen mit Maus oder Finger (seit 2026-11-17): Die Mitte der Latte folgt dem Zeiger, im selben Raster wie die Pfeiltasten */
  ekLatteDrag(px) {
    const em = this.em; if (!em || em.kind !== 'latte' || em.won || em.msg) return;
    let a = Math.round(((px - 20) / 35 - em.w / 2) * 2) / 2;
    a = Math.max(0, Math.min(Math.floor((EK_LATTE.xmax - em.w) * 2 + 1e-9) / 2, a));
    if (Math.abs(a - em.a) > 1e-9) { em.a = a; Sound.sfx('tick'); }
  },
  ekLatteSet() {
    const em = this.em; if (em.won || em.msg) return;
    if (Math.abs(em.a - ekLatteBeste(em.w)) < 1e-9) { this.ekWin(); return; }
    this.ekMiss('Hier zeigt die Latte ' + ekZahl(ekLatteSteigung(em.a, em.w), 2) +
                '. Anderswo geht es im Schnitt noch steiler bergab.');
  },

  /* Pendel: Die gelbe Markierung wird an die Bremsstelle herangezogen (Finger, Maus) oder
     rückt mit den Pfeiltasten stufenweise heran. em.h ist der Abstand mit Vorzeichen,
     em.min der kleinste Abstand, der schon erreicht war: bis dorthin füllt sich die Tabelle. */
  ekPendelMin(em) { return Math.abs(em.hs[em.hs.length - 1]); },
  /* Schritt 1: den Messhunt verschieben; d = -1 nach links, 1 nach rechts. Kommt die rote Achse an die Bremsstelle, rastet sie ein. */
  ekHuntGrenzen(em) { return em.sign > 0 ? [0.05, 4.1 - EK_PENDEL.lang] : [0.05 + EK_PENDEL.lang, 4.1]; },
  ekHuntSetz(p) {
    const em = this.em, [lo, hi] = this.ekHuntGrenzen(em);
    p = Math.max(lo, Math.min(hi, p));
    if (Math.abs(p - EK_PENDEL.x0) <= 0.13) { em.p = EK_PENDEL.x0; em.phase = 'kuerzen'; em.warteLos = !!Input.down; Sound.sfx('right'); return; }
    if (Math.abs(p - em.p) > 1e-9) { em.p = p; Sound.sfx('tick'); }
  },
  ekHuntSchieb(d) {
    const em = this.em; if (!em || em.phase !== 'schieben' || em.won || em.msg) return;
    const p = Math.round((em.p + d * 0.25) * 100) / 100, [lo, hi] = this.ekHuntGrenzen(em);
    if (p < lo - 1e-9 || p > hi + 1e-9) { Sound.sfx('wrong'); return; }
    this.ekHuntSetz(p);
  },
  /* Wie unruhig das verfluchte Pendel schwingt: fern der Bremsstelle wild, an ihr weniger, beim Kürzen immer weniger, am Ende hängt es still */
  /* Gekoppelt an die Mathematik: Ausschlag = 2 x Abstand zwischen der Steigung, die der Hunt misst (Sekante), und der an der
     Bremsstelle (Tangente). Physikalisch ist das Schwingen der Fluch; dass es am Ende still und senkrecht hängt, ist richtig. */
  ekPendelUnruhe(em) {
    const f = EKF.bremsberg, x0 = EK_PENDEL.x0, d = 1e-6, ft = (f(x0 + d) - f(x0 - d)) / (2 * d);
    const start = 2 * Math.abs(ekPendelSteigung(em.sign * EK_PENDEL.lang) - ft);
    // Schritt 1: nach der Entfernung der roten Achse von der Bremsstelle, beim Einrasten genau der Startwert von Schritt 2.
    // (Nicht nach der Steigung: Steht der lange Hunt symmetrisch über der Stelle, misst er bei dieser Parabel zufällig schon -1.)
    if (em.phase === 'schieben') return Math.min(1.1, start + 0.4 * Math.abs(em.p - x0));
    return Math.min(1.1, 2 * Math.abs(ekPendelSteigung(em.h) - ft));
  },
  ekPendelSetz(h) {
    const em = this.em, vorher = em.min;
    em.h = h; em.min = Math.min(em.min, Math.abs(h));
    if (em.hs.some(t => Math.abs(t) < vorher - 1e-9 && Math.abs(t) >= em.min - 1e-9)) Sound.sfx('tick');   // neue Tabellenzeile
  },
  /* px: Bildschirm-x des Fingers; das Bild rechnet mit X(x) = 14 + 46x */
  ekPendelDrag(px) {
    const em = this.em; if (!em || em.kind !== 'pendel' || em.won || em.msg || em.warteLos) return;
    if (em.phase === 'schieben') { this.ekHuntSetz(Math.round(((px - 14) / 46 - em.sign * EK_PENDEL.lang / 2) * 20) / 20); return; }   // die Mitte des Hunts folgt dem Zeiger
    const lo = this.ekPendelMin(em);
    let a = ((px - 14) / 46 - EK_PENDEL.x0) * em.sign;               // Abstand in Richtung der Markierung
    a = a < 0.02 ? lo : Math.min(EK_PENDEL.hmax, Math.round(a * 100) / 100);   // ganz heran: der kleinste Abstand, nie 0
    if (Math.abs(a - Math.abs(em.h)) > 1e-9) this.ekPendelSetz(em.sign * a);
  },
  /* d = 1: eine Stufe näher, d = -1: eine Stufe zurück */
  ekPendelStep(d) {
    const em = this.em; if (em.won || em.msg) return;
    if (em.phase === 'schieben') { this.ekHuntSchieb(em.p < EK_PENDEL.x0 ? 1 : -1); return; }   // Enter in Schritt 1: ein Stück auf die Bremsstelle zu
    const lo = this.ekPendelMin(em), T = EK_PENDEL.tritte.filter(t => t >= lo - 1e-9), a = Math.abs(em.h);
    let ziel;
    if (d > 0) ziel = T.find(t => t < a - 1e-9); else ziel = T.slice().reverse().find(t => t > a + 1e-9);
    if (ziel === undefined) { Sound.sfx('wrong'); return; }
    this.ekPendelSetz(em.sign * ziel); Sound.sfx('move');
  },
  ekPendelBereit(em) { return em.phase !== 'schieben' && em.min <= this.ekPendelMin(em) + 1e-9; },
  /* Die Tabelle steht: jetzt entscheiden, was man dem Bremser zuruft */
  ekPendelFrage() {
    const em = this.em; if (em.won || em.msg || !this.ekPendelBereit(em)) return;
    const M = em.M;
    this.task = buildTask({ q: M.frage, options: M.auswahl }, this.nextSeed());
    this.task.ekWahl = true; this.task.noHints = true;
    this.taskPhase = 'ask'; this.pick = -1; this.sel = 0;
    this.view = 'task';
  },

  /* Fahrtenschreiber: läuft in Echtzeit, push = es wird geschoben */
  ekFahrtUpdate(dt, push, brems) {
    const em = this.em, F = EK_FAHRT;
    if (!em || em.kind !== 'fahrt' || em.won || em.msg) return;
    if (em.knall > 0) em.knall -= dt;
    if (em.phase === 'bereit') { if (push) em.phase = 'fahrt'; else return; }
    if (em.phase === 'aus') { em.ausT += dt; return; }
    const s0 = em.s;
    em.gas = !!push && !brems; em.brems = !!brems;
    em.v = Math.max(0, Math.min(F.vmax, em.v + (brems ? -F.bremse : push ? F.schub : -F.rollen) * dt));
    em.s += em.v * dt; em.zeit += dt;
    if (s0 < F.tuer && em.s >= F.tuer) { em.vTuer = em.v; em.tTuer = em.zeit; if (ekRund1(em.v) > F.vTuer + 1e-9) { em.knall = 0.6; Sound.sfx('damage'); } else Sound.sfx('unlock'); }
    const last = em.log[em.log.length - 1];
    if (em.zeit - last[0] >= 0.2) em.log.push([em.zeit, em.s]);
    if (em.s >= F.lang || em.zeit > 120) {
      em.s = Math.min(em.s, F.lang); em.log.push([em.zeit, em.s]);
      em.phase = 'aus'; em.ausT = 0;
      em.schnitt = F.lang / em.zeit;
      em.zuLang = em.s < F.lang;
      em.ok = !em.zuLang && ekRund1(em.vTuer) <= F.vTuer + 1e-9 && (!em.meister || ekRund1(em.schnitt) >= F.schnittMeister - 1e-9);
      Sound.sfx(em.ok ? 'right' : 'wrong');
    }
  },
  ekFahrtWeiter() {
    const em = this.em;
    if (em.phase !== 'aus' || em.ausT < 0.7) return;
    if (em.ok) { this.right++; this.ekMiniDone(); return; }
    const st = this.stations[this.cur];
    st.ek.mw = Math.min(3, st.ek.mw + 1); this.wrong++; em.fehl = (em.fehl || 0) + 1;   // em.fehl: Fehlversuche in diesem Spiel (Dreieck ab 1, Warnung ab 3)
    if (st.ek.mw >= 2 && em.hintN === 0) em.hintN = 1;
    this.ekFahrtReset(em);
  },

  /* Förderkorb am Füllort: Hunte mit Termen auf die Plätze des Differentialquotienten
     schieben. Zwei Stufen: erst die Stellen (x₀+h, x₀, h), dann die Funktion anwenden.
     em.auf[Platz] = Index des Hunts in em.hunte; ein Hunt steht entweder im Bahnhof
     oder auf einem Platz. */
  ekKorbStufe(em) {
    const S = em.M.korb.stufen[em.stufe];
    em.S = S; em.plaetze = Object.keys(S.plaetze);
    em.hunte = RNG(this.nextSeed()).shuffle(S.hunte.slice());
    em.auf = {}; em.hsel = 0; em.psel = 0; em.bereit = false; em.gut = false;
  },
  ekKorbFrei(em, i) { return !em.plaetze.some(p => em.auf[p] === i); },
  ekKorbVoll(em) { return em.plaetze.every(p => em.auf[p] !== undefined); },
  ekKorbTile(d) {
    const em = this.em; if (em.won || em.msg) return;
    em.bereit = false;
    const n = em.hunte.length;
    for (let k = 1; k <= n; k++) { const i = (em.hsel + d * k + n * k) % n; if (this.ekKorbFrei(em, i)) { em.hsel = i; break; } }
    Sound.sfx('move');
  },
  ekKorbSlot(d) {
    const em = this.em; if (em.won || em.msg) return;
    em.bereit = false;
    em.psel = (em.psel + d + em.plaetze.length) % em.plaetze.length; Sound.sfx('move');
  },
  /* Hunt i auf den gewählten Platz; stand dort schon einer, rollt er zurück in den Bahnhof */
  ekKorbPut(i) {
    const em = this.em; if (em.won || em.msg) return;
    if (!this.ekKorbFrei(em, i)) return;
    em.auf[em.plaetze[em.psel]] = i; em.rollT = this.t; em.rollP = em.plaetze[em.psel];
    Sound.sfx('tick');
    const leer = em.plaetze.findIndex(p => em.auf[p] === undefined);
    if (leer >= 0) em.psel = leer;
    em.bereit = this.ekKorbVoll(em);
    for (let k = 0; k < em.hunte.length; k++) { const j = (i + k) % em.hunte.length; if (this.ekKorbFrei(em, j)) { em.hsel = j; break; } }
  },
  /* Platz antippen: wählen; ein besetzter Platz gibt seinen Hunt zurück */
  ekKorbTap(pi) {
    const em = this.em; if (em.won || em.msg) return;
    const p = em.plaetze[pi];
    if (em.auf[p] !== undefined) { em.hsel = em.auf[p]; delete em.auf[p]; Sound.sfx('move'); }
    em.psel = pi; em.bereit = false;
  },
  ekKorbPush() {
    const em = this.em; if (em.won || em.msg) return;
    if (em.bereit && this.ekKorbVoll(em)) { this.ekKorbCheck(); return; }
    this.ekKorbPut(em.hsel);
  },
  ekKorbCheck() {
    const em = this.em, S = em.S;
    const falsch = em.plaetze.filter(p => em.hunte[em.auf[p]] !== S.plaetze[p]);
    if (!falsch.length) {
      if (em.stufe < em.M.korb.stufen.length - 1) {          // nächste Stufe, mit kurzer Bestätigung
        em.stufe++; this.ekKorbStufe(em);
        em.msg = S.gut || 'Stimmt. Weiter.'; em.gut = true; Sound.sfx('right');
      } else this.ekWin();
      return;
    }
    const p = falsch[0], label = em.hunte[em.auf[p]];
    const richtigWoanders = Object.keys(S.plaetze).some(q => S.plaetze[q] === label);
    const text = (S.warum && S.warum[label + '@' + p]) || (richtigWoanders ? S.tausch : null) ||
                 (S.warum && S.warum[label]) || 'Dieser Hunt gehört nicht auf diesen Platz.';
    for (const q of falsch) delete em.auf[q];                // falsche Hunte rollen zurück
    em.psel = em.plaetze.indexOf(p); em.bereit = false;
    this.ekMiss(text);
  },

  /* Neigungsplan */
  ekPlanMove(d) {
    const em = this.em; if (em.won || em.msg) return;
    const v = Math.round((em.val + d * EK_PLAN.raster) * 10) / 10;
    if (v < EK_PLAN.vmin - 1e-9 || v > EK_PLAN.vmax + 1e-9) { Sound.sfx('wrong'); return; }
    em.val = v; Sound.sfx('tick');
  },
  /* Ziehen mit Maus oder Finger (seit 2026-11-17): der Punkt folgt dem Zeiger senkrecht, im Raster der Plus-/Minus-Tasten.
     py: Bildschirm-y; das Bild rechnet mit Y2(v) = 150 - 13,4 v */
  ekPlanDrag(py) {
    const em = this.em; if (!em || em.kind !== 'plan' || em.won || em.msg) return;
    let v = Math.round((150 - py) / 13.4 / EK_PLAN.raster) * EK_PLAN.raster;
    v = Math.round(Math.max(EK_PLAN.vmin, Math.min(EK_PLAN.vmax, v)) * 10) / 10;
    if (Math.abs(v - em.val) > 1e-9) { em.val = v; Sound.sfx('tick'); }
  },
  ekPlanSet() {
    const em = this.em; if (em.won || em.msg) return;
    const x = EK_PLAN.halte[em.i], soll = EKF.kartenAbl(x);
    if (ekPlanOk(x, em.val)) {
      em.set.push(em.val); em.i++; em.val = 0; em.tri = false; Sound.sfx('tick');
      if (em.i >= EK_PLAN.halte.length) this.ekWin();
      return;
    }
    em.tri = true;
    const kl = v => Math.abs(v) < 1e-6 ? 0 : (v > 0 ? 1 : -1);
    let txt;
    if (kl(soll) !== kl(em.val))
      txt = kl(soll) === 0 ? 'Hier liegt die Tangente waagerecht. Die Steigung ist null: Punkt auf die Achse.'
          : kl(soll) > 0 ? 'Hier steigt die Strecke. Der Punkt gehört über die Achse.'
          : 'Hier fällt die Strecke. Der Punkt gehört unter die Achse.';
    else txt = (em.val > soll ? 'Zu hoch geschätzt.' : 'Zu tief geschätzt.') + ' Das Pendel misst nach: Am Steigungsdreieck steht jetzt, wie weit es bei 1 nach rechts hoch oder runter geht.';
    this.ekMiss(txt);
  },

  /* ---------------- Steigerbuch ---------------- */
  ekOpenBook(page, gain) {
    this.buch = { page: Math.max(0, page || 0), sub: 0, gain: !!gain, t0: -99 };   // die Lichtkranz-Übergabe ist abgelöst (Matthias: übertrieben); die Seite übergibt jetzt der Gabe-Bildschirm
    this.view = 'buch';
    Sound.setLayer('soft');
    this.save();
  },
  ekBookNext() {
    const b = this.buch, n = this.ekN();
    if (b.gain && this.t - (b.t0 || -99) < EK_UEBERGABE) { b.t0 = -99; return; }   // Tippen während der Übergabe: gleich zum Buch
    if (b.sub === 0 && this.ekHasPage(b.page)) { b.sub = 1; Sound.sfx('move'); return; }
    if (b.gain) { this.buch = null; this.stations[this.cur].ek.step = 3; this.ekStartProbe(); return; }
    if (b.page < n - 1) { b.page++; b.sub = 0; Sound.sfx('move'); return; }
    this.ekBookClose();
  },
  ekBookTurn(d) {
    const b = this.buch; if (b.gain) return;
    const p = b.page + d;
    if (p < 0 || p >= this.ekN()) return;
    b.page = p; b.sub = 0; Sound.sfx('move');
  },
  ekBookClose() { if (this.buch && this.buch.gain) return; this.buch = null; this.gotoMap(false); },

  /* ---------------- Probefrage ---------------- */
  ekStartProbe() {
    const st = this.stations[this.cur], sd = this.chapter.stations[this.cur], P = sd.erklaer.probe;
    this.task = buildTask(P[st.ek.pv % P.length], this.nextSeed());
    this.task.probe = true; this.task.noHints = true;
    this.taskPhase = 'ask'; this.pick = -1; this.sel = 0;
    this.view = 'task';
    Sound.setLayer('soft'); Sound.play(sd.music || 'field');
    this.save();
  },
  /* Antwort auf Probefrage oder auf die Auswahl am Ende eines Minispiels */
  ekAnswer(i) {
    const T = this.task, st = this.stations[this.cur], sd = this.chapter.stations[this.cur];
    this.pick = i;
    if (T.options[i].ok) {
      this.right++;
      if (T.ekWahl) { Sound.sfx('right'); this.ekMiniDone(); return; }
      this.taskOk = true; this.taskPhase = 'fb';
      this.fbSpeaker = sd.head || 'math';
      this.fbLine = pickLine(sd.praise, 'Richtig!');
      Sound.sfx('right');
      return;
    }
    this.wrong++; this.taskOk = false;
    this.wrongWhy = T.options[i].why || 'Das war es noch nicht.';
    this.tipMehr = false; T.mehr = (T.hints || []).concat(T.explain ? ['Kurz gesagt: ' + T.explain] : []);
    if (T.ekWahl) st.ek.mw = Math.min(3, st.ek.mw + 1); else st.ek.pw = Math.min(3, st.ek.pw + 1);
    this.oopsLine = pickLine(this.chapter.oops, "Oh nein!");
    this.gloatLine = pickLine(this.chapter.gloat, 'Hihi!');
    this.taskPhase = 'tip';
    Sound.sfx('wrong');
  },
  ekTipDone() {
    const T = this.task;
    if (T.ekWahl) {                      // zurück zur Auswahl, neu gemischt
      const em = this.em;
      this.task = buildTask({ q: em.M.frage, options: em.M.auswahl }, this.nextSeed());
      this.task.ekWahl = true; this.task.noHints = true;
      this.taskPhase = 'ask'; this.pick = -1; this.sel = 0;
      return;
    }
    this.taskPhase = 'morph'; Sound.sfx('magic');
  },
  ekMorphDone() { this.stations[this.cur].ek.pv++; this.ekStartProbe(); },
  /* Die Probefrage ist der letzte Schritt: Die Seite wurde schon vor dem Buch übergeben (outro) */
  ekAfterFeedback() {
    this.task = null; Sound.setLayer('full');
    this.ekAfterStation();
  },

  /* ---------------- Abschluss von Station und Meisterprobe ---------------- */
  ekAfterStation() {
    const st = this.stations[this.cur], K = this.chapter;
    st.state = ST_DONE; st.ek.step = 4;
    const d = this.ekDone(), n = this.ekN(), q = [];
    const med = K.medaillen || [];
    if (d >= 2 && !this.ekSeen.b && med[0]) { this.ekSeen.b = true; q.push(...med[0].szene); }
    if (d === n && !this.ekSeen.s) {
      this.ekSeen.s = true;
      if (med[1]) q.push(...med[1].szene);
      if (K.steigerbuch && K.steigerbuch.voll) q.push(...K.steigerbuch.voll);
      if (this.ekMeister() === n) {                       // schon alles gemeistert: gleich vergolden
        if (!this.ekSeen.g && med[2]) { this.ekSeen.g = true; q.push(...med[2].szene); }
      } else if (K.meisterprobe && K.meisterprobe.einladung) q.push(...K.meisterprobe.einladung);   // Gold in Aussicht
    }
    Sound.sfx('save');
    this.save();
    if (q.length) this.playTalk(q, 'map'); else this.gotoMap(false);
  },
  ekAfterMeister() {
    const st = this.stations[this.cur], K = this.chapter, med = K.medaillen || [];
    st.ek.m = true; Sound.sfx('save');
    this.save();
    if (this.ekMedal() === 3 && !this.ekSeen.g && med[2]) { this.ekSeen.g = true; this.playTalk(med[2].szene, 'map'); }
    else this.gotoMap(false);
  }
});

/* ---- Einhängen in den Spielkern: nur Kapitel mit Erklärinsel gehen diese Wege ---- */
(function () {
  const afterTalk = Game.afterTalk, enterStation = Game.enterStation, nextStage = Game.nextStage,
        answer = Game.answer, tipDone = Game.tipDone, morphDone = Game.morphDone,
        afterFeedback = Game.afterFeedback, gotoMap = Game.gotoMap, abortTask = Game.abortTask;
  Game.afterTalk = function (then) {
    if (this.isEk() && this.ekAfterTalk(then)) { this.save(); return; }
    afterTalk.call(this, then);
  };
  Game.enterStation = function (i) { if (this.isEk()) this.ekEnter(i); else enterStation.call(this, i); };
  /* Auf der Erklärinsel folgt auf die letzte Station kein Tor und kein Boss: es bleibt bei der Karte */
  Game.nextStage = function () { if (this.isEk()) { this.view = 'map'; this.save(); return; } nextStage.call(this); };
  Game.gotoMap = function (first) {
    gotoMap.call(this, first);
    if (this.isEk()) {
      this.em = null; this.buch = null; this.ekConfirm = false; this.ekf = null;
      if (this.ekDone() === this.ekN()) {          // alles entflucht: erst die Meisterproben, dann die Brücke
        const offen = this.stations.findIndex(s => !(s.ek && s.ek.m));
        this.sel = offen < 0 ? this.ekN() : offen;
      }
    }
  };
  Game.answer = function (i) {
    if (this.task && (this.task.probe || this.task.ekWahl)) { if (this.taskPhase === 'ask') this.ekAnswer(i); return; }
    answer.call(this, i);
  };
  Game.tipDone = function () { if (this.task && (this.task.probe || this.task.ekWahl)) this.ekTipDone(); else tipDone.call(this); };
  Game.morphDone = function () { if (this.task && this.task.probe) this.ekMorphDone(); else morphDone.call(this); };
  Game.afterFeedback = function () {
    if (this.task && this.task.probe) { if (this.taskOk) this.ekAfterFeedback(); return; }
    afterFeedback.call(this);
  };
  Game.abortTask = function () {
    if (this.isEk()) { if (this.cur < 0) return; Sound.sfx('move'); this.task = null; this.em = null; this.gotoMap(false); return; }
    abortTask.call(this);
  };
})();

/* ============================================================
   ERGEBNIS-CODE v3 (Erklärinsel): 16 Zeichen, an den Namen gebunden.
   Felder: Fassung 3 | Kapitel 5 | aktive Minuten 9 | Sitzungen 4 | Status 2 |
   Torfehler 3 | je Station (fünf): geschafft 1, Meisterprobe 1, Fehlgriffe im
   Minispiel 2, falsche Probefragen 2, Tipps 2 | Reserve 1 | Prüfsumme 13.
   Bis 2026-11-14 hatte der Code vier Stationen und 15 Zeichen; diese Fassung
   wurde nie an Lernende ausgegeben und wird nicht mehr gelesen.
   ============================================================ */
const CODE3_STATIONS = 5, CODE3_BODY = 67, CODE3_LEN = 16;
function codeSum(body, name) {
  let sum = nameKey(name) % 8191;
  for (let i = 0; i < body.length; i += 8) sum = (sum * 31 + parseInt(body.substr(i, 8).padEnd(8, '0'), 2)) % 8191;
  return sum;
}
function makeCode3(d, name) {
  const v = [[3, 3], [d.kap, 5], [Math.min(511, d.min), 9], [Math.min(15, d.ses), 4], [d.status, 2], [Math.min(7, d.gw), 3]];
  for (let i = 0; i < CODE3_STATIONS; i++) {
    const s = d.st[i] || {};
    v.push([s.done ? 1 : 0, 1], [s.m ? 1 : 0, 1], [Math.min(3, s.mw || 0), 2], [Math.min(3, s.pw || 0), 2], [Math.min(3, s.h || 0), 2]);
  }
  v.push([0, 1]);
  const body = packBits(v);                                   // 67 Bit
  const full = body + codeSum(body, name).toString(2).padStart(13, '0');   // 80 Bit
  let out = '';
  for (let i = 0; i < 80; i += 5) out += B32[parseInt(full.substr(i, 5), 2)];
  return out.substr(0, 4) + '-' + out.substr(4, 4) + '-' + out.substr(8, 4) + '-' + out.substr(12, 4);
}
function readCode3(c, name) {
  let bits = '';
  for (const ch of c) {
    const v = B32.indexOf(ch);
    if (v < 0) return { ok: false, err: 'Ungültiges Zeichen: ' + ch };
    bits += v.toString(2).padStart(5, '0');
  }
  const body = bits.substr(0, CODE3_BODY), sum = parseInt(bits.substr(CODE3_BODY, 13), 2);
  let o = 0; const take = n => { const x = parseInt(body.substr(o, n), 2); o += n; return x; };
  const res = { ok: codeSum(body, name) === sum, ver: take(3), kap: take(5), min: take(9), ses: take(4), status: take(2), gw: take(3), st: [] };
  for (let i = 0; i < CODE3_STATIONS; i++) res.st.push({ done: take(1), m: take(1), mw: take(2), pw: take(2), h: take(2) });
  res.done = res.st.filter(s => s.done).length; res.meister = res.st.filter(s => s.m).length;
  res.medal = (res.done === CODE3_STATIONS && res.meister === CODE3_STATIONS) ? 3 : (res.done === CODE3_STATIONS ? 2 : 0);
  if (res.ver !== 3) res.ok = false;
  if (!res.ok) res.err = 'Code passt nicht zu diesem Namen.';
  return res;
}
const MEDAL_TEXT = ['schlicht', 'in Bronze', 'in Silber', 'in Gold'];

/* ===== 47_code4.js ===== */
/* ============================================================
   ERGEBNIS-CODE STUFE 2 (Fassung 4, gebaut am 2026-11-17, ab Kapitel 4 mit codeLang: true)

   Der kurze Code (12 Zeichen, Fassung 2) bleibt auf dem Schlussbild. Ins Kopierfeld und in die
   Mail kommt der lange Code: je Teilaufgabe Fehlversuche, selbst geholte Tipps und der erste
   gewählte Ablenker, je Ort Stand und Sperren, je Bossfrage der Versuch, der getroffen hat.
   Der Code beschreibt seinen Aufbau selbst (Zahl der Orte, Teilaufgaben je Ort, Bossfragen),
   die Auswertung (web_src/auswertung.html) liest ihn deshalb ohne die Inhaltsdatei.

   Bits, in dieser Reihenfolge:
     Fassung 3 (=4) | Kapitel 5 | Status 2 | aktive Minuten 9 | Sitzungen 4 | Punkte 10 |
     Torfehler 3 | Übungsdurchgänge 4 | Orte 4 |
     je Ort: Teilaufgaben 3 | Stand 2 (0 offen, 1 gesperrt, 2 gelöst) | erreichte Teilaufgabe 3 | Sperren 2 |
             je Teilaufgabe: Fehlversuche 2 | Tipps 2 | erster Ablenker 2 (0 keiner, 1..3 = falsche
             Antworten in der Reihenfolge der Inhaltsdatei und des Textbuchs) |
     Bossfragen 4 | je Bossfrage 2 (0 nicht erreicht, 1 im ersten Versuch, 2 im zweiten, 3 später
             oder von Mathematthias gerettet) |
     Nullen bis zur vollen Zeichenzahl | Prüfsumme 16 (am Vornamen)
   Alle Zähler sind gedeckelt: 3 heißt „3 oder mehr", Torfehler 7 „7 oder mehr".
   Dieselbe Kodierung steht in web_src/auswertung.html - Änderungen an beiden Stellen.
   ============================================================ */
const CODE4_VER = 4;

function code4Summe(body, name) {
  let s = nameKey(name) % 65521;
  for (let i = 0; i < body.length; i += 8) s = (s * 31 + parseInt(body.substr(i, 8).padEnd(8, '0'), 2)) % 65521;
  return s;
}

function makeCode4(d, name) {
  const v = [[CODE4_VER, 3], [d.kap, 5], [d.status, 2], [Math.min(511, d.min), 9], [Math.min(15, d.ses), 4], [Math.min(1023, d.pts), 10],
             [Math.min(7, d.gw), 3], [Math.min(15, d.ueb), 4], [d.orte.length, 4]];
  for (const o of d.orte) {
    v.push([o.t.length, 3], [o.stand, 2], [Math.min(7, o.ti), 3], [Math.min(3, o.n), 2]);
    for (const a of o.t) v.push([Math.min(3, a[0]), 2], [Math.min(3, a[1]), 2], [Math.min(3, a[2]), 2]);
  }
  v.push([d.boss.length, 4]);
  for (const b of d.boss) v.push([b, 2]);
  let body = packBits(v);
  while ((body.length + 16) % 5) body += '0';
  const full = body + code4Summe(body, name).toString(2).padStart(16, '0');
  let out = '';
  for (let i = 0; i < full.length; i += 5) out += B32[parseInt(full.substr(i, 5), 2)];
  return out.match(/.{1,5}/g).join('-');
}

function readCode4(c, name) {
  let bits = '';
  for (const ch of c) { const x = B32.indexOf(ch); if (x < 0) return { ok: false, err: 'Ungültiges Zeichen: ' + ch }; bits += x.toString(2).padStart(5, '0'); }
  const body = bits.substr(0, bits.length - 16), sum = parseInt(bits.substr(bits.length - 16), 2);
  let o = 0; const take = n => { const x = parseInt(body.substr(o, n) || '0', 2); o += n; return x; };
  const r = { ver: take(3), kap: take(5), status: take(2), min: take(9), ses: take(4), pts: take(10), gw: take(3), ueb: take(4), orte: [], boss: [] };
  const n = take(4);
  for (let i = 0; i < n; i++) {
    const ort = { nt: take(3), stand: take(2), ti: take(3), n: take(2), t: [] };
    for (let k = 0; k < ort.nt; k++) ort.t.push({ f: take(2), h: take(2), a: take(2) });
    r.orte.push(ort);
  }
  const nb = take(4);
  for (let i = 0; i < nb; i++) r.boss.push(take(2));
  r.ok = r.ver === CODE4_VER && o <= body.length && code4Summe(body, name) === sum;
  if (!r.ok) r.err = r.ver !== CODE4_VER ? 'Unbekannte Codefassung.' : 'Code passt nicht zu diesem Namen.';
  // abgeleitet: gelöste Teilaufgaben, Summen
  r.orte.forEach(ort => { ort.geloest = ort.stand === 2 ? ort.nt : Math.min(ort.nt, ort.ti); });
  r.right = r.orte.reduce((a, x) => a + x.geloest, 0);
  r.wrong = r.orte.reduce((a, x) => a + x.t.reduce((b, y) => b + y.f, 0), 0);
  r.hints = r.orte.reduce((a, x) => a + x.t.reduce((b, y) => b + y.h, 0), 0);
  return r;
}

/* Protokoll im Spiel: je Ort Sperren und je Teilaufgabe [Fehlversuche, Tipps, erster Ablenker];
   Bossfragen getrennt. Nur Spielen zählt, Üben nicht. */
function code4Protokoll(chapter) {
  return chapter.stations.map(sd => ({ n: 0, t: (sd.tasks || []).map(() => [0, 0, 0]) }));
}

   Zeichenbereich: y = 8 .. 119
   ============================================================ */

const BGY = 8, BGH = 112;

const STARS = [];
(function () {
  let seed = 20260915;
  const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
  for (let i = 0; i < 46; i++) STARS.push({ x: (rnd() * 320) | 0, y: BGY + (rnd() * 60) | 0, p: rnd() * 6 });
})();

function drawStars(t, dense) {
  for (const s of STARS) {
    const b = Math.sin(t * 1.7 + s.p);
    Screen.px(s.x, s.y, b > 0.55 ? WHITE : (b > 0 ? LTGREY : DGREY));
  }
}

function plotFn(f, x0, x1, col, clipTop, clipBot) {
  let prev = null;
  for (let px = x0; px <= x1; px++) {
    const y = f(px);
    if (!isFinite(y)) { prev = null; continue; }
    const yy = Math.round(y);
    if (prev !== null) {
      const a = Math.min(prev, yy), b = Math.max(prev, yy);
      for (let q = a; q <= b; q++) if (q >= clipTop && q <= clipBot) Screen.px(px, q, col);
    } else if (yy >= clipTop && yy <= clipBot) Screen.px(px, yy, col);
    prev = yy;
  }
}

/* ---------- Hafen von Sinusia: W(t) = 1,8 sin(pi/6 (t-4)) + 3,2 ---------- */

  drawStars(t);
  // Mond
  Screen.rect(268, BGY + 8, 14, 14, LTGREY);
  Screen.rect(266, BGY + 10, 14, 12, LTGREY);

  Screen.rect(0, BGY + 62, 54, 50, DGREY);
  Screen.rect(0, BGY + 62, 54, 2, GREY);
  // Leuchtturm
  Screen.rect(14, BGY + 22, 14, 42, LTGREY);
  for (let i = 0; i < 6; i++) Screen.rect(14, BGY + 26 + i * 7, 14, 3, i % 2 ? RED : LTGREY);
  Screen.rect(11, BGY + 16, 20, 7, DGREY);
  Screen.rect(15, BGY + 10, 12, 7, (Math.sin(t * 2) > 0) ? YELLOW : BROWN);

  }
  // Wasserstand nach der Modellfunktion, Zeit läuft 1 h pro Sekunde
  const hour = (t * 1.1) % 24;
  const W = 1.8 * Math.sin(Math.PI / 6 * (hour - 4)) + 3.2;   // 1,4 .. 5,0 m
  const waterY = BGY + 104 - Math.round((W - 1.4) / 3.6 * 34);
  for (let x = 0; x < SW; x++) {

    const y = waterY + Math.round(wave);
    Screen.rect(x, y, 1, BGY + BGH - y, BLUE);
    Screen.px(x, y, LTBLUE);
    if ((x + ((t * 9) | 0)) % 17 === 0) Screen.px(x, y - 1, CYAN);
  }
  // Schiff, schwimmt mit
  const sx = 176 + Math.round(Math.sin(t * 0.7) * 5), sy = waterY - 16;
  Screen.rect(sx, sy + 10, 44, 7, BROWN);
  Screen.rect(sx + 4, sy + 6, 36, 5, ORANGE);
  Screen.rect(sx + 20, sy - 14, 2, 22, LTGREY);
  for (let i = 0; i < 10; i++) Screen.rect(sx + 22, sy - 12 + i, 12 - i, 1, WHITE);
  // Pegelskala
  Screen.rect(56, BGY + 64, 1, 42, GREY);
  for (let m = 0; m <= 6; m++) {
    const y = BGY + 104 - Math.round((m - 1.4) / 3.6 * 34);
    if (y > BGY + 60 && y < BGY + 110) Screen.rect(54, y, 5, 1, GREY);
  }
  Screen.text(('' + W.toFixed(1) + 'm').padStart(5), 8, (BGY + 66) / 8 | 0, CYAN);
  Screen.text(('' + Math.floor(hour)).padStart(2, '0') + ':00', 8, ((BGY + 74) / 8) | 0, YELLOW);
}

function bgRiesenrad(t) {

    Screen.px(cx + Math.round(Math.cos(r) * R), cy + Math.round(Math.sin(r) * R), LTGREY);
  }
  for (let g = 0; g < 8; g++) {
    const r = ang + g * Math.PI / 4;
    for (let k = 0; k < R; k++) Screen.px(cx + Math.round(Math.cos(r) * k), cy + Math.round(Math.sin(r) * k), DGREY);
    const gx = cx + Math.round(Math.cos(r) * R), gy = cy + Math.round(Math.sin(r) * R);
    const col = [RED, YELLOW, CYAN, LTGREEN, ORANGE, PURPLE, LTBLUE, WHITE][g];
    Screen.rect(gx - 3, gy, 7, 5, col);
    Screen.rect(gx - 3, gy, 7, 1, BLACK);
  }
  Screen.rect(cx - 3, cy - 3, 7, 7, YELLOW);
  // Höhenanzeige der markierten Gondel
  const h = 25 - 20 * Math.cos(ang);
  Screen.rect(286, BGY + 20, 26, 76, BLACK);
  Screen.frame(286, BGY + 20, 26, 76, GREY);
  const bar = Math.round(h / 45 * 70);
  Screen.rect(288, BGY + 92 - bar, 22, bar, LTGREEN);
  Screen.text(h.toFixed(0) + 'm', 36, ((BGY + 24) / 8) | 0, BLACK);
}

/* ---------- Glockenturm: s(t) = 4 e^(-0,2t) cos(2t) ---------- */
function bgGlocke(t) {
  Screen.rect(0, BGY, SW, BGH, BLACK);

  // Aufhaengung
  Screen.rect(124, BGY + 40, 72, 2, GREY);
  const tau = (t * 1.4) % 14;
  const s = 4 * Math.exp(-0.2 * tau) * Math.cos(2 * tau);
  const off = Math.round(s * 6);
  // Seil
  for (let k = 0; k < 18; k++) Screen.px(160 + Math.round(off * k / 18), BGY + 42 + k, LTGREY);
  // Glocke
  const gx = 160 + off, gy = BGY + 60;
  Screen.rect(gx - 12, gy + 16, 25, 4, BROWN);
  Screen.rect(gx - 10, gy + 8, 21, 9, YELLOW);
  Screen.rect(gx - 7, gy + 2, 15, 7, YELLOW);
  Screen.rect(gx - 4, gy - 2, 9, 5, YELLOW);
  Screen.rect(gx - 8, gy + 8, 3, 9, ORANGE);
  Screen.rect(gx - 1, gy + 20, 3, 4, ORANGE);
  // Amplitudenhuellkurve rechts als Graph
  const ox = 212, oy = BGY + 30;
  const gTop = BGY + 8, gBot = BGY + 52;
  Screen.rect(ox - 2, gTop - 2, 100, gBot - gTop + 4, BLACK);
  Screen.frame(ox - 2, gTop - 2, 100, gBot - gTop + 4, DGREY);
  Screen.rect(ox, oy, 96, 1, GREY);
  plotFn(px => oy - (4 * Math.exp(-0.2 * (px - ox) / 7)) * 2.4, ox, ox + 95, RED, gTop, gBot);
  plotFn(px => oy + (4 * Math.exp(-0.2 * (px - ox) / 7)) * 2.4, ox, ox + 95, RED, gTop, gBot);
  plotFn(px => oy - (4 * Math.exp(-0.2 * (px - ox) / 7) * Math.cos(2 * (px - ox) / 7)) * 2.4,
         ox, ox + 95, LTGREEN, gTop, gBot);
  const mx = ox + Math.round(tau * 7);
  if (mx < ox + 96) Screen.rect(mx, gTop, 1, gBot - gTop, YELLOW);
}

/* ---------- Koordinatensystem mit frei waehlbarer Funktion ---------- */
function bgGraph(t, fn, xmin, xmax, ymin, ymax, col, label) {
  Screen.rect(0, BGY, SW, BGH, BLACK);
  const L = 26, R = 306, T = BGY + 6, B = BGY + 102;
  const X = x => L + (x - xmin) / (xmax - xmin) * (R - L);
  const Y = y => B - (y - ymin) / (ymax - ymin) * (B - T);
  // Raster
  for (let gx = Math.ceil(xmin); gx <= xmax; gx++) {
    const px = Math.round(X(gx));
    for (let py = T; py <= B; py += 4) Screen.px(px, py, DGREY);
  }
  for (let gy = Math.ceil(ymin); gy <= ymax; gy++) {
    const py = Math.round(Y(gy));
    for (let px = L; px <= R; px += 4) Screen.px(px, py, DGREY);
  }
  // Achsen
  const y0 = Math.round(Y(Math.max(ymin, Math.min(ymax, 0))));
  const x0 = Math.round(X(Math.max(xmin, Math.min(xmax, 0))));
  Screen.rect(L, y0, R - L, 1, GREY);
  Screen.rect(x0, T, 1, B - T, GREY);
  plotFn(px => Y(fn((px - L) / (R - L) * (xmax - xmin) + xmin)), L, R, col, T, B);
  if (label) Screen.text(label, 4, (BGY / 8) | 0, col);
}

   KAPITEL 2 - LINEARA UND QUADRATA
   Lineara ist aus Geraden gebaut, Quadrata aus Parabeln.
   ============================================================ */

/* Nachtmeer mit Wellen ab Hoehe y0 */
function drawSea(t, y0, col) {
  for (let x = 0; x < SW; x++) {
    const y = y0 + Math.round(Math.sin(x / 11 + t * 1.8) * 1.2 + Math.sin(x / 4 - t) * 0.6);
    Screen.rect(x, y, 1, BGY + BGH - y, col === undefined ? BLUE : col);
    Screen.px(x, y, LTBLUE);
    if ((x * 7 + ((t * 11) | 0)) % 23 === 0) Screen.px(x, y + 4, CYAN);
  }
}

/* Lineara am Horizont: nur gerade Kanten */
function drawLinearaSil(x, y, s, col) {
  for (let i = 0; i <= 40 * s; i++) {
    const h = i < 16 * s ? i * 0.9 : (i < 28 * s ? 16 * s * 0.9 : 16 * s * 0.9 - (i - 28 * s) * 1.2);
    if (h > 0) Screen.rect(x + i, y - Math.round(h), 1, Math.round(h), col);
  }
}
/* Quadrata am Horizont: ein Parabelbogen */
function drawQuadrataSil(x, y, s, col) {
  const w = 44 * s;
  for (let i = 0; i <= w; i++) {
    const u = (i - w / 2) / (w / 2);
    const h = Math.round(18 * s * (1 - u * u));
    if (h > 0) Screen.rect(x + i, y - h, 1, h, col);
  }
}

/* Lineara: ein Viereck aus vier Geraden, mit Koordinatengitter */

  mapSea(t);

  for (let x = 14; x <= 306; x++) {
    const y1 = Math.round(BGY + top(x)), y2 = Math.round(BGY + bot(x));

    if (x % 20 === 0) for (let y = y1 + 2; y < y2; y += 3) Screen.px(x, y, ORANGE);
  }
  for (let y = BGY + 32; y < BGY + 104; y += 16)
    for (let x = 16; x < 304; x += 3) if (y > BGY + top(x) + 1 && y < BGY + bot(x) - 1) Screen.px(x, y, ORANGE);
  Screen.rect(14, BGY + Math.round(top(14)), 1, Math.round(bot(14) - top(14)), YELLOW);
  Screen.rect(306, BGY + Math.round(top(306)), 1, Math.round(bot(306) - top(306)), YELLOW);

  for (let x = 30; x < 290; x += 2) Screen.px(x, BGY + Math.round(96 - x * 0.2), LTGREY);

/* ============================================================
   FEINE AUFLÖSUNG (640x400) - Malhelfer für Szenen ab Kapitel 5.
   Kapitel mit aufloesung: 2 bekommen einen zweiten Bildpuffer (Screen.hbuf). Eine feine Szene
   ruft hiSzene(name, malen): Das Standbild wird einmal gemalt und danach aus dem Speicher
   geholt; Bewegtes malt die Szene danach in jedem Bild selbst. Die Fläche im alten Puffer wird
   durchsichtig (HKEY), Figuren, Kästen und Schrift liegen wie bisher darüber.
   Koordinaten hier immer in feinen Punkten: Bildfläche y = 16 .. 239, x = 0 .. 639.
   ============================================================ */
const HW = 640, HH = 400, HY0 = 16, HBH = 224;
const HB8 = (function () { const m = []; for (let y = 0; y < 8; y++) { m.push([]); for (let x = 0; x < 8; x++) { let v = 0; for (let b = 0; b < 3; b++) { const xb = (x >> b) & 1, yb = (y >> b) & 1; v |= ((xb ^ yb) << (2 * (2 - b) + 1)) | (yb << (2 * (2 - b))); } m[y].push(v); } } return m; })();
const H2 = {
  P(x, y, c) { x = Math.round(x); y = Math.round(y); if (x >= 0 && x < HW && y >= HY0 && y < HY0 + HBH) Screen.hbuf[y * HW + x] = c; },
  G(x, y) { return (x >= 0 && x < HW && y >= 0 && y < HH) ? Screen.hbuf[y * HW + x] : 0; },
  R(x, y, w, h, c) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) H2.P(x + i, y + j, c); },
  F(x, y, w, h, c) { H2.R(x, y, w, 1, c); H2.R(x, y + h - 1, w, 1, c); H2.R(x, y, 1, h, c); H2.R(x + w - 1, y, 1, h, c); },
  sw(x, y) { return (HB8[y & 7][x & 7] + 0.5) / 64; },
  M(r, f, x, y) { const n = r.length - 1, p = Math.max(0, Math.min(1, f)) * n, i = Math.min(n - 1, Math.floor(p)); return r[i + (p - i > H2.sw(x, y) ? 1 : 0)]; },
  line(x1, y1, x2, y2, c, dick) { const n = Math.max(1, Math.round(Math.hypot(x2 - x1, y2 - y1))); for (let k = 0; k <= n; k++) { const x = x1 + (x2 - x1) * k / n, y = y1 + (y2 - y1) * k / n; H2.P(x, y, c); if (dick) H2.P(x, y + 1, c); } },
  disc(cx, cy, r, c) { for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) if (x * x + y * y <= r * r + r * 0.6) H2.P(cx + x, cy + y, c); },
  himmel(yb, sx, sy) {
    for (let y = HY0; y < yb; y++) for (let x = 0; x < HW; x++) {
      const f0 = (y - HY0) / (yb - HY0), gl = Math.max(0, 1 - Math.hypot((x - sx) / 230, (y - sy) / 104));
      H2.P(x, y, H2.M(HIMMEL, f0 * 0.78 + gl * 0.56 + (glatt(x * 0.05, y * 0.2, 9) - 0.5) * 0.05, x, y));
    }
  },
  wolken(ya, yb, dichte, seed, sx) {
    const n = (x, y) => glatt(x * 0.22 + seed, y * 1.6, 13) * 0.58 + glatt(x * 0.45 + seed, y * 2.5, 5) * 0.27 + glatt(x * 0.9 + seed, y * 4.5, 3) * 0.15;
    for (let y = ya; y < yb; y++) for (let x = 0; x < HW; x++) {
      const v = n(x, y); if (v <= dichte) continue;
      const i = HIMMEL.indexOf(H2.G(x, y)); if (i < 0) continue;
      if (n(x, y + 3) <= dichte && Math.abs(x - sx) < 190) H2.P(x, y, (x + y) % 3 ? 22 : 21);      // angestrahlte Unterkante
      else H2.P(x, y, HIMMEL[Math.min(5, i + (v > dichte + 0.09 ? 2 : 1))]);
    }
  },
  sonne(cx, cy, r, hor) {
    for (let y = -r - 8; y <= r + 8; y++) for (let x = -r - 8; x <= r + 8; x++) {
      const d = Math.hypot(x, y); if (cy + y >= hor) continue;
      if (d <= r - 6) H2.P(cx + x, cy + y, d < r - 12 ? 57 : 23);
      else if (d <= r) H2.P(cx + x, cy + y, H2.M(GLUT, 1 - (d - (r - 6)) / 6, cx + x, cy + y));
      else if (d <= r + 8 && H2.sw(cx + x, cy + y) < (1 - (d - r) / 8) * 0.7) H2.P(cx + x, cy + y, 22);
    }
  },
  kette(basis, hoehe, zacken, farbe, versatz, xa, xb, lichter) {
    for (let x = xa; x < xb; x++) {
      const h = hoehe * (0.55 + 0.45 * Math.sin((x + versatz) / zacken) + 0.25 * Math.sin((x + versatz) / (zacken * 0.37)) + 0.08 * Math.sin(x / 5));
      for (let y = Math.round(basis - h); y < basis; y++) H2.P(x, y, farbe);
      if (lichter && (x * 7 + versatz) % 53 === 0 && h > 6) H2.P(x, basis - 3, 22);
    }
  },
  meer(ya, yb, sx, xa, xb) {
    xa = xa || 0; xb = xb === undefined ? HW : xb;
    for (let y = ya; y < yb; y++) {
      const f = (y - ya) / Math.max(1, yb - ya);
      for (let x = xa; x < xb; x++) {
        let c = H2.M(MEER, 0.05 + f * 0.8, x, y);
        const welle = glatt(x * (0.1 - f * 0.05) + y * 0.9, y * (2.2 - f), 3);
        if (welle > 0.66 + (1 - f) * 0.1) c = MEER[Math.max(0, MEER.indexOf(c) - 1)];
        if (welle < 0.24) c = MEER[Math.min(5, MEER.indexOf(c) + 1)];
        H2.P(x, y, c);
      }
    }
  },
  /* Sonnenstraße und Schaumkronen: in jedem Bild neu, damit das Wasser lebt */
  glitzern(ya, yb, sx, t, xa, xb) {
    xa = xa || 0; xb = xb === undefined ? HW : xb; const tt = Math.floor(t * 4);
    for (let y = ya + 1; y < yb; y++) {
      const f = (y - ya) / Math.max(1, yb - ya), br = 10 + f * 86;
      for (let x = Math.max(xa, Math.round(sx - br)); x < Math.min(xb, sx + br); x++) {
        const rand = Math.abs(x - sx) / br;
        if (MEER.indexOf(H2.G(x, y)) >= 0 && rausch((x >> 1) + tt * 3, y + tt) > 0.4 + rand * 0.58 && (y + (x >> 2)) % 2 === 0) H2.P(x, y, f < 0.4 ? 23 : (rausch(x, y) > 0.5 ? 22 : 21));
      }
    }
    for (let k = 0; k < 70; k++) { const x = (k * 97 + Math.round(Math.sin(t * 0.7 + k) * 6)) % HW, y = ya + 4 + ((k * 61) % Math.max(1, yb - ya - 6)), f = (y - ya) / (yb - ya), l = 3 + Math.round(f * 9); if (x >= xa && x + l < xb && MEER.indexOf(H2.G(x, y)) >= 0 && MEER.indexOf(H2.G(x + l, y)) >= 0) H2.R(x, y, l, 1, GISCHT[k % 2]); }
  },
  /* Fels mit Schichtung, Rissen und Relief, Licht von links oben */
  fels(x0, y0, w, h, hell, maske, erz, reihe) {
    const n = (x, y) => glatt(x / 2, y / 2, 17) * 0.5 + glatt(x / 2 + 91, y / 2 + 13, 6) * 0.26 + glatt(x + 7, y + 3, 5) * 0.14 + Math.sin((y / 2 + x * 0.11 + glatt(x / 2, y / 2, 40) * 26) * 0.19) * 0.12;
    for (let y = Math.max(HY0, y0); y < Math.min(HY0 + HBH, y0 + h); y++) for (let x = Math.max(0, x0); x < Math.min(HW, x0 + w); x++) {
      if (maske && !maske(x, y)) continue;
      const v = n(x, y); let f = hell + (v - 0.42) * 0.6 + (v - n(x - 3, y - 3)) * 2.2;
      if (Math.abs(glatt(x / 2 + 300, y * 0.85, 23) - 0.5) < 0.011) f -= 0.34;
      let c = H2.M(reihe || STEIN, f, x, y);
      if (erz) { const ader = Math.abs(glatt(x * 0.3 + 40, y * 0.7 + x * 0.25, 15) - 0.5); if (ader < 0.004 && v > 0.46) c = rausch(x, y) > 0.8 ? DUNST[1] : STEIN[4]; }
      H2.P(x, y, c);
    }
  },
  /* Fläche aus einer Farbreihe mit Körnung: Wiese, Erde, Putz */
  flaeche(x0, y0, w, h, reihe, hell, korn, maske) {
    for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) {
      if (maske && !maske(x, y)) continue;
      H2.P(x, y, H2.M(reihe, hell + (glatt(x * 0.4, y * 0.8, 7) - 0.5) * korn + (glatt(x * 2, y * 3, 2) - 0.5) * korn * 0.5 - (y - y0) / Math.max(1, h) * 0.18, x, y));
    }
  },
  holz(x, y, w, h, hell) {
    const laengs = w >= h;
    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
      const u = laengs ? i : j, v = laengs ? j : i, dv = v / Math.max(1, (laengs ? h : w) - 1);
      let f = hell + (glatt(u * 0.5 + x, v * 3 + y * 7, 7) - 0.5) * 0.34 - dv * 0.32 + (v === 0 ? 0.18 : 0);
      if (Math.abs(glatt(u * 0.2 + x * 3, v * 1.5 + y, 9) - 0.5) < 0.02) f -= 0.2;
      H2.P(x + i, y + j, H2.M(HOLZ, f, x + i, y + j));
    }
    if (laengs) H2.R(x, y + h - 1, w, 1, HOLZ[0]); else H2.R(x + w - 1, y, 1, h, HOLZ[0]);
  },
  grasnarbe(xa, xb, top, sx) {
    for (let x = xa; x < xb; x++) {
      const t = Math.round(top(x)); if (t < HY0 || t > HY0 + HBH) continue;
      H2.P(x, t, Math.abs(x - sx) < 150 ? 22 : GRUEN[4]); H2.P(x, t + 1, GRUEN[4]); H2.P(x, t + 2, H2.M(GRUEN, 0.7, x, t)); H2.P(x, t + 3, H2.M(GRUEN, 0.5, x, t + 3)); H2.P(x, t + 4, H2.M(GRUEN, 0.3, x, t + 4));
      if (rausch(x, 3) > 0.55) { const hh = 2 + Math.round(rausch(x, 9) * 4); for (let k = 1; k <= hh; k++) H2.P(x + (k > 2 ? (rausch(x, 5) > 0.5 ? 1 : -1) : 0), t - k, k > 2 ? GRUEN[3] : GRUEN[4]); }
    }
  },
  halme(x0, y0, w, h, n, blumen) {
    for (let k = 0; k < n; k++) { const x = x0 + (k * 53) % w, y = y0 + (k * 29) % h, hh = 3 + k % 4; if (GRUEN.indexOf(H2.G(x, y)) < 0) continue;
      for (let j = 0; j < hh; j++) H2.P(x + (j > 2 ? (k % 2 ? 1 : -1) : 0), y - j, j > 1 ? GRUEN[4] : GRUEN[3]);
      if (blumen && k % 9 === 0) { H2.P(x, y - hh, k % 18 ? 57 : WHITE); H2.P(x - 1, y - hh + 1, k % 27 ? 22 : LTRED); H2.P(x + 1, y - hh + 1, 22); } }
  },
  licht(cx, cy, r) {
    for (let y = Math.max(HY0, cy - r); y <= Math.min(HY0 + HBH - 1, cy + r); y++) for (let x = Math.max(0, cx - r); x <= Math.min(HW - 1, cx + r); x++) {
      const d = Math.hypot(x - cx, (y - cy) * 1.15) / r; if (d >= 1) continue;
      if (1 - d > H2.sw(x, y) * 0.9) Screen.hbuf[y * HW + x] = waermer(Screen.hbuf[y * HW + x], 1 - d);
    }
  },

const BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];

/* Mischfarbe zweier Nachbarstufen einer Reihe: f von 0 (erste Stufe) bis 1 (letzte) */
function mischen(reihe, f, x, y) {

}

const REIHE_VON = {};
[['HIMMEL', HIMMEL], ['MEER', MEER], ['HOLZ', HOLZ], ['STEIN', STEIN], ['GRUEN', GRUEN],

  r.forEach((c, i) => { if (REIHE_VON[c] === undefined) REIHE_VON[c] = { r, i, n }; }));

function waermer(c, staerke) {
  const e = REIHE_VON[c];

  // Dunkle Luft und kalter Stein werden im Lampenlicht zu warmem Fels
  if (e.n === 'NACHT') return staerke > 0.6 ? ERDE[2] : (staerke > 0.3 ? ERDE[1] : ERDE[0]);
  if (e.n === 'STEIN') return ERDE[Math.max(0, Math.min(4, e.i + (staerke > 0.66 ? 1 : (staerke > 0.33 ? 0 : -1))))];

    for (let x = Math.max(0, (cx - rr) | 0); x <= Math.min(SW - 1, cx + rr); x++) {

/* Gewachsener Fels: geneigte Schichten, grobe und feine Körnung, Risse, auf Wunsch Erzadern */

    const n = glatt(x, y, 17) * 0.55 + glatt(x + 91, y + 13, 6) * 0.3 + band * 0.12;
