let hidden = null;         // unsichtbares Eingabefeld für die Handytastatur

function focusHidden(val, maxLen) {
  if (!hidden) return;
  hidden.maxLength = maxLen || 14;
  hidden.value = val || '';
  hidden.style.display = 'block';
  hidden.focus();
  try { hidden.setSelectionRange(hidden.value.length, hidden.value.length); } catch (e) {}
}
function blurHidden() { if (hidden) { hidden.blur(); hidden.style.display = 'none'; } }

/* ---- Tastatur auf Handys ----
   iOS oeffnet die Bildschirmtastatur nur, wenn das Eingabefeld noch INNERHALB
   der Beruehrung fokussiert wird. Die normale Verarbeitung laeuft aber erst im
   naechsten Bild. syncTap wird deshalb direkt aus dem Touch-Ereignis gerufen und
   fokussiert das Feld sofort, wenn der Tipp zu einer Eingabe fuehren wird. */
function syncTap(p) {
  if (!hidden) return;
  let a = null;
  for (let i = HOTPREV.length - 1; i >= 0; i--) {
    const h = HOTPREV[i];
    if (p.x >= h.x && p.x <= h.x + h.w && p.y >= h.y && p.y <= h.y + h.h) { a = h.act; break; }
  }
  let needs = false;
  if (Game.mode === 'name' || Game.mode === 'teacher') needs = true;
  else if (a && (a.focusName || a.tfield !== undefined)) needs = true;
  else if (a && a.menu !== undefined && Game.mode === 'title') {
    const sv = Game.hasSave();
    needs = (a.menu === 0 && !sv) || (a.menu === 1 && sv) || a.menu === 2;
  }
  if (needs && document.activeElement !== hidden) {
    hidden.style.display = 'block';
    try { hidden.focus(); } catch (e) {}
  }
}

/* ---- Ergebnis-Code zum Kopieren und Verschicken ---- */
let codebox = null, codetext = null, copyhint = null, codeboxOn = false;

function showCodeBox(on) {
  if (!codebox || codeboxOn === on) return;
  codeboxOn = on;
  codebox.style.display = on ? 'block' : 'none';
  document.body.classList.toggle('codemode', on);
  Screen.resize();
  if (on) {
    codetext.value = Game.transfer;
    copyhint.textContent = 'Der Code enthaelt deinen Vornamen und dein Ergebnis.';
  }
}

function copyCode() {
  const txt = Game.transfer;
  const done = () => { copyhint.textContent = 'Kopiert. Jetzt in eine Nachricht einfuegen.'; Sound.sfx('save'); };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(done, fallbackCopy);
      return;
    }
  } catch (e) {}
  fallbackCopy();
  function fallbackCopy() {
    try {
      codetext.removeAttribute('readonly');
      codetext.focus(); codetext.select(); codetext.setSelectionRange(0, 99);
      document.execCommand('copy');
      codetext.setAttribute('readonly', 'readonly');
      done();
    } catch (e) { copyhint.textContent = 'Bitte von Hand markieren und kopieren.'; }
  }
}

function mailCode() {
  const m = Game.chapter.meldung || {};
  const to = m.mail || '';
  const subj = encodeURIComponent((m.betreff || 'Lernadventure - Ergebnis') + ': ' + Game.name);
  const body = encodeURIComponent(Game.transfer + '\n\n(automatisch erzeugt)');
  copyhint.textContent = 'Mailprogramm oeffnet sich. Falls nicht: Code kopieren.';
  window.location.href = 'mailto:' + to + '?subject=' + subj + '&body=' + body;
}

/* Die Lehrkraft darf entweder Name und Code getrennt eingeben oder den
   kompletten Sammelcode in das Codefeld werfen - dann wird der Vorname
   daraus gelesen. */
function checkCode() {
  const tr = parseTransfer(Game.tCode);
  if (tr) { Game.tName = tr.name; Game.tCode = tr.code; }
  Game.codeResult = readCode(Game.tCode, Game.tName);
  if (tr) Game.codeResult.fromTransfer = true;
  Sound.sfx(Game.codeResult.ok ? 'right' : 'wrong');
}

/* ---------------- Aktionen (Tippen und Tasten laufen hier zusammen) ------- */
function act(a) {
  if (a.menu !== undefined) { Game.sel = a.menu; menuActivate(); return; }
  if (a.helpNext) { helpNext(); return; }
  if (a.title) { Game.mode = 'title'; Game.sel = 0; Sound.setLayer('full'); Sound.play('title'); blurHidden(); return; }
  if (a.focusName) { focusHidden(Game.nameBuf, 12); return; }
  if (a.tfield !== undefined) { Game.tField = a.tfield; focusHidden(a.tfield ? Game.tCode : Game.tName, a.tfield ? 40 : 20); return; }
  if (a.check) { checkCode(); return; }

  if (Game.mode !== 'play') return;

  if (a.next) {
    if (Game.view === 'talk') {
      if (!Game.talk) return;
      if (Game.typing) { Game.typed = 1e9; Game.typing = false; }
      else if (Game.page < talkPages(Game.talk.list[Game.talk.i]).length - 1) { Game.page++; Game.typed = 0; Game.typing = true; }
      else Game.talkAdvance();
    } else if ((Game.view === 'task' || Game.view === 'mini') && Game.taskPhase === 'fb') {
      Game.afterFeedback();
    } else if ((Game.view === 'task' || Game.view === 'mini') && Game.taskPhase === 'tip') {
      Game.tipDone();
    } else if ((Game.view === 'task' || Game.view === 'mini') && Game.taskPhase === 'morph') {
      Game.morphDone();
    }
    return;
  }
  if (a.walk) {
    if (Game.view === 'walk' && Game.walk) { if (!Game.walkContinue()) Game.walk.go = !Game.walk.go; }
    return;
  }
  if (a.gate !== undefined) { Game.gateAnswer(a.gate); return; }
  if (a.gateNext) { Game.gateNext(); return; }
  if (a.station !== undefined) { Game.enterStation(a.station); return; }
  if (a.map) { if (Game.view === 'task' || Game.view === 'mini') Game.abortTask(); return; }
  if (a.hint) { if ((Game.view === 'task' || Game.view === 'mini') && Game.taskPhase === 'ask') Game.useHint(); return; }
  if (a.pick !== undefined) { if (Game.view === 'task' && Game.taskPhase === 'ask') Game.answer(a.pick); return; }
  if (a.miniCheck) { if (Game.view === 'mini' && Game.taskPhase === 'ask') Game.miniCheck(); return; }
  if (a.mini) {
    if (Game.view !== 'mini' || Game.taskPhase !== 'ask') return;
    const s = Game.task, m = Game.mini;
    const keys = miniKeys(s);
    if (a.mini === 'sel') { m.sel = a.i; Sound.sfx('move'); }
    else { m.sel = a.i; m[keys[a.i]] += (a.mini === 'inc' ? 1 : -1) * s['step' + keys[a.i]]; Sound.sfx('tick'); }
    return;
  }
  if (a.bossPick !== undefined) { if (Game.view === 'boss' && Game.boss.phase === 'ask') Game.bossPick(a.bossPick); return; }
  if (a.bossNext) { if (Game.view === 'boss' && Game.boss.phase === 'fb') Game.bossNext(); return; }
}

function helpNext() {
  const n = (Game.chapter.help || []).length;
  Game.helpPage = (Game.helpPage || 0) + 1;
  if (Game.helpPage >= n) { Game.helpPage = 0; Game.mode = 'title'; Game.sel = 0; }
}

function menuActivate() {
  const sv = Game.hasSave();
  switch (Game.sel) {
    case 0:
      if (sv) { if (Game.load()) { Game.mode = 'play'; Sound.sfx('save'); } }
      else { Game.reset(); Game.mode = 'name'; Game.nameBuf = ''; focusHidden('', 12); }
      break;
    case 1:
      if (sv) { Game.reset(); Game.mode = 'name'; Game.nameBuf = ''; focusHidden('', 12); }
      else { Game.mode = 'help'; Game.helpPage = 0; }
      break;
    case 2:
      Game.mode = 'teacher'; Game.tName = Game.tName || ''; Game.tCode = Game.tCode || '';
      Game.tField = 0; Game.codeResult = null; focusHidden('', 20);
      break;
    case 3: Sound.on = !Sound.on; if (!Sound.on) Sound.stop(); else Sound.play('title'); break;
  }
  Sound.sfx('move');
}

/* ---------------- Tasten ---------------- */
function onKey(k) {
  if (k === 'm' || k === 'M') {
    Sound.on = !Sound.on;
    if (!Sound.on) Sound.stop();
    else Sound.play(Game.mode === 'play' ? (Game.view === 'boss' ? 'boss' : 'field') : 'title');
    return;
  }

  if (Game.mode === 'title') {
    if (k === 'ArrowDown') { Game.sel = (Game.sel + 1) % 4; Sound.sfx('move'); }
    else if (k === 'ArrowUp') { Game.sel = (Game.sel + 3) % 4; Sound.sfx('move'); }
    else if (k === 'Enter' || k === ' ') menuActivate();
    return;
  }
  if (Game.mode === 'help') {
    if (k === 'Escape') { Game.mode = 'title'; Game.sel = 0; }
    else if (k === ' ' || k === 'Enter') helpNext();
    return;
  }

  if (Game.mode === 'name') {
    if (k === 'Enter') {
      const n = (Game.nameBuf || '').trim();
      if (n.length >= 2) {
        Game.name = n; blurHidden();
        Game.mode = 'play';
        Game.playTalk(Game.chapter.intro, 'walk');
      }
    } else if (k === 'Backspace') Game.nameBuf = Game.nameBuf.slice(0, -1);
    else if (k.length === 1 && Game.nameBuf.length < 12) Game.nameBuf += k;
    return;
  }

  if (Game.mode === 'teacher') {
    if (k === 'Escape') { Game.mode = 'title'; blurHidden(); return; }
    if (k === 'Tab') { Game.tField = 1 - Game.tField; focusHidden(Game.tField ? Game.tCode : Game.tName, Game.tField ? 40 : 20); return; }
    if (k === 'Enter') { act({ check: true }); return; }
    const fld = Game.tField === 0 ? 'tName' : 'tCode';
    if (k === 'Backspace') Game[fld] = Game[fld].slice(0, -1);
    else if (k.length === 1 && Game[fld].length < (Game.tField ? 40 : 20)) Game[fld] += k;
    return;
  }

  if (Game.mode === 'end') { if (k === ' ' || k === 'Enter') { Game.mode = 'title'; Game.sel = 0; Sound.play('title'); } return; }

  if (Game.mode !== 'play') return;

  if (k === 'q' || k === 'Q') { Game.save(); Game.finish(0); return; }
  if ((k === 'k' || k === 'K') && (Game.view === 'task' || Game.view === 'mini')) { Game.abortTask(); return; }
  if ((k === 'h' || k === 'H') && (Game.view === 'task' || Game.view === 'mini') && Game.taskPhase === 'ask') { Game.useHint(); return; }

  if (Game.view === 'walk' && Game.walk) {
    if (Game.walk.talking) { if (k === ' ' || k === 'Enter') Game.walkContinue(); return; }
    if (k === 'ArrowRight' || k === ' ' || k === 'Enter') Game.walk.burst = 0.4;
    return;
  }
  if (k === ' ' || k === 'Enter') {
    if (Game.view === 'talk') { act({ next: true }); return; }
    if (Game.view === 'gate') { if (Game.gate.phase === 'fb') Game.gateNext(); return; }
    if (Game.view === 'map') { Game.enterStation(Game.sel); return; }
    if (Game.view === 'boss') { if (Game.boss.phase === 'fb') Game.bossNext(); return; }
    if (Game.view === 'mini') {
      if (Game.taskPhase === 'ask') Game.miniCheck();
      else if (Game.taskPhase === 'fb') Game.afterFeedback();
      else if (Game.taskPhase === 'tip') Game.tipDone();
      else if (Game.taskPhase === 'morph') Game.morphDone();
      return;
    }
    if (Game.view === 'task') {
      if (Game.taskPhase === 'fb') Game.afterFeedback();
      else if (Game.taskPhase === 'tip') Game.tipDone();
      else if (Game.taskPhase === 'morph') Game.morphDone();
      return;
    }
    return;
  }

  if (k >= '1' && k <= '9') {
    const i = parseInt(k, 10) - 1;
    if (Game.view === 'task' && Game.taskPhase === 'ask' && i < Game.task.options.length) Game.answer(i);
    else if (Game.view === 'gate' && Game.gate.phase === 'ask' && i < Game.gate.qs[Game.gate.i].options.length) Game.gateAnswer(i);
    else if (Game.view === 'boss' && Game.boss.phase === 'ask' && i < Game.boss.qs[Game.boss.q].options.length) Game.bossPick(i);
    return;
  }

  if (Game.view === 'map') {
    // Nur zwischen den Orten der Insel wechseln, auf der man gerade ist
    const idx = Game.islandIdx(), n = idx.length;
    const p = Math.max(0, idx.indexOf(Game.sel));
    if (k === 'ArrowRight' || k === 'ArrowDown') { Game.sel = idx[(p + 1) % n]; Sound.sfx('move'); }
    if (k === 'ArrowLeft' || k === 'ArrowUp') { Game.sel = idx[(p + n - 1) % n]; Sound.sfx('move'); }
    return;
  }
  if (Game.view === 'task' && Game.taskPhase === 'ask') {
    const n = Game.task.options.length;
    if (k === 'ArrowDown') { Game.sel = (Game.sel + 1) % n; Sound.sfx('move'); }
    if (k === 'ArrowUp') { Game.sel = (Game.sel + n - 1) % n; Sound.sfx('move'); }
    return;
  }
  if (Game.view === 'gate' && Game.gate.phase === 'ask') {
    const n = Game.gate.qs[Game.gate.i].options.length;
    if (k === 'ArrowDown') { Game.sel = (Game.sel + 1) % n; Sound.sfx('move'); }
    if (k === 'ArrowUp') { Game.sel = (Game.sel + n - 1) % n; Sound.sfx('move'); }
    return;
  }
  if (Game.view === 'boss' && Game.boss.phase === 'ask') {
    const n = Game.boss.qs[Game.boss.q].options.length;
    if (k === 'ArrowRight' || k === 'ArrowDown') { Game.sel = (Game.sel + 1) % n; Sound.sfx('move'); }
    if (k === 'ArrowLeft' || k === 'ArrowUp') { Game.sel = (Game.sel + n - 1) % n; Sound.sfx('move'); }
    return;
  }
  if (Game.view === 'mini' && Game.taskPhase === 'ask') {
    const s = Game.task, m = Game.mini;
    const keys = miniKeys(s), n = keys.length, step = s['step' + keys[m.sel]];
    if (k === 'ArrowDown') { m.sel = (m.sel + 1) % n; Sound.sfx('move'); }
    if (k === 'ArrowUp')   { m.sel = (m.sel + n - 1) % n; Sound.sfx('move'); }
    if (k === 'ArrowRight'){ m[keys[m.sel]] += step; Sound.sfx('tick'); }
    if (k === 'ArrowLeft') { m[keys[m.sel]] -= step; Sound.sfx('tick'); }
  }
}

/* ---------------- Hauptschleife ---------------- */
let last = 0, HOTPREV = [];
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0);
  last = ts; Game.t += dt;
  const t = Game.t;
  HOT = [];

  for (const ev of Input.poll()) {
    if (ev.type === 'key') onKey(ev.key);
    else if (ev.type === 'tap') {
      for (let i = HOTPREV.length - 1; i >= 0; i--) {
        const h = HOTPREV[i];
        if (ev.x >= h.x && ev.x <= h.x + h.w && ev.y >= h.y && ev.y <= h.y + h.h) { act(h.act); break; }
      }
    }
  }

  if (Game.mode === 'play' && Game.view === 'talk' && Game.talk && Game.typing) {
    Game.typed += dt * 150;
    const pages = talkPages(Game.talk.list[Game.talk.i]);
    const total = pages[Math.min(Game.page, pages.length - 1)].join('').length;
    if (Game.typed >= total) { Game.typed = 1e9; Game.typing = false; }
    else if (Math.random() < 0.22) Sound.sfx('tick');
  }
  if (Game.mode === 'play' && Game.view === 'walk') {
    Game.walkUpdate(dt);
    const w = Game.walk;
    if (w && w.talking && w.typed < w.talking.text.length) { w.typed += dt * 60; if (Math.random() < 0.2) Sound.sfx('tick'); }
  }
  if (Game.boss) { Game.boss.shake = Math.max(0, Game.boss.shake - dt); Game.boss.flashT = Math.max(0, Game.boss.flashT - dt); }
  if (Game.msgT > 0) Game.msgT -= dt;

  Screen.clear(BLACK);
  switch (Game.mode) {
    case 'title':   renderTitle(t); break;
    case 'help':    renderHelp(t); break;
    case 'name':    renderName(t); break;
    case 'teacher': renderTeacher(t); break;
    case 'end':     renderEnd(t); break;
    case 'play':
      // Nach reset() kann ein Bild lang die Ansicht noch auf einen geleerten
      // Zustand zeigen - dann dieses Bild auslassen statt abzustuerzen.
      switch (Game.view) {
        case 'talk': if (Game.talk) renderTalk(t); break;
        case 'walk': if (Game.walk) renderWalk(t); break;
        case 'gate': if (Game.gate) renderGate(t); break;
        case 'map':  renderMap(t); break;
        case 'task': if (!Game.task) break;
          if (Game.taskPhase === 'tip') renderTip(t);
          else if (Game.taskPhase === 'morph') renderMorph(t);
          else { renderTask(t); if (Game.taskPhase === 'fb') renderTaskFeedback(t); }
          break;
        case 'mini': if (!Game.task || !Game.mini) break;
          if (Game.taskPhase === 'tip') renderTip(t);
          else if (Game.taskPhase === 'morph') renderMorph(t);
          else { renderMini(t); if (Game.taskPhase === 'fb') renderMiniFeedback(t); }
          break;
        case 'boss': if (!Game.boss) break; renderBoss(t); if (Game.boss.phase === 'fb') renderBossFeedback(t); break;
      }
      statusBar();
      break;
  }
  if (Game.msgT > 0) {
    const w = Game.msg.length * 8 + 10;
    Screen.rect(SW - w - 6, 10, w, 12, BLACK);
    Screen.frame(SW - w - 6, 10, w, 12, Game.msgCol);
    Screen.textPx(Game.msg, SW - w - 1, 12, Game.msgCol);
  }

  showCodeBox(Game.mode === 'end');

  HOTPREV = HOT;
  Screen.flush();
  requestAnimationFrame(frame);
}

/* ---------------- Start ---------------- */
window.addEventListener('DOMContentLoaded', () => {
  const canvas = document.getElementById('screen');
  hidden = document.getElementById('hid');
  Screen.init(canvas);
  Input.init(canvas);
  hidden.addEventListener('input', () => {
    const v = hidden.value;
    if (Game.mode === 'name') Game.nameBuf = v.substr(0, 12);
    else if (Game.mode === 'teacher') {
      if (Game.tField === 0) Game.tName = v.substr(0, 20);
      else Game.tCode = v.toUpperCase().substr(0, 40);
    }
  });
  hidden.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); onKey('Enter'); } });
  codebox = document.getElementById('codebox');
  codetext = document.getElementById('codetext');
  copyhint = document.getElementById('copyhint');
  document.getElementById('btncopy').addEventListener('click', copyCode);
  document.getElementById('btnmail').addEventListener('click', mailCode);

  Game.tName = ''; Game.tCode = '';
  Game.start(KAPITEL);
  document.title = "Die Flüche des F'Abiturio - " + (KAPITEL.titleLine || '');
  if (!(KAPITEL.meldung && KAPITEL.meldung.mail))
    document.getElementById('btnmail').style.display = 'none';
  requestAnimationFrame(frame);
});

</script>
<script>
/* Offline-Speicher nur im Webpaket ueber https (oder localhost). Als einzelne
   Datei vom Dateisystem gibt es keinen Service Worker - dann passiert hier nichts. */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
