   Logische Auflösung 320x200 Pixel, 40x25 Zeichen a 8x8.
   ============================================================ */

/* Palette v3 (Weg B, 2026-10-30): Plätze 0..15 sind die alten C64-Farben und bleiben
   unverändert, ab 16 folgen Farbreihen für gemalte Szenen (siehe 52_wegb.js). */
const PAL = ['#000000','#ffffff','#9f4e44','#6abfc6','#a057a3','#5cab5e','#50459b','#c9d487',
             '#a1683c','#6d5412','#cb7e75','#626262','#898989','#9ae29b','#887ecb','#adadad',
             '#1a1030','#2a1a46','#45265c','#6b3a63','#9b5560','#c87a56',      // 16..21 Abendhimmel
             '#e8a05a','#f7d08a',                                              // 22..23 Glut
             '#3d7f8c','#2a6377','#1f4c63','#17384f','#10263a','#0a1826',      // 24..29 Meer
             '#7fb3b5','#cfe6e2',                                              // 30..31 Gischt
             '#2a1a14','#43291c','#5c3a24','#7a4f30','#9a6a42','#bd8d5e',      // 32..37 Holz
             '#15171c','#22262e','#333945','#4a515f','#6a7384',                // 38..42 Stein
             '#0e1c14','#16301f','#20492c','#2f6a3c','#4a9152',                // 43..47 Grün
             '#6b4332','#8e5f44','#b3805c','#d5a57c',                          // 48..51 Haut
             '#070a12','#0d1322','#141c33','#1d2847',                          // 52..55 Nacht
             '#f2c85c','#ffe9a8','#e2743c','#b84a2e',                          // 56..59 Licht
             '#8795a8','#a9b6c4','#c9d3dd','#eef2f6',                          // 60..63 Dunst
             '#7b5139','#a07050','#c4926c',                                    // 64..66 Haut, Zwischenstufen
             '#2b303a','#3e4552','#5a6271',                                    // 67..69 Stein, Zwischenstufen
             '#99a6b6',                                                        // 70 Dunst, Zwischenstufe
             '#241812','#3b2a1e','#57402c','#77593d','#9b7b57',
  // 76-81: Himmelblau wie Matthias' Hemd (seit 2026-11-18), dunkel bis hell; #9ab6df trifft das Hemd (#94aece)
  '#2b4570', '#3c5f95', '#5a7fb8', '#7d9ed1', '#9ab6df', '#c3d6ef'
];               // 71..75 Erde: Fels im Lampenlicht
const PALRGB = PAL.map(h => [parseInt(h.substr(1,2),16), parseInt(h.substr(3,2),16), parseInt(h.substr(5,2),16)]);
const BLACK=0, WHITE=1, RED=2, CYAN=3, PURPLE=4, GREEN=5, BLUE=6, YELLOW=7,
      ORANGE=8, BROWN=9, LTRED=10, DGREY=11, GREY=12, LTGREEN=13, LTBLUE=14, LTGREY=15;

const SW = 320, SH = 200, CW = 8, CH = 8, COLS = 40, ROWS = 25;
const INTERN = 3;   // interner Vergrößerungsfaktor des Zeichenpuffers
const HKEY = 255;   // Farbnummer „durchsichtig": hier scheint das feine Bild (Screen.hbuf) durch

// Glyphen aus Hex entpacken
const glyph8 = {}, glyph5 = {};
for (const k in FONT8) {
  const a = []; for (let i = 0; i < 8; i++) a.push(parseInt(FONT8[k].substr(i*2,2),16));
  glyph8[k] = a;
}
for (const k in FONT5) {
  const a = []; for (let i = 0; i < 5; i++) a.push(parseInt(FONT5[k].substr(i*2,2),16));
  glyph5[k] = a;
}

const Screen = {
  buf: new Uint8Array(SW * SH),
  border: BLUE,
  bg: BLACK,
  canvas: null, ctx: null, img: null, scale: 1, ox: 0, oy: 0,
  /* Doppelte Auflösung (Kapitel mit aufloesung: 2, ab Kapitel 5): Der Bildschirm hat 640x400 Punkte.
     Alles Bisherige zeichnet weiter in buf (320x200) und wird beim Ausgeben geglättet verdoppelt.
     Szenen in feiner Auflösung malen in hbuf (640x400) und füllen ihre Fläche in buf mit HKEY:
     Dort scheint hbuf durch. So liegen Figuren, Kästen und Schrift von selbst über dem feinen Bild. */
  hi: false, hbuf: null,
  /* Feine Schrift (Kapitel mit schrift: 2, ab dem Neubau von Kapitel 4): Text, Formeln und Portraits
     werden in feiner Auflösung in eine dritte Ebene obuf (640x400) gezeichnet, die über allem liegt.
     Jede Fläche, die danach in buf gefüllt wird (rect), räumt die Ebene darunter frei - so verdeckt
     ein späterer Kasten den Text, der vor ihm gezeichnet wurde. Zeichnen: F2 in 12_fein.js. */
  fein: false, obuf: null, ovUsed: false,

  init(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d', { alpha: false });
    this.ctx.imageSmoothingEnabled = false;
    this.resize();
    window.addEventListener('resize', () => this.resize());
  },

  resize() {
    // Der Zeichenpuffer hat immer 352x232 mal INTERN, harte Pixel.
    // Auf die Fenstergröße skaliert dann der Browser (image-rendering: pixelated).
    const wrap = document.getElementById('wrap');
    const availW = wrap.clientWidth, availH = wrap.clientHeight;
    const totW = 352, totH = 232;
    const INTERN = this.hi ? 4 : 3;         // bei doppelter Auflösung zwei Gerätepunkte je Bildpunkt
    this.dpr = INTERN;
    this.scale = 1;
    if (this.canvas.width !== totW * INTERN) {
      this.canvas.width  = totW * INTERN;
      this.canvas.height = totH * INTERN;
      this.ctx = this.canvas.getContext('2d', { alpha: false });
      this.ctx.imageSmoothingEnabled = false;
    }
    const css = Math.min(availW / totW, availH / totH);
    this.css = css;
    this.canvas.style.width  = Math.floor(totW * css) + 'px';
    this.canvas.style.height = Math.floor(totH * css) + 'px';
    this.flush();
  },

  clear(c) { this.buf.fill(c === undefined ? this.bg : c); if (this.ovUsed) { this.obuf.fill(HKEY); this.ovUsed = false; } },

  px(x, y, c) {
    if (x < 0 || y < 0 || x >= SW || y >= SH) return;
    this.buf[y * SW + x] = c;
  },

  rect(x, y, w, h, c) {
    const x0 = Math.max(0, x|0), y0 = Math.max(0, y|0);
    const x1 = Math.min(SW, (x+w)|0), y1 = Math.min(SH, (y+h)|0);
    for (let yy = y0; yy < y1; yy++) {
      const row = yy * SW;
      for (let xx = x0; xx < x1; xx++) this.buf[row + xx] = c;
    }
    if (this.ovUsed && x1 > x0) { const ob = this.obuf; for (let yy = y0 * 2; yy < y1 * 2; yy++) ob.fill(HKEY, yy * 640 + x0 * 2, yy * 640 + x1 * 2); }
  },

  frame(x, y, w, h, c) {
    this.rect(x, y, w, 1, c); this.rect(x, y+h-1, w, 1, c);
    this.rect(x, y, 1, h, c); this.rect(x+w-1, y, 1, h, c);
  },

  // Ein Zeichen an Pixelposition. bg<0 = transparent
  glyph(ch, px, py, fg, bg) {
    const g = glyph8[ch] || glyph8['?'];
    for (let r = 0; r < 8; r++) {
      const bits = g[r], yy = py + r;
      if (yy < 0 || yy >= SH) continue;
      const row = yy * SW;
      for (let cIdx = 0; cIdx < 8; cIdx++) {
        const on = (bits >> (7 - cIdx)) & 1;
        const xx = px + cIdx;
        if (xx < 0 || xx >= SW) continue;
        if (on) this.buf[row + xx] = fg;
        else if (bg !== undefined && bg >= 0) this.buf[row + xx] = bg;
      }
    }
  },

  glyph5(ch, px, py, fg) {
    const g = glyph5[ch]; if (!g) return;
    for (let r = 0; r < 5; r++) {
      const bits = g[r], yy = py + r;
      if (yy < 0 || yy >= SH) continue;
      const row = yy * SW;
      for (let cIdx = 0; cIdx < 5; cIdx++) {
        if ((bits >> (4 - cIdx)) & 1) {
          const xx = px + cIdx;
          if (xx >= 0 && xx < SW) this.buf[row + xx] = fg;
        }
      }
    }
  },

  // Text an Pixelposition
  textPx(s, px, py, fg, bg) {
    if (this.fein) return F2.textLo(s, px, py, fg, bg);
    let x = px;
    for (const ch of s) { this.glyph(ch, x, py, fg, bg); x += 8; }
    return x;
  },

  // Text an Zeichenposition (Spalte/Zeile)
  text(s, col, row, fg, bg) { this.textPx(s, col * 8, row * 8, fg, bg); },

  textCentered(s, row, fg, bg) {
    if (this.fein) { this.textPx(s, Math.max(0, Math.round((SW - tw(s)) / 2)), row * 8, fg, bg); return; }
    const col = Math.max(0, Math.round((COLS - [...s].length) / 2));
    this.text(s, col, row, fg, bg);
  },

  flushHi() {
    const ctx = this.ctx, s = 4, W = 640, H = 400, b = this.buf, hb = this.hbuf;
    ctx.fillStyle = PAL[this.border];
    ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
    if (!this.himg) {
      this.himg = ctx.createImageData(W, H); this.h32 = new Uint32Array(this.himg.data.buffer);
      this.htmp = document.createElement('canvas'); this.htmp.width = W; this.htmp.height = H;
      this.p32 = new Uint32Array(256); PALRGB.forEach((c, i) => { this.p32[i] = (255 << 24) | (c[2] << 16) | (c[1] << 8) | c[0]; });
    }
    const d = this.h32, P = this.p32, ob = this.ovUsed ? this.obuf : null;
    for (let y = 0; y < SH; y++) for (let x = 0; x < SW; x++) {
      const i = y * SW + x, p = b[i], o = y * 2 * W + x * 2;
      if (ob) {                                    // feine Ebene: liegt über allem; ist der ganze Block belegt, entfällt das Glätten
        const q0 = ob[o], q1 = ob[o + 1], q2 = ob[o + W], q3 = ob[o + W + 1];
        if (q0 !== HKEY && q1 !== HKEY && q2 !== HKEY && q3 !== HKEY) { d[o] = P[q0]; d[o + 1] = P[q1]; d[o + W] = P[q2]; d[o + W + 1] = P[q3]; continue; }
      }
      if (p === HKEY) { d[o] = P[hb[o]]; d[o + 1] = P[hb[o + 1]]; d[o + W] = P[hb[o + W]]; d[o + W + 1] = P[hb[o + W + 1]];
        if (ob) { let q; if ((q = ob[o]) !== HKEY) d[o] = P[q]; if ((q = ob[o + 1]) !== HKEY) d[o + 1] = P[q]; if ((q = ob[o + W]) !== HKEY) d[o + W] = P[q]; if ((q = ob[o + W + 1]) !== HKEY) d[o + W + 1] = P[q]; }
        continue; }
      // Kanten glätten (Scale2x): Schrägen in Schrift und Figuren verlieren ihre Treppen
      const A = y > 0 ? b[i - SW] : p, D = y < SH - 1 ? b[i + SW] : p, C = x > 0 ? b[i - 1] : p, B = x < SW - 1 ? b[i + 1] : p;
      const e0 = (C === A && C !== D && A !== B) ? A : p, e1 = (A === B && A !== C && B !== D) ? B : p,
            e2 = (D === C && D !== B && C !== A) ? C : p, e3 = (B === D && B !== A && D !== C) ? D : p;
      d[o] = e0 === HKEY ? P[hb[o]] : P[e0]; d[o + 1] = e1 === HKEY ? P[hb[o + 1]] : P[e1];
      d[o + W] = e2 === HKEY ? P[hb[o + W]] : P[e2]; d[o + W + 1] = e3 === HKEY ? P[hb[o + W + 1]] : P[e3];
      if (ob) { let q; if ((q = ob[o]) !== HKEY) d[o] = P[q]; if ((q = ob[o + 1]) !== HKEY) d[o + 1] = P[q]; if ((q = ob[o + W]) !== HKEY) d[o + W] = P[q]; if ((q = ob[o + W + 1]) !== HKEY) d[o + W + 1] = P[q]; }
    }
    this.htmp.getContext('2d').putImageData(this.himg, 0, 0);
    ctx.imageSmoothingEnabled = false;
    this.ox = 16 * s; this.oy = 16 * s;
    ctx.drawImage(this.htmp, 0, 0, W, H, this.ox, this.oy, SW * s, SH * s);
  },

  flush() {
    if (this.hi) { this.flushHi(); return; }
    const ctx = this.ctx, s = INTERN;
    ctx.fillStyle = PAL[this.border];
    ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
    if (!this.img || this.img.width !== SW) this.img = ctx.createImageData(SW, SH);
    const d = this.img.data;
    for (let i = 0, n = SW * SH; i < n; i++) {
      const c = PALRGB[this.buf[i]] || PALRGB[0];
      d[i*4] = c[0]; d[i*4+1] = c[1]; d[i*4+2] = c[2]; d[i*4+3] = 255;
    }
    if (!this.tmp) { this.tmp = document.createElement('canvas'); this.tmp.width = SW; this.tmp.height = SH; }
    this.tmp.getContext('2d').putImageData(this.img, 0, 0);
    ctx.imageSmoothingEnabled = false;
    this.ox = 16 * s; this.oy = 16 * s;
    ctx.drawImage(this.tmp, 0, 0, SW, SH, this.ox, this.oy, SW * s, SH * s);
  },

  // Bildschirmkoordinaten eines Mausklicks in logische Pixel
  toLogical(clientX, clientY) {
    const r = this.canvas.getBoundingClientRect();
    const s = r.width / 352;
    return { x: (clientX - r.left) / s - 16, y: (clientY - r.top) / s - 16 };
  }
};

/* ---------------- Eingabe ---------------- */
const Input = {
  keys: {}, queue: [], hotspots: [], pointer: null,
  down: false,          // Finger oder Maustaste liegt gerade auf dem Bild

  init(canvas) {
    window.addEventListener('keydown', e => {
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
      this.keys[e.key] = true;
      // Liegt der Fokus im versteckten Eingabefeld, kommt der Text über dessen input-Ereignis.
      const inField = (typeof hidden !== 'undefined') && hidden && document.activeElement === hidden;
      if (inField && e.key.length === 1) { Sound.unlock(); return; }
      if (inField && e.key === 'Backspace') { Sound.unlock(); return; }
      this.queue.push({ type: 'key', key: e.key });
      Sound.unlock();
    });
    window.addEventListener('keyup', e => { this.keys[e.key] = false; });
    const tap = (cx, cy) => {
      const p = Screen.toLogical(cx, cy);
      this.pointer = p;
      this.queue.push({ type: 'tap', x: p.x, y: p.y });
      Sound.unlock();
    };
    canvas.addEventListener('mousedown', e => {
      this.down = true;
      tap(e.clientX, e.clientY);
      if (typeof syncTap === 'function') syncTap(Screen.toLogical(e.clientX, e.clientY));
    });
    canvas.addEventListener('mousemove', e => { this.pointer = Screen.toLogical(e.clientX, e.clientY); });
    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      this.down = true;
      const t = e.changedTouches[0]; tap(t.clientX, t.clientY);
      if (typeof syncTap === 'function') syncTap(Screen.toLogical(t.clientX, t.clientY));
    }, { passive: false });
    canvas.addEventListener('touchmove', e => {
      const t = e.changedTouches[0];
      this.pointer = Screen.toLogical(t.clientX, t.clientY);
      this.queue.push({ type: 'drag', x: this.pointer.x, y: this.pointer.y });
      e.preventDefault();
    }, { passive: false });
    // iOS gibt Tastatur und Ton nur innerhalb der Geste frei - und Ton erst beim
    // Loslassen. Deshalb hier synchron nachfassen, nicht erst im naechsten Bild.
    canvas.addEventListener('touchend', e => {
      const t = e.changedTouches[0];
      if (t && typeof syncTap === 'function') syncTap(Screen.toLogical(t.clientX, t.clientY), true);
      Sound.unlock(); Sound.resume();
      this.down = false;
      this.queue.push({ type: 'release' });
    });
    canvas.addEventListener('touchcancel', e => { this.down = false; });
    window.addEventListener('mouseup', e => { this.down = false; this.queue.push({ type: 'release' }); });
    window.addEventListener('blur', () => { this.down = false; this.keys = {}; });
  },

  poll() { const q = this.queue; this.queue = []; return q; }
};

/* --------- Textumbruch auf Zeichenbreite --------- */
/* Formel-Markup in reinem Text lesbar machen. Im Textfeld gibt es keinen
   Formelsatz - ohne diese Umsetzung stuende dort woertlich <<2*pi/B>>. */
function plainMath(s) {
  return s
    .replace(/<=/g, '\u2264').replace(/>=/g, '\u2265').replace(/!=/g, '\u2260')
    .replace(/<<([^<>]*?)\/([^<>]*?)>>/g, '$1/$2')
    .replace(/\^\{2\}/g, '²')
    .replace(/\^\{([^{}]*)\}/g, '^($1)')
    .replace(/lim\{([^{}]*)\}/g, 'lim($1)')
    .replace(/_\{0\}/g, '₀').replace(/_\{1\}/g, '₁').replace(/_\{2\}/g, '₂')
    .replace(/_\{([^{}]*)\}/g, '$1')
    .replace(/sqrt\{([^{}]*)\}/g, '\u221A($1)')
    .replace(/(^|[^A-Za-z\u00e4\u00f6\u00fc\u00c4\u00d6\u00dc\u00df])pi(?![A-Za-z\u00e4\u00f6\u00fc])/g, '$1\u03C0')
    .replace(/(\S)\*(\S)/g, '$1\u00B7$2')
    .replace(/(\S)\*(\S)/g, '$1\u00B7$2')
    .replace(/ \* /g, ' \u00B7 ');
}

/* Textbreite in alten Bildpunkten: alte Schrift 8 je Zeichen, feine Schrift 5 (mit Formelteilen gemessen) */
function tw(s) { return Screen.fein ? Math.ceil(F2.breite(String(s)) / 2) : [...String(s)].length * 8; }

function wrapText(s, width) {
  if (Screen.fein) return F2.umbruch(s, width);
  s = plainMath(String(s));
  // {name} wird ueberall durch den eingegebenen Vornamen ersetzt.
  if (typeof Game !== 'undefined' && Game && Game.name) s = s.replace(/\{name\}/g, Game.name);
  else s = s.replace(/\{name\}/g, 'du');
  // Punkte wie P(2 | 7) nie am senkrechten Strich umbrechen
  s = s.replace(/ \| /g, '\u00a0|\u00a0');
  const out = [];
  for (const para of s.split('\n')) {
    if (para === '') { out.push(''); continue; }
    let line = '';
    for (const word of para.split(' ')) {
      if (line === '') line = word;
      else if ([...line].length + 1 + [...word].length <= width) line += ' ' + word;
      else { out.push(line); line = word; }
    }
    if (line !== '') out.push(line);
  }
  return out.map(l => l.replace(/\u00a0/g, ' '));
}

/* ===== 12_fein.js ===== */
/* ============================================================
   FEINE SCHRIFT UND FEINER FORMELSATZ (640x400), ab dem Neubau von Kapitel 4 (2026-11-16)
   Kapitel mit schrift: 2 (setzt aufloesung: 2 voraus) schreiben in einer schmalen Pixelschrift:
   so hoch wie die alte, aber nur 10 statt 16 Punkte breit (font2.py, FONTF) - 64 Zeichen je Zeile
   statt 40. Die alten Bildschirme
   bleiben, wie sie sind: Screen.textPx, wrapText und der Formelsatz (fxParse, fxDraw) leiten in
   diesem Modus hierher um und rechnen alte Koordinaten in feine um. So steht in jedem Kasten
   mehr Text, ohne dass ein Bildschirm neu gebaut werden muss.

   Neu im Fließtext: Formelteile. Ein Wort mit <<a/b>>, ^{..}, _{..}, sqrt{..} oder lim{..} wird
   gesetzt statt ausgeschrieben; Brüche im Text stehen in der kleinen Schrift (das ist die alte
   8x8-Schrift, unvergrößert) und passen so in den Zeilenabstand von 18 Punkten.

   Koordinaten hier: feine Punkte (0..639, 0..399). Grundlinie einer Textzeile: y + 14.
   ============================================================ */
const FW = 10, FH = 16, FBASE = 14;
const glyphF = {};
if (typeof FONTF !== 'undefined') for (const k in FONTF) { const a = []; for (let i = 0; i < 16; i++) a.push(parseInt(FONTF[k].substr(i * 3, 3), 16)); glyphF[k] = a; }
const F2DESC = new Set('gjpqy,;()[]{}|/_„ß'.split(''));    // Zeichen, die unter die Grundlinie reichen

/* Kleine Schrift im Stil der schmalen Schrift (2026-11-18): 6 Punkte breit, 8 hoch, senkrechte Striche doppelt. Für Hochzahlen,
   Indizes und Brüche im Fließtext; was hier fehlt, kommt weiter aus der 8x8-Schrift. */

/* ---------------- Formelsatz in feinen Punkten ----------------
   art: 0 = abgesetzte Formel (Bruch in normaler Schrift), 1 = im Fließtext (Bruch in kleiner Schrift),
   2 = klein (Hochzahl, Index, Zähler und Nenner im Fließtext). */
function f2Ch(ch, klein) {
  if (klein) return { w: 7, asc: 7, desc: /[gjpqy,;]/.test(ch) ? 1 : 0, kind: 'ch', ch, klein: 1 };

        if (s[i] === '/' && depth === 0) { i++; break; }

        if (s.startsWith('<<', i)) { d2++; denSrc += '<<'; i += 2; continue; }
        if (s.startsWith('>>', i)) { if (d2 === 0) { i += 2; break; } d2--; denSrc += '>>'; i += 2; continue; }
        denSrc += s[i++];

      const kl = art >= 1;
      items.push(f2Frac(f2Parse(numSrc.trim(), kl ? 2 : 0), f2Parse(denSrc.trim(), kl ? 2 : 0), kl));

/* ===== 15_rng.js ===== */
/* ============================================================
   ZUFALL UND ZAHLENFORMAT
   Der Zufall ist gesaet: aus derselben Saat entsteht immer dieselbe
   Aufgabe. Nur so laesst sich ein Spielstand spaeter exakt fortsetzen,
   und nur so kann der Pruefer vor dem Bauen alle erzeugbaren Varianten
   durchrechnen.
   ============================================================ */

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function RNG(seed) {
  const r = mulberry32(seed >>> 0);
  return {
    seed: seed >>> 0,
    f: r,
    int(lo, hi) { return lo + Math.floor(r() * (hi - lo + 1)); },
    pick(arr) { return arr[Math.floor(r() * arr.length)]; },
    // Mehrere verschiedene Elemente ziehen
    some(arr, n) {
      const c = arr.slice();
      for (let i = c.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [c[i], c[j]] = [c[j], c[i]]; }
      return c.slice(0, n);
    },
    shuffle(arr) {
      const c = arr.slice();
      for (let i = c.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [c[i], c[j]] = [c[j], c[i]]; }
      return c;
    },
    next() { return (r() * 4294967296) >>> 0; }
  };
}

/* ---- Zahlen in Schulnotation ---- */

// 1.8 -> "1,8" ; 12 -> "12" ; rundet stille Rechenreste weg
function z(v, dec) {
  const d = dec === undefined ? 3 : dec;
  let s = (Math.round(v * Math.pow(10, d)) / Math.pow(10, d)).toString();
  return s.replace('.', ',');
}

// Vorfaktor: 1 verschwindet, -1 wird zum Minus
function zf(v) {
  if (Math.abs(v - 1) < 1e-9) return '';
  if (Math.abs(v + 1) < 1e-9) return '-';
  return z(v) + '*';
}

// Summand mit Vorzeichen: 3.2 -> " + 3,2" ; -1.5 -> " - 1,5" ; 0 -> ""
function zs(v) {
  if (Math.abs(v) < 1e-9) return '';
  return (v > 0 ? ' + ' : ' - ') + z(Math.abs(v));
}

// Klammerinhalt t - C in Schulschreibweise
function zsub(varName, c) {
  if (Math.abs(c) < 1e-9) return varName;
  return varName + (c > 0 ? ' - ' : ' + ') + z(Math.abs(c));
}

// Vielfaches von pi als Bruch im Formel-Markup: pi/6, 2pi/3, pi, 2pi
function zpi(v) {
  const dens = [1, 2, 3, 4, 5, 6, 8, 10, 12];
  for (const d of dens) {
    const n = v * d / Math.PI;
    if (Math.abs(n - Math.round(n)) < 1e-6) {
      const nn = Math.round(n);
      if (nn === 0) return '0';
      const sign = nn < 0 ? '-' : '';
      const num = (Math.abs(nn) === 1 ? 'pi' : Math.abs(nn) + 'pi');
      return d === 1 ? sign + num : sign + '<<' + num + '/' + d + '>>';
    }
  }
  return z(v);
}

// Uhrzeit aus einer Stundenzahl: 7 -> "7:00 Uhr", 7.5 -> "7:30 Uhr"
function zuhr(h) {
  let hh = Math.floor(((h % 24) + 24) % 24);
  let mm = Math.round((h - Math.floor(h)) * 60);
  if (mm === 60) { mm = 0; hh = (hh + 1) % 24; }
  return hh + ':' + String(mm).padStart(2, '0') + ' Uhr';
}

/* ===== 20_formula.js ===== */
/* ============================================================
   FORMELSATZ AUF DEM PIXELRASTER
   Markup (an math-exam-docx angelehnt):
     <<a/b>>    Bruch          ^{..} Exponent      _{..} Index
     sqrt{..}   Wurzel         pi * <= >= != +- ~~ -> werden ersetzt
     lim{h->0}  Grenzwert, die Bedingung steht klein unter dem lim
   Ausgabe: echte Pixelglyphen, keine Ersatzzeichen.
   ============================================================ */

const AXIS = 4;     // Bruchstrich auf Höhe von Minus und Mitte des Gleichheitszeichens
const RAISE = 5;    // Hochstellung
const DROP = -1;    // Tiefstellung: Oberkante eine Zeile über der Grundlinie

function fxPre(s) {
  return s
    .replace(/<=/g, '≤').replace(/>=/g, '≥').replace(/!=/g, '≠')
    .replace(/\+-/g, '±').replace(/~~/g, '≈').replace(/->/g, '→')
    .replace(/\*/g, '·').replace(/\binf\b/g, '∞')
    .replace(/(^|[^A-Za-z])pi($|[^A-Za-z])/g, '$1π$2')
    .replace(/(^|[^A-Za-z])pi($|[^A-Za-z])/g, '$1π$2');
}

/* ---- Boxen ---- */
function bChar(ch) {
  return { w: 8, asc: 7, desc: 1, kind: 'ch', ch };

function bMini(str) {
  return { w: str.length * 5 - (str.length ? 1 : 0) + 1, asc: 5, desc: 0, kind: 'mini', s: str };
}
function bRow(items) {
  let w = 0, asc = 0, desc = 0;
  for (const it of items) { w += it.w; asc = Math.max(asc, it.asc); desc = Math.max(desc, it.desc); }
  return { w, asc, desc, kind: 'row', items };
}
/* Steckt im Zähler oder Nenner selbst ein Bruch (Doppelbruch), bekommt der
   äußere Bruch einen deutlich längeren Strich und mehr Luft. Sonst sind
   Haupt- und Nebenbruchstrich gleich lang und die Ebenen nicht zu trennen. */
function hasFrac(b) {
  if (!b) return false;
  if (b.kind === 'frac') return true;
  if (b.kind === 'row') return b.items.some(hasFrac);
  if (b.kind === 'sup' || b.kind === 'sub') return hasFrac(b.base);
  return false;
}
function bFrac(num, den) {
  const nested = hasFrac(num) || hasFrac(den);
  const pad = nested ? 12 : 4;            // Überstand des Bruchstrichs gesamt
  const gN = nested ? 2 : 1;              // Leerzeilen zwischen Zähler und Strich
  const gD = nested ? 2 : 1;              // Leerzeilen zwischen Strich und Nenner
  const w = Math.max(num.w, den.w) + pad;
  const asc = AXIS + 1 + gN + num.desc + num.asc;
  const desc = Math.max(0, 1 + gD + den.asc + den.desc - AXIS);
  return { w, asc, desc, kind: 'frac', num, den, gN, gD };
}
/* Grenzwert: „lim" in Normalschrift, darunter klein die Bedingung (h→0).
   Der kleine Font hat keinen Pfeil, der wird von Hand gezeichnet (7 px). */
function miniW(str) { let w = 0; for (const ch of str) w += ch === '→' ? 8 : 5; return w; }
function bLim(under) {
  const uw = miniW(under);
  return { w: Math.max(24, uw) + 2, asc: 7, desc: 7, kind: 'lim', under, uw };
}
function bSqrt(inner) {
  return { w: inner.w + 9, asc: inner.asc + 4, desc: inner.desc, kind: 'sqrt', inner };
}
function bSup(base, exp) {
  return { w: base.w + exp.w, asc: Math.max(base.asc, RAISE + exp.asc), desc: base.desc, kind: 'sup', base, exp };
}
function bSub(base, sub) {
  return { w: base.w + sub.w, asc: base.asc, desc: Math.max(base.desc, DROP + sub.asc), kind: 'sub', base, sub };
}
function bParen(open, inner) {
  // skalierende Klammer, wenn der Inhalt höher ist als eine Normalzeile
  const tall = (inner.asc + inner.desc) > 12;
  return { w: (tall ? 5 : 8), asc: tall ? inner.asc : 7, desc: tall ? inner.desc : 1,
           kind: 'paren', open, tall, h: inner.asc + inner.desc, ia: inner.asc };
}

/* ---- Parser ---- */
function fxParse(src) {
  if (Screen.fein) return f2Lo(src);          // feine Schrift: gesetzt in 12_fein.js, Maße in alten Bildpunkten
  const s = fxPre(src);
  let i = 0;

  function parseGroup(stopFn) {
    const items = [];
    while (i < s.length) {
      if (stopFn && stopFn()) break;
      const c = s[i];

      if (s.startsWith('<<', i)) {           // Bruch
        i += 2;
        let depth = 0, numSrc = '';
        while (i < s.length) {
          if (s.startsWith('<<', i)) { depth++; numSrc += '<<'; i += 2; continue; }
          if (s.startsWith('>>', i)) { depth--; numSrc += '>>'; i += 2; continue; }
          if (s[i] === '/' && depth === 0) { i++; break; }
          numSrc += s[i++];
        }
        let d2 = 0, denSrc = '';
        while (i < s.length) {
          if (s.startsWith('<<', i)) { d2++; denSrc += '<<'; i += 2; continue; }
          if (s.startsWith('>>', i)) { if (d2 === 0) { i += 2; break; } d2--; denSrc += '>>'; i += 2; continue; }
          denSrc += s[i++];
        }
        items.push(bFrac(fxParse(numSrc), fxParse(denSrc)));
        continue;
      }

      if (s.startsWith('lim{', i)) {         // Grenzwert
        i += 4;
        let under = '';
        while (i < s.length && s[i] !== '}') under += s[i++];
        i++;
        items.push(bLim(under.replace(/\s+/g, '')));
        continue;
      }

      if (s.startsWith('sqrt', i)) {         // Wurzel
        i += 4;
        let inner = '';
        if (s[i] === '{') { i++; let d = 0;
          while (i < s.length) { if (s[i] === '{') d++; if (s[i] === '}') { if (!d) { i++; break; } d--; } inner += s[i++]; }
        }
        items.push(bSqrt(fxParse(inner)));
        continue;
      }

      if (c === '^' || c === '_') {          // Hoch-/Tiefstellung
        i++;
        let arg = '';
        if (s[i] === '{') { i++; let d = 0;
          while (i < s.length) { if (s[i] === '{') d++; if (s[i] === '}') { if (!d) { i++; break; } d--; } arg += s[i++]; }
        } else { arg = s[i++] || ''; }
        const base = items.length ? items.pop() : bRow([]);
        items.push(c === '^' ? bSup(base, bMini(arg)) : bSub(base, bMini(arg)));
        continue;
      }

      if (c === '(' || c === ')') {          // Klammern mit Höhenanpassung
        if (c === '(') {
          const start = i; i++;
          let d = 0, innerSrc = '';
          while (i < s.length) {
            if (s[i] === '(') d++;
            if (s[i] === ')') { if (!d) break; d--; }
            innerSrc += s[i++];
          }
          if (s[i] === ')') i++;
          const inner = fxParse(innerSrc);
          const tall = (inner.asc + inner.desc) > 12;
          if (tall) {
            items.push(bParen('(', inner));
            items.push(inner);
            items.push(bParen(')', inner));
          } else {
            items.push(bChar('(')); items.push(inner); items.push(bChar(')'));
          }
          continue;
        }
        i++; items.push(bChar(')')); continue;
      }

      items.push(bChar(c)); i++;
    }
    return bRow(items);
  }
  return parseGroup(null);
}

/* ---- Zeichnen ---- */
function fxDraw(box, x, base, col) {
  if (box.kind === 'f2') { f2Draw(box.f2, Math.round(x * 2), Math.round(base * 2), col); return; }
  switch (box.kind) {
    case 'ch': Screen.glyph(box.ch, x, base - 7, col); break;
    case 'mini': {
      let xx = x;
      for (const ch of box.s) { Screen.glyph5(ch, xx, base - 5, col); xx += 5; }
      break;
    }
    case 'row': { let xx = x; for (const it of box.items) { fxDraw(it, xx, base, col); xx += it.w; } break; }
    case 'frac': {
      const cx = x + box.w / 2;
      const lineY = base - AXIS;
      Screen.rect(x + 1, lineY, box.w - 2, 1, col);
      fxDraw(box.num, Math.round(cx - box.num.w / 2), lineY - box.gN - box.num.desc, col);
      fxDraw(box.den, Math.round(cx - box.den.w / 2), lineY + 1 + box.gD + box.den.asc, col);
      break;
    }
    case 'sqrt': {
      const inner = box.inner;
      const topY = base - inner.asc - 3;
      const botY = base + inner.desc;
      // Haken
      Screen.px(x, botY - 4, col); Screen.px(x + 1, botY - 4, col);
      Screen.px(x + 1, botY - 3, col); Screen.px(x + 2, botY - 2, col);
      Screen.px(x + 2, botY - 1, col); Screen.px(x + 3, botY, col);
      for (let yy = topY; yy <= botY; yy++) {
        const t = (yy - topY) / Math.max(1, botY - topY);
        Screen.px(x + 4 + Math.round((1 - t) * 1), yy, col);
      }
      Screen.rect(x + 5, topY, inner.w + 3, 1, col);
      fxDraw(inner, x + 6, base, col);
      break;
    }
    case 'lim': {
      let xx = x + 1 + Math.round((box.w - 2 - 24) / 2);
      for (const ch of 'lim') { Screen.glyph(ch, xx, base - 7, col); xx += 8; }
      xx = x + 1 + Math.round((box.w - 2 - box.uw) / 2);
      const top = base + 2;                       // Oberkante der Bedingung
      for (const ch of box.under) {
        if (ch === '→') {                         // Pfeil, 7 px breit
          Screen.rect(xx, top + 2, 6, 1, col);
          Screen.px(xx + 4, top + 1, col); Screen.px(xx + 4, top + 3, col);
          Screen.px(xx + 3, top, col);     Screen.px(xx + 3, top + 4, col);
          xx += 8;
        } else { Screen.glyph5(ch, xx, top, col); xx += 5; }
      }
      break;
    }
    case 'sup': fxDraw(box.base, x, base, col);
                fxDraw(box.exp, x + box.base.w, base - RAISE, col); break;
    case 'sub': fxDraw(box.base, x, base, col);
                fxDraw(box.sub, x + box.base.w, base + DROP + box.sub.asc - 5 + 5, col); break;
    case 'paren': {
      const top = base - box.asc, bot = base + box.desc - 1;   // Box ist halboffen
      if (box.open === '(') {
        Screen.rect(x + 2, top + 1, 2, bot - top - 1, col);
        Screen.px(x + 3, top, col); Screen.px(x + 4, top, col);
        Screen.px(x + 3, bot, col); Screen.px(x + 4, bot, col);
      } else {
        Screen.rect(x + 1, top + 1, 2, bot - top - 1, col);
        Screen.px(x, top, col); Screen.px(x + 1, top, col);
        Screen.px(x, bot, col); Screen.px(x + 1, bot, col);
      }
      break;
    }
  }
}

function fxMeasure(src) { return fxParse(src); }

/* Formel zentriert in eine Bildschirmzeile setzen; gibt belegte Höhe zurück */
function drawFormulaCentered(src, yTop, col, leftPad) {
  const box = fxParse(src);
  const x = leftPad !== undefined ? leftPad : Math.round((SW - box.w) / 2);
  fxDraw(box, x, yTop + box.asc, col);
  return box.asc + box.desc;
}

function drawFormulaAt(src, x, yTop, col) {
  const box = fxParse(src);
  fxDraw(box, x, yTop + box.asc, col);
  return box;
}

/* ===== 30_sound.js ===== */
/* ============================================================
   KLANG v2 - vierstimmiger Tracker im Stil der Amiga-Zeit (ca. 1987).
   Gegenueber v1 neu: vier statt drei Stimmen, Vibrato mit Einschwingzeit,
   Portamento im Bass, Pulsweiten-Modulation im Lead, Echo-Send,
   weicherer Tiefpass, Percussion aus gefiltertem Rauschen mit
   Tonhoehenhuellkurve, laengere Songformen ueber eine Pattern-Reihenfolge
   und eine adaptive Mischung: beim Rechnen pausiert der Lead.
   Alle Melodien sind Eigenkompositionen.
   ============================================================ */

const Sound = {
  ctx: null, master: null, dry: null, echoIn: null,
  on: true, ready: false, pending: null,
  timer: null, song: null, rowIdx: 0, ordIdx: 0, nextTime: 0,
  waves: {}, layer: 'full', lastBass: null,

  unlock() {
    if (this.ready) return;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();

      this.master = this.ctx.createGain();
      this.master.gain.value = 0.20;

      // Weicher Ausgangsfilter - nimmt dem Rechteck die Schaerfe.
      const filt = this.ctx.createBiquadFilter();
      filt.type = 'lowpass'; filt.frequency.value = 2600; filt.Q.value = 0.6;

      // Etwas Hoehenglanz zurueck, damit es nicht dumpf wird.
      const shelf = this.ctx.createBiquadFilter();
      shelf.type = 'highshelf'; shelf.frequency.value = 3000; shelf.gain.value = 2.5;

      this.master.connect(filt); filt.connect(shelf); shelf.connect(this.ctx.destination);

      // Echo-Send: das Kennzeichen der MOD-Aera.
      this.echoIn = this.ctx.createGain(); this.echoIn.gain.value = 1;
      const dl = this.ctx.createDelay(1.0); dl.delayTime.value = 0.21;
      const fb = this.ctx.createGain(); fb.gain.value = 0.30;
      const dampen = this.ctx.createBiquadFilter();
      dampen.type = 'lowpass'; dampen.frequency.value = 1700;
      this.echoIn.connect(dl); dl.connect(dampen); dampen.connect(fb); fb.connect(dl);
      dampen.connect(filt);

      this.ready = true;
      if (this.pending) { const p = this.pending; this.pending = null; this.play(p); }
    } catch (e) { this.on = false; }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },

  /* iOS startet den AudioContext oft angehalten; bei jeder Geste nachschieben. */
  resume() {
    try { if (this.ctx && this.ctx.state !== 'running') this.ctx.resume(); } catch (e) {}
  },

  /* Mischung: 'full' im Dialog, auf der Karte und im Bosskampf,
     'soft' waehrend gerechnet wird - Lead und Schlagwerk schweigen. */
  setLayer(l) {
    if (this.layer === l) return;
    this.layer = l;
    if (this.master) {
      const t = this.ctx.currentTime;
      this.master.gain.cancelScheduledValues(t);
      this.master.gain.setTargetAtTime(l === 'soft' ? 0.12 : 0.20, t, 0.4);
    }
  },

  pulseWave(duty) {
    const key = 'p' + duty.toFixed(2);
    if (this.waves[key]) return this.waves[key];
    const n = 24, real = new Float32Array(n), imag = new Float32Array(n);
    for (let i = 1; i < n; i++) {
      // sanfte Obertonbedaempfung - das ist der Unterschied zum harten SID
      real[i] = (2 / (i * Math.PI)) * Math.sin(i * Math.PI * duty) * Math.pow(0.86, i - 1);
    }
    const w = this.ctx.createPeriodicWave(real, imag, { disableNormalization: false });
    this.waves[key] = w; return w;
  },

  freq(n) { return 440 * Math.pow(2, (n - 69) / 12); },

  /* Ein Ton. opts: wave, duty, vol, a/d/s/r, vib, glideFrom, echo, arp, pwm */
  note(n, t, dur, opts) {
    if (!this.ready || !this.on) return;
    const o = Object.assign({
      wave: 'pulse', duty: 0.35, vol: 0.4, a: 0.008, d: 0.09, s: 0.55, r: 0.10,
      vib: null, glideFrom: null, echo: 0, arp: null, pwm: 0
    }, opts || {});

    const osc = this.ctx.createOscillator();
    if (o.wave === 'pulse') osc.setPeriodicWave(this.pulseWave(o.duty));
    else osc.type = o.wave;

    const g = this.ctx.createGain();
    // Pro Stimme ein sanfter Filter - macht aus Rechteck etwas Floetenartiges.
    const vf = this.ctx.createBiquadFilter();
    vf.type = 'lowpass';
    vf.frequency.setValueAtTime(Math.min(9000, this.freq(n) * 7 + 400), t);
    vf.Q.value = 0.9;
    osc.connect(vf); vf.connect(g); g.connect(this.master);
    if (o.echo > 0) { const sg = this.ctx.createGain(); sg.gain.value = o.echo; g.connect(sg); sg.connect(this.echoIn); }

    const f = this.freq(n);
    if (o.glideFrom && Math.abs(o.glideFrom - n) > 0.1) {
      osc.frequency.setValueAtTime(this.freq(o.glideFrom), t);
      osc.frequency.exponentialRampToValueAtTime(f, t + Math.min(0.09, dur * 0.4));
    } else {
      osc.frequency.setValueAtTime(f, t);
    }

    if (o.arp) {
      const step = 0.035;
      for (let k = 0; k * step < dur; k++) osc.frequency.setValueAtTime(this.freq(n + o.arp[k % o.arp.length]), t + k * step);
    }

    // Vibrato setzt verzoegert ein - gehaltene Toene bekommen erst spaet Leben.
    if (o.vib) {
      const lfo = this.ctx.createOscillator(); lfo.frequency.value = o.vib.rate;
      const amt = this.ctx.createGain();
      amt.gain.setValueAtTime(0.0001, t);
      amt.gain.setValueAtTime(0.0001, t + (o.vib.delay || 0.15));
      amt.gain.linearRampToValueAtTime(f * o.vib.depth, t + (o.vib.delay || 0.15) + 0.12);
      lfo.connect(amt); amt.connect(osc.frequency);
      lfo.start(t); lfo.stop(t + dur + 0.05);
    }

    // Pulsweiten-Modulation: ein zweiter Ton mit leicht anderer Weite,
    // minimal verstimmt - das schwebende Breite-Gefuehl der MOD-Leads.
    if (o.pwm > 0 && o.wave === 'pulse') {
      const o2 = this.ctx.createOscillator();
      o2.setPeriodicWave(this.pulseWave(Math.min(0.48, o.duty + 0.14)));
      o2.frequency.setValueAtTime(f * 1.004, t);
      const g2 = this.ctx.createGain(); g2.gain.value = o.pwm;
      o2.connect(g2); g2.connect(vf);
      o2.start(t); o2.stop(t + dur + 0.02);
    }

    const peak = o.vol;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + o.a);
    g.gain.linearRampToValueAtTime(peak * o.s, t + o.a + o.d);
    g.gain.setValueAtTime(peak * o.s, t + Math.max(o.a + o.d, dur - o.r));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.start(t); osc.stop(t + dur + 0.03);
  },

  noise(t, dur, vol, freq, type, q) {
    if (!this.ready || !this.on) return;
    const len = Math.max(1, Math.floor(this.ctx.sampleRate * dur));
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 1.6);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const bp = this.ctx.createBiquadFilter();
    bp.type = type || 'bandpass';
    bp.frequency.value = freq || 1200; bp.Q.value = q === undefined ? 1.2 : q;
    const g = this.ctx.createGain(); g.gain.value = vol || 0.3;
    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t);
  },

  /* ---- Schlagwerk: gerendert statt geklickt ---- */
  drum(kind, t) {
    if (!this.ready || !this.on) return;
    if (kind === 'k') {                       // Bassdrum mit Tonhoehenabfall
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(128, t);
      o.frequency.exponentialRampToValueAtTime(42, t + 0.11);
      g.gain.setValueAtTime(0.5, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
      o.connect(g); g.connect(this.master); o.start(t); o.stop(t + 0.18);
      this.noise(t, 0.03, 0.12, 900, 'lowpass', 0.7);
    } else if (kind === 's') {                // Snare: Rauschen plus Koerper
      this.noise(t, 0.14, 0.26, 1900, 'bandpass', 0.8);
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = 'triangle'; o.frequency.setValueAtTime(190, t);
      g.gain.setValueAtTime(0.18, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
      o.connect(g); g.connect(this.master); o.start(t); o.stop(t + 0.1);
    } else if (kind === 'h') {                // Hihat
      this.noise(t, 0.035, 0.09, 8000, 'highpass', 0.7);
    }
  },

  /* ---- Effekte ---- */
  sfx(name) {
    if (!this.ready || !this.on) return;
    const t = this.ctx.currentTime;
    const L = { wave: 'pulse', duty: 0.35, echo: 0.2 };
    switch (name) {
      case 'tick':  this.note(84, t, 0.035, { duty: 0.5, vol: 0.10, d: 0.02, s: 0.2 }); break;
      case 'move':  this.note(76, t, 0.05, { duty: 0.2, vol: 0.16, d: 0.03, s: 0.3 }); break;
      case 'right': [72, 76, 79, 84].forEach((n, i) => this.note(n, t + i * 0.055, 0.16, Object.assign({ vol: 0.36 }, L))); break;
      case 'wrong': [61, 58, 54].forEach((n, i) => this.note(n, t + i * 0.1, 0.2, { wave: 'sawtooth', vol: 0.3, echo: 0.25 })); break;
      case 'hint':  [79, 84, 88].forEach((n, i) => this.note(n, t + i * 0.06, 0.14, { duty: 0.5, vol: 0.22, echo: 0.35 })); break;
      case 'hit':   this.drum('s', t); this.note(45, t, 0.16, { wave: 'sawtooth', vol: 0.34 }); break;
      case 'damage':this.drum('k', t); this.noise(t, 0.35, 0.3, 380, 'lowpass', 0.8);
                    this.note(38, t, 0.3, { wave: 'sawtooth', vol: 0.38 }); break;
      case 'magic': for (let i = 0; i < 10; i++) this.note(58 + i * 3, t + i * 0.032, 0.11, { duty: 0.2, vol: 0.16, echo: 0.4 }); break;
      case 'save':  [67, 72, 76].forEach((n, i) => this.note(n, t + i * 0.08, 0.24, { duty: 0.35, vol: 0.26, echo: 0.3 })); break;
      case 'lock':  [55, 51, 48].forEach((n, i) => this.note(n, t + i * 0.12, 0.3, { wave: 'triangle', vol: 0.3, echo: 0.4 })); break;
      case 'unlock':[60, 64, 67, 72].forEach((n, i) => this.note(n, t + i * 0.07, 0.2, { duty: 0.3, vol: 0.26, echo: 0.35 })); break;
      case 'gate':  this.noise(t, 0.5, 0.2, 260, 'lowpass', 0.9); this.note(36, t, 0.5, { wave: 'sawtooth', vol: 0.3 }); break;
      // Übergabe einer Belohnung (seit 2026-11-18): Flug = aufsteigendes Glitzern, Ankunft = kleine Fanfare mit Funkeln, Beschlag = Metallklang
      case 'gabeFlug': for (let i = 0; i < 8; i++) this.note(64 + i * 2, t + i * 0.07, 0.1, { duty: 0.25, vol: 0.13, echo: 0.35 }); break;
      case 'gabe':  [72, 76, 79].forEach(n => this.note(n, t, 0.3, { duty: 0.35, vol: 0.2, echo: 0.3 }));
                    [76, 79, 84].forEach(n => this.note(n, t + 0.16, 0.5, { duty: 0.35, vol: 0.22, echo: 0.4 }));
                    [96, 100, 103, 108].forEach((n, i) => this.note(n, t + 0.34 + i * 0.05, 0.08, { duty: 0.5, vol: 0.09, echo: 0.5 })); break;
      // Bosskampf (seit 2026-11-18): richtig = Fanfare, dann ärgert sich F'Abiturio (Wah-wah-waah); falsch = Treffer, dann sein fieses Lachen
      case 'treffer': [72, 76, 79, 84].forEach((n, i) => this.note(n, t + i * 0.055, 0.16, Object.assign({ vol: 0.34 }, L)));
                    [[50, 0.34, 0.16], [48, 0.52, 0.16], [44, 0.7, 0.4]].forEach(([n, d, l]) => this.note(n, t + d, l, { wave: 'sawtooth', vol: 0.2, echo: 0.2 })); break;
      case 'patzer': this.drum('k', t); this.note(40, t, 0.25, { wave: 'sawtooth', vol: 0.3 });
                    [81, 78, 81, 78, 81, 75].forEach((n, i) => this.note(n, t + 0.35 + i * 0.1, 0.07, { duty: 0.12, vol: 0.18, echo: 0.3 })); break;
      case 'beschlag': this.note(88, t, 0.08, { wave: 'triangle', vol: 0.24, echo: 0.5 }); this.note(95, t + 0.02, 0.14, { wave: 'triangle', vol: 0.12, echo: 0.6 }); break;
    }
  },

  /* ---- Abspieler ---- */
  play(name) {
    if (!this.ready) { this.pending = name; return; }
    if (this.song && this.song.name === name) return;
    this.stop();
    const s = SONGS[name]; if (!s) return;
    this.song = { name, data: s };
    this.rowIdx = 0; this.ordIdx = 0; this.lastBass = null;
    this.nextTime = this.ctx.currentTime + 0.06;
    this.timer = setInterval(() => this.pump(), 40);
    this.pump();
  },

  stop() {
    if (this.timer) clearInterval(this.timer);
    this.timer = null; this.song = null;
  },

  pump() {
    if (!this.song || !this.on || !this.ready) return;
    const s = this.song.data, rowDur = 60 / s.bpm / s.div;
    const soft = this.layer === 'soft';
    const I = s.instr || {};
    while (this.nextTime < this.ctx.currentTime + 0.35) {
      const patName = s.order[this.ordIdx % s.order.length];
      const pat = s.patterns[patName];
      const row = pat[this.rowIdx % pat.length];
      const t = this.nextTime;

      // Stimme 1: Lead - schweigt in der weichen Mischung
      if (row[0] > 0 && !soft) {
        this.note(row[0] + (s.transpose || 0), t, rowDur * (s.leadLen || 1.7),
          Object.assign({ duty: 0.35, vol: 0.30, echo: 0.28, pwm: 0.35,
                          vib: { rate: 5.2, depth: 0.007, delay: 0.16 } }, I.lead || {}));
      }
      // Stimme 2: Bass - mit Portamento zwischen benachbarten Toenen
      if (row[1] > 0) {
        const n = row[1] + (s.transpose || 0);
        this.note(n, t, rowDur * 0.92,
          Object.assign({ wave: 'triangle', vol: soft ? 0.30 : 0.34, a: 0.006, d: 0.12, s: 0.45, r: 0.06,
                          glideFrom: (s.glide && this.lastBass) ? this.lastBass : null }, I.bass || {}));
        this.lastBass = n;
      }
      // Stimme 3: Flaeche bzw. Arpeggio
      if (row[2] > 0) {
        this.note(row[2] + (s.transpose || 0), t, rowDur * (s.padLen || 1.9),
          Object.assign({ duty: 0.5, vol: soft ? 0.09 : 0.13, a: 0.12, d: 0.25, s: 0.7, r: 0.3,
                          echo: 0.4, arp: s.arp || null }, I.pad || {}));
      }
      // Stimme 4: Gegenstimme
      if (row[3] > 0 && !soft) {
        this.note(row[3] + (s.transpose || 0), t, rowDur * 1.2,
          Object.assign({ duty: 0.2, vol: 0.14, a: 0.01, d: 0.1, s: 0.4, r: 0.1, echo: 0.3 }, I.counter || {}));
      }
      // Schlagwerk
      if (s.perc && !soft) {
        const p = s.perc[patName] || s.perc.A;
        if (p) { const k = p[this.rowIdx % p.length]; if (k && k !== '.') this.drum(k, t); }
      }

      this.nextTime += rowDur;
      this.rowIdx++;
      if (this.rowIdx % pat.length === 0) { this.ordIdx++; this.rowIdx = 0; }
    }
  }
};

/* ===== 32_klang3.js ===== */
/* ============================================================
   KLANG v3 (Weg B) - ab Kapitel 3, im Kapitel eingeschaltet mit klang: 3.
   FM-Stimmen statt Rechteckwellen (Steel Drum, Marimba, Glocke, Orgel),
   weicher Bass, Fläche, Schlagwerk aus gefiltertem Rauschen und ein Hall
   aus einem selbst erzeugten Impuls. Alles wird erzeugt, keine Audiodateien.
   Die Stücke sind Eigenkompositionen und werden taktweise geplant:
   bar(K, takt, t, B) setzt die Töne eines Taktes ab Zeit t, B = ein Schlag.
   Rollen: 'lead' und 'perc' schweigen in der leisen Mischung (beim Rechnen).
   Kapitel ohne klang: 3 laufen unverändert mit Klang v2 (30_sound.js).
   ============================================================ */

function klang3Kit(ctx, ziel) {
  const SR = ctx.sampleRate;
  const master = ctx.createGain(); master.gain.value = 0.5;
  const glanz = ctx.createBiquadFilter(); glanz.type = 'highshelf'; glanz.frequency.value = 5200; glanz.gain.value = 1.5;
  const komp = ctx.createDynamicsCompressor();
  komp.threshold.value = -14; komp.ratio.value = 2.5; komp.attack.value = 0.03; komp.release.value = 0.25;   // träge, damit der Bass die Melodie nicht mitmoduliert
  master.connect(glanz); glanz.connect(komp); komp.connect(ziel || ctx.destination);

  // Hall: Impuls aus abklingendem Rauschen, je Seite leicht verschieden
  const hlen = (SR * 2.0) | 0, ir = ctx.createBuffer(2, hlen, SR);
  let seed = 4711; const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x3fffffff - 1; };
  for (let k = 0; k < 2; k++) { const d = ir.getChannelData(k); for (let i = 0; i < hlen; i++) d[i] = rnd() * Math.pow(1 - i / hlen, 2.6) * (i < 300 ? i / 300 : 1); }
  const hall = ctx.createConvolver(); hall.buffer = ir;
  const hallWeg = ctx.createGain(); hallWeg.gain.value = 0.85;
  const daempfer = ctx.createBiquadFilter(); daempfer.type = 'lowpass'; daempfer.frequency.value = 3400;
  hallWeg.connect(daempfer); daempfer.connect(hall); hall.connect(master);

  // ein Vorrat Rauschen für das ganze Schlagwerk
  const rb = ctx.createBuffer(1, SR, SR), rd = rb.getChannelData(0);
  for (let i = 0; i < SR; i++) rd[i] = rnd();

  /* Jedes Stück bekommt eigene Wege: beim Wechsel wird der alte Weg ausgeblendet,
     schon geplante Töne des alten Stücks verstummen mit ihm. */
  function wege() {
    const alle = ctx.createGain(), lead = ctx.createGain(), perc = ctx.createGain(), send = ctx.createGain(),
          sendLead = ctx.createGain(), sendPerc = ctx.createGain();
    alle.connect(master); lead.connect(alle); perc.connect(alle); send.connect(hallWeg);
    sendLead.connect(send); sendPerc.connect(send);          // der Hall von Lead und Schlagwerk schweigt mit ihnen
    return { alle, lead, perc, send, sendLead, sendPerc };
  }
  let W = wege();
  // Effekte (richtig, falsch, Tipp) haben einen eigenen Weg: sie überleben jeden Stückwechsel
  const fx = ctx.createGain(), fxSend = ctx.createGain(); fx.connect(master); fxSend.connect(hallWeg);
  const f = n => 440 * Math.pow(2, (n - 69) / 12);
  const aus = rolle => rolle === 'lead' ? W.lead : (rolle === 'perc' ? W.perc : (rolle === 'fx' ? fx : W.alle));
  function huelle(g, t, dur, spitze, anstieg, halten) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(spitze, t + anstieg);
    if (halten) g.gain.setValueAtTime(spitze, t + dur * 0.6);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  }
  function raus(knoten, rolle, pan, hallAnteil) {
    let letzter = knoten;
    if (pan && ctx.createStereoPanner) { const p = ctx.createStereoPanner(); p.pan.value = pan; knoten.connect(p); letzter = p; }
    letzter.connect(aus(rolle));
    if (hallAnteil > 0) {
      const s = ctx.createGain(); s.gain.value = hallAnteil; letzter.connect(s);
      s.connect(rolle === 'lead' ? W.sendLead : (rolle === 'perc' ? W.sendPerc : (rolle === 'fx' ? fxSend : W.send)));
    }
  }

  const K = {
    ctx, master,
    /* FM-Stimme: Träger plus Modulator. Verhältnis und Index machen den Unterschied
       zwischen Marimba (3), Steel Drum (1) und Orgel (1, hoher Index). */
    fm(note, t, dur, o) {
      o = Object.assign({ verh: 2, index: 2, vol: 0.3, abkling: 1, hall: 0.25, pan: 0, vibrato: 0, rolle: null, anstieg: 0.006 }, o || {});
      const frq = f(note);
      const tr = ctx.createOscillator(); tr.type = 'sine'; tr.frequency.value = frq;
      const mo = ctx.createOscillator(); mo.type = 'sine'; mo.frequency.value = frq * o.verh;
      const moG = ctx.createGain();
      moG.gain.setValueAtTime(frq * o.index, t);
      moG.gain.exponentialRampToValueAtTime(Math.max(0.01, frq * o.index * 0.05), t + dur * o.abkling);
      mo.connect(moG); moG.connect(tr.frequency);
      if (o.vibrato) {

      W.alle.gain.setTargetAtTime(leise ? 0.6 : 1, t, zk);

  };
  return K;
}

/* ============================================================
   SPIELKERN v2.2
   Ablauf: Vorspann -> Torwaechter -> Karte mit Stationen in freier
   Reihenfolge -> Bosskampf -> Abspann.
   Seit Kapitel 2 kann ein Kapitel mehrere Tore haben (gates statt gate):
   hinter jedem Tor liegt eine Insel mit eigenen Stationen (station.island).
   Sind alle Stationen einer Insel geloest, kommt das naechste Tor. Ein Tor
   mit retry: true schickt bei Misserfolg in eine neue Fragerunde statt
   ans Kapitelende.
   Seit v2.3 kann jede Insel ihren eigenen Bösewicht haben (gates[i].villain:
   dreht an den Zahlen, hat eigene Schreck-/Hohnzeilen) und einen eigenen
   Endgegner (gates[i].boss), der nach der letzten Station der Insel kommt.
   Aufgaben werden aus Generatoren erzeugt, die Antwortreihenfolge wird
   gemischt, und wer danebenliegt, bekommt nach dem Tipp dieselbe Aufgabe
   mit neuen Zahlen. Dreimal daneben sperrt die Station, bis anderswo
   etwas geloest wurde.
   ============================================================ */

const ST_OPEN = 0, ST_LOCKED = 1, ST_DONE = 2;

const Game = {
  mode: 'boot',          // boot|title|help|name|teacher|play|end
  view: 'talk',          // innerhalb play: talk|gate|map|task|mini|boss
  t: 0,
  name: '', nameBuf: '',
  score: 0, right: 0, wrong: 0, hintsUsed: 0, lives: 3,
  startedAt: 0,
  chapter: null, chapterId: 1,
  seed: 1,

  talk: null,            // { list, i, then }
  gate: null,            // { i, right, phase, pick, qs }
  stations: [],          // [{ state, ti, seed, tries, hints, lockAt, seen }]
  cur: -1,
  task: null, taskPhase: 'ask', pick: -1,
  mini: null,
  boss: null,
  lockCounter: 0,
  endStatus: 1,

  msg: null, msgT: 0, msgCol: 7,
  typed: 0, typing: false, page: 0, sel: 0,
  codeBuf: '', codeResult: null, code: '',

  /* ---------------- Start und Grundzustand ---------------- */
  start(chapter) {
    this.chapter = chapter;
    this.chapterId = chapter.id;
    this.mode = 'title';
    this.startedAt = Date.now();
    Sound.setLayer('full');
    Sound.play('title');
  },

  reset() {
    this.score = 0; this.right = 0; this.wrong = 0; this.hintsUsed = 0;
    this.lives = 3; this.startedAt = Date.now();
    this.seed = (Date.now() ^ 0x9e3779b9) >>> 0;
    this.stations = this.chapter.stations.map(() => ({
      state: ST_OPEN, ti: 0, seed: this.nextSeed(), tries: 0, hints: 0, lockAt: 0, seen: false, sz: this.nextSeed()
    }));
    this.talkSel = 0; this.ausflugSeen = {};
    this.cur = -1; this.task = null; this.mini = null; this.boss = null;
    this.gate = null; this.lockCounter = 0; this.endStatus = 1;
    this.talk = null; this.taskPhase = 'ask'; this.pick = -1;
    this.walk = null; this.gatePassed = false;
    this.gateIx = 0; this.gateGabe = -1; this.island = 0; this.gatesPassed = 0; this.gateScored = [];
    this.bossDef = null; this.bossIsland = -1; this.islandBossDone = [];
    this.activeMs = 0; this.sessions = 1; this.gateWrong = 0;
    this.em = null; this.buch = null; this.ekSeen = null; this.ekConfirm = false;
    this.ueb = null; this.geuebt = 0; this.beutel = []; this.posMap = {}; this.gabe = null;
    this.prot = code4Protokoll(this.chapter); this.bossLog = [];          // für den langen Ergebnis-Code (47_code4.js)
    this.ekInit();
  },

  /* ---- Üben an gelösten Orten (Kapitel mit ueben: true, ab dem Neubau von Kapitel 4) ----
     Ein gelöster Ort lässt sich von der Karte aus wieder besuchen: alle Teilaufgaben noch einmal mit
     neuen Zahlen, ohne Punkte, ohne Sperre, ohne Eintrag in die Zählung. Der Übungsstand (ueb) hat
     dieselben Felder wie ein Stationsstand; curSt() liefert, womit die Aufgabe gerade rechnet. */
  curSt() { return this.ueb || this.stations[this.cur]; },
  ohneSperre() { return !!this.ueb || this.ausflugGate(this.island) || (this.cur >= 0 && !!this.chapter.stations[this.cur].freiwillig); },
  mitKarte() { return this.hatAusflug() || !!(this.chapter.ueben && (this.gates()[this.island] || {}).weiter); },
  startUeben(i) {
    this.cur = i;
    this.ueb = { ueb: true, state: ST_OPEN, ti: 0, seed: this.nextSeed(), sz: this.nextSeed(), tries: 0, hints: 0, auto: 0 };
    Sound.sfx('move');
    const a = this.auftragSzenen(i);
    if (a.length) this.playTalk(a, 'stationIn'); else this.startTask();
  },
  /* „Der Auftrag": Szenen, die den Ort ausführlich beschreiben (Modell, Variablen, Einheiten, Formel),
     bevor die Teilaufgaben nur noch die Kurzzeile zeigen. stations[i].auftrag ist eine Liste von Szenen
     oder eine Funktion des Szenarios, die sie liefert. */
  auftragSzenen(i) {
    const a = this.chapter.stations[i].auftrag;
    if (!a) return [];
    return typeof a === 'function' ? a(this.szenario(i)) : a;
  },
  /* Einführung eines Ortes noch einmal ansehen: von der Karte aus oder mitten in der Aufgabe */
  introNochmal(i) {
    const vonKarte = i !== undefined;
    if (!vonKarte) { if (this.cur < 0 || this.taskPhase !== 'ask' || (this.view !== 'task' && this.view !== 'mini')) return; i = this.cur; }
    else if (!this.onIsland(i) || !this.stations[i] || (!this.stations[i].seen && this.stations[i].state !== ST_DONE)) return;
    Sound.sfx('move');
    this.playTalk(this.chapter.stations[i].intro.concat(this.auftragSzenen(i)), vonKarte ? 'map' : 'stationIn');
  },

  /* Bösewicht der aktuellen Insel (oder null: dann F'Abiturio aus dem Kapitel) */
  villain() { const g = this.gates()[this.island]; return (g && g.villain) || null; },

  /* ---------------- Tore und Inseln ---------------- */
  gates() { return this.chapter.gates || [this.chapter.gate]; },
  curGate() { return this.gates()[this.gateIx] || this.gates()[0]; },
  onIsland(i) { return (this.chapter.stations[i].island || 0) === this.island; },
  islandIdx() { return this.chapter.stations.map((_, i) => i).filter(i => this.onIsland(i)); },
  /* stations[i].freiwillig: zählt nicht für das Weiterkommen und schließt nie (Steigerbude in Kapitel 4) */
  islandDone() { return this.islandIdx().every(i => this.stations[i].state === ST_DONE || this.chapter.stations[i].freiwillig); },
  saveKey() { return 'fab.save.k' + (this.chapter && this.chapter.speicher || this.chapterId); },   // speicher: eigener Spielstand (Sprungdatei Regelstube)

  /* Sprungdatei (seit 2026-11-18, Regelstube für den Unterricht): direkt: id einer Station. Ohne Vorspann, Weg und Tor
     gleich hinein; danach geht es auf der Karte normal weiter. */
  direktStart() {
    const i = this.chapter.stations.findIndex(s => s.id === this.chapter.direkt), isl = this.chapter.stations[i].island || 0;
    this.gateIx = isl; this.gatePassed = true; this.gatesPassed = isl + 1; this.island = isl;
    this.gotoMap(true); this.sel = i; this.enterStation(i);
  },

  /* ---- Ausflugsinsel (ab Kapitel 4): ein Tor mit ausflug: true ist kein Pflichtweg. Die Insel dahinter
     erreicht man über einen Punkt auf der Karte der Hauptinsel und kommt von dort zurück. Auf ihr gibt es
     keine Sperren, und sie muss nicht fertig sein, damit das Kapitel weitergeht. ---- */
  ausflugGate(i) { const g = this.gates()[i]; return !!(g && g.ausflug); },
  hatAusflug() { return this.gates().some(g => g && g.ausflug); },
  /* Zusätzliche Punkte auf der Karte: Fähre hin, Fähre zurück, weiter zum nächsten Abschnitt */
  mapExtras() {
    const G = this.gates(), out = [];
    if (!this.mitKarte()) return out;
    const hier = G[this.island] || {};
    if (hier.ausflug) out.push(Object.assign({ id: 'heim', icon: '←', label: 'Zurück' }, hier.heim));
    else {
      G.forEach((g, k) => { if (g.ausflug) out.push(Object.assign({ id: 'ausflug', ziel: k, icon: '≈', label: 'Übersetzen' }, g.faehre)); });
      if (this.islandDone() && hier.weiter) out.push(Object.assign({ id: 'weiter', icon: '→', label: 'Hingehen' }, hier.weiter));
    }
    return out;
  },
  mapExtra(k) {
    const e = this.mapExtras()[k]; if (!e) return;
    if (e.id === 'ausflug') {
      const g = this.gates()[e.ziel], neu = !this.ausflugSeen[e.ziel];
      this.ausflugSeen[e.ziel] = true; this.island = e.ziel; Sound.sfx('move');
      if (neu && g.intro) this.playTalk(g.intro, 'map'); else this.gotoMap(false);
    } else if (e.id === 'heim') {
      // Beim ersten Verlassen, nachdem dort etwas gelöst wurde: ein Abschiedswort des Fährmanns (heim.talk)
      const g = this.gates()[this.island] || {}, k = 'h' + this.island, isl = this.island;
      const geloest = this.stations.some((st, i) => (this.chapter.stations[i].island || 0) === isl && st.state === ST_DONE);
      this.island = this.gateIx; Sound.sfx('move');
      if (g.heim && g.heim.talk && geloest && !this.ausflugSeen[k]) { this.ausflugSeen[k] = true; this.save(); this.playTalk(g.heim.talk, 'map'); }
      else this.gotoMap(false);
    }
    else if (e.id === 'weiter') this.nextStage();
  },
  /* Gemeinsames Szenario einer Station: Alle Teilaufgaben rechnen mit denselben Zahlen (stations[i].szenario) */
  szenario(i) { const sd = this.chapter.stations[i], st = (this.ueb && i === this.cur) ? this.ueb : this.stations[i]; return sd.szenario ? sd.szenario(RNG(st.sz)) : undefined; },

  /* Insel fertig: naechstes Tor oder Bosskampf */
  nextStage() {
    // Erst der Endgegner der Insel, falls es einen gibt
    const ib = this.gates()[this.island] && this.gates()[this.island].boss;
    if (ib && !this.islandBossDone[this.island]) {
      Sound.setLayer('full');
      this.playTalk(ib.intro, 'islandBoss');
      this.save();
      return;
    }
    // das nächste Tor, das kein Ausflug ist
    let nx = -1;
    for (let k = this.island + 1; k < this.gates().length; k++) if (!this.ausflugGate(k)) { nx = k; break; }
    if (this.stations.every(s => s.state === ST_DONE) || nx < 0) { this.toBoss(); return; }
    this.gateIx = nx;
    Sound.setLayer('full');
    this.playTalk(this.curGate().intro, 'gate');
    this.save();
  },

  nextSeed() { this.seed = (Math.imul(this.seed, 1664525) + 1013904223) >>> 0; return this.seed; },

  /* Antworttasten aus dem Beutel (tastenBeutel, ab Kapitel 4 Neubau): In je acht Fragen liegt die
     richtige Antwort auf jeder Taste zweimal. Frei gemischt häuft sich in einem Durchlauf von 40
     Fragen gern eine Taste - das fühlt sich wie ein Muster an, obwohl es Zufall ist. */
  ziehTaste() {
    if (!this.chapter.tastenBeutel) return -1;
    if (!this.beutel || !this.beutel.length) this.beutel = RNG(this.nextSeed()).shuffle([0, 0, 1, 1, 2, 2, 3, 3]);
    return this.beutel.pop();
  },
  zielTaste(seed) {                                  // dieselbe Aufgabe (dieselbe Saat) behält ihre Taste
    if (!this.chapter.tastenBeutel) return -1;
    if (!this.posMap) this.posMap = {};
    if (this.posMap[seed] === undefined) this.posMap[seed] = this.ziehTaste();
    return this.posMap[seed];
  },

  /* Aktive Spielzeit in Minuten. Bis 2026-11-14 stand hier die Zeit seit dem ersten
     Start - samt Pausen und Folgetagen. activeMs zählt nur, solange gespielt wird. */
  minutes() { return Math.min(511, Math.round((this.activeMs || 0) / 60000)); },

  flash(text, col) { this.msg = text; this.msgCol = col === undefined ? YELLOW : col; this.msgT = 2.0; },

  /* ---------------- Dialogstrecken ---------------- */
  playTalk(list, then) {
    if (!list || !list.length) { this.afterTalk(then); return; }
    this.talk = { list, i: 0, then, besucht: {} };
    if (list[0].marke) this.talk.besucht[list[0].marke] = true;
    this.wahlVorwahl();
    this.talkT0 = this.t;
    this.view = 'talk';
    this.typed = 0; this.typing = true; this.page = 0;
    const s = list[0];
    Sound.setLayer('full');
    if (s.music) Sound.play(s.music);
  },

  /* Szene mit wahl: [{ t, skip }]: Die gewählte Taste überspringt skip Szenen (0 = einfach weiter).
     Seit 2026-11-17 auch { t, zu: 'marke' }: weiter bei der Szene mit marke: 'marke'; eine Marke, die es
     nicht gibt (etwa 'ende'), beendet den Dialog. Szenen mit sprungZu springen danach ebenso, Szenen mit
     wennNicht: 'marke' entfallen, wenn die Szene mit dieser Marke schon gezeigt wurde. */
  talkZu(marke) { const T = this.talk, k = T.list.findIndex(x => x.marke === marke); T.i = (k < 0 ? T.list.length : k) - 1; },
  talkChoose(i) {
    const T = this.talk, sz = T && T.list[T.i], w = sz && sz.wahl && sz.wahl[i];
    if (!w) return;
    Sound.sfx('move'); if (w.zu) this.talkZu(w.zu); else T.i += w.skip || 0; this.talkSel = 0; this.talkAdvance(true);
  },

  /* Vorgewählt ist die erste Taste, die nicht zu einer schon gezeigten Marke führt (2026-11-18, Landeplatz: nach
     der p-q-Formel steht die Auswahl auf Ausklammern, nach allen drei auf "Genug"). Ältere Dialoge: unverändert Taste 1. */
  wahlVorwahl() {
    const T = this.talk, s = T && T.list[T.i];
    if (!s || !s.wahl) { this.talkSel = 0; return; }
    const k = s.wahl.findIndex(w => !w.zu || !T.besucht[w.zu]);
    this.talkSel = k < 0 ? s.wahl.length - 1 : k;
  },

  talkAdvance(gewaehlt) {
    const T = this.talk;
    // Szene mit gabe (seit 2026-11-19): erst der Übergabe-Bildschirm, dann geht das Gespräch weiter
    const jetzt = T.list[T.i];
    if (!gewaehlt && jetzt && jetzt.gabe && !T.gabeZu) {
      T.gabeZu = true;
      this.gabe = { t0: this.t, st: -1, rw: jetzt.gabe, bg: jetzt.gabe.bg || jetzt.bg, sp: jetzt.gabe.speaker || jetzt.speaker, weiterTalk: true };
      this.view = 'gabe'; Sound.sfx('gabeFlug'); this.gabeKlang(jetzt.gabe); return;
    }
    T.gabeZu = false;
    // Szene mit sprung: n - danach n Szenen auslassen (Ende eines Zweigs nach einer Auswahl)
    const alt = !gewaehlt && T.list[T.i];
    if (alt && alt.sprungZu) this.talkZu(alt.sprungZu);
    T.i++;
    if (alt && alt.sprung) T.i += alt.sprung;
    T.besucht = T.besucht || {};
    while (T.i < T.list.length && T.list[T.i].wennNicht && T.besucht[T.list[T.i].wennNicht]) T.i++;
    if (T.i >= T.list.length) { const then = T.then; this.talk = null; this.afterTalk(then); return; }
    if (T.list[T.i].marke) T.besucht[T.list[T.i].marke] = true;
    this.wahlVorwahl();
    this.typed = 0; this.typing = true; this.page = 0;
    this.talkT0 = this.t;
    const s = T.list[T.i];
    if (s.music) Sound.play(s.music);
  },

  afterTalk(then) {
    switch (then) {
      case 'walk':      this.startWalk(); break;
      case 'gate':      this.startGate(); break;
      case 'gatePass':  { const g = this.curGate();      // Tor mit gabe (Kapitel 3, seit 2026-11-18): erst die Übergabe des Helms, dann weiter
                          if (g.gabe && this.gateGabe !== this.gateIx) { this.gateGabe = this.gateIx;
                            this.gabe = { t0: this.t, st: -1, rw: g.gabe, bg: g.bg, sp: g.gabe.speaker, danach: g.gabe.danach || [], then: 'gatePass' };
                            this.view = 'gabe'; Sound.sfx('gabeFlug'); this.gabeKlang(g.gabe); break; } }
                        this.gatePassed = true; this.gatesPassed = this.gateIx + 1;
                        this.island = this.gateIx; this.gotoMap(true); break;
      case 'none':      break;
      case 'gateFail':  if (this.curGate().retry) this.startGate(); else this.finish(3); break;
      case 'map':       this.gotoMap(false); break;
      case 'stationIn': this.startTask(); break;
      case 'stationOut':this.finishStation(); break;
      case 'gabe':      this.gabe = { t0: this.t, st: this.cur }; this.view = 'gabe'; Sound.sfx('gabeFlug'); break;   // Ankunft: renderGabe
      case 'locked':    this.afterLock(); break;
      case 'boss':      this.beginBoss(); break;
      case 'islandBoss': this.beginBoss(this.island); break;
      case 'islandBossDone': this.nextStage(); break;
      case 'outro':     this.finish(1); break;
      case 'partial':   this.finish(2); break;
      default:          this.gotoMap(false);
    }
    this.save();
  },

  /* ---------------- Der Weg nach Sinusia ----------------
     Ein kurzes Stueck zu Fuss: Taste halten oder antippen, die Landschaft
     zieht vorbei, unterwegs redet Mathematthias, am Ende steht das Stadttor. */
  startWalk() {
    if (this.chapter.walk === null) { this.playTalk(this.curGate().intro, 'gate'); return; }   // Kapitel ohne Wegstück
    const W = this.chapter.walk || { length: 200 };
    this.walk = { x: 0, goal: W.length || 200, burst: 0, go: false, step: 0, arrived: false,
                  said: 0, talking: null };
    this.view = 'walk';
    Sound.setLayer('full'); Sound.play(W.music || 'field');
    this.save();
  },

  walkUpdate(dt) {
    const w = this.walk;
    if (!w || w.arrived) return;
    // Erreicht die Figur eine Stelle, an der jemand etwas sagt, bleibt sie
    // stehen, bis weitergeklickt wird - sonst rauscht der Text vorbei.
    const lines = (this.chapter.walk && this.chapter.walk.lines) || [];
    if (w.talking) return;
    if (w.said < lines.length && w.x >= lines[w.said].at) {
      w.talking = lines[w.said]; w.go = false; w.burst = 0; w.typed = 0;
      return;
    }
    // walk.auto: die Figur läuft von selbst weiter, sobald ein Satz bestätigt ist
    const auto = !!(this.chapter.walk && this.chapter.walk.auto);
    if (auto) w.go = true;
    const moving = w.go || w.burst > 0;
    w.burst = Math.max(0, w.burst - dt);
    if (moving) { w.x += 42 * dt; w.step += dt; }
    if (w.x >= w.goal) {
      w.x = w.goal; w.arrived = true;
      Sound.sfx('gate');
      this.gateIx = 0;
      this.playTalk(this.curGate().intro, 'gate');
    }
  },

  walkContinue() {
    const w = this.walk;
    if (!w || !w.talking) return false;
    if (w.typed < w.talking.text.length) { w.typed = 1e9; return true; }   // erst fertig tippen
    w.talking = null; w.said++;
    return true;
  },

  /* ---------------- Torwaechter ---------------- */
  startGate() {
    const g = this.curGate();
    const R = RNG(this.nextSeed());
    const qs = R.some(g.questions, Math.min(g.ask || 5, g.questions.length))
                .map(q => { const o = Object.assign({}, q, q.gen ? q.gen(R) : {}); o.options = R.shuffle(o.options); return aufTaste(o, this.ziehTaste()); });   // gen(R): Torfrage mit neuen Zahlen (seit 2026-11-19)
    this.gate = { i: 0, right: 0, phase: 'ask', pick: -1, qs };
    this.view = 'gate';
    this.sel = 0;
    Sound.play(g.music || 'gate'); Sound.setLayer('soft');
    this.save();
  },

  gateAnswer(i) {
    const G = this.gate;
    if (G.phase !== 'ask') return;
    G.pick = i; G.phase = 'fb';
    const ok = !!G.qs[G.i].options[i].ok;
    G.ok = ok;
    if (ok) {
      G.right++; this.right++; Sound.sfx('right');
      // Punkte gibt es hoechstens fuer need richtige je Tor - auch ueber
      // mehrere Fragerunden hinweg, sonst wuerde Durchfallen belohnt.
      const g = this.curGate(), pts = g.pts === undefined ? 10 : g.pts, cap = this.gateNeed() * pts;
      const had = this.gateScored[this.gateIx] || 0;
      if (had < cap) { this.score += pts; this.gateScored[this.gateIx] = had + pts; }
      this.fbLine = pickLine(g.praise, 'Der Wächter nickt.');
    }
    else { this.wrong++; this.gateWrong = (this.gateWrong || 0) + 1; Sound.sfx('wrong'); }
  },

  gateNeed() { return this.curGate().need || Math.floor(this.gate.qs.length / 2) + 1; },

  gateNext() {
    const G = this.gate, need = this.gateNeed();
    G.i++; G.phase = 'ask'; G.pick = -1; this.sel = 0;
    const left = G.qs.length - G.i;
    const wrongs = G.i - G.right;
    const maxWrong = this.curGate().maxWrong || (G.qs.length - need + 1);
    const passed = G.right >= need;
    const hopeless = wrongs >= maxWrong || G.right + left < need;
    if (passed || hopeless || G.i >= G.qs.length) {
      Sound.setLayer('full');
      if (passed) this.playTalk(this.curGate().pass, 'gatePass');
      else this.playTalk(this.curGate().fail, 'gateFail');
    }
    this.save();
  },

  /* ---------------- Karte ---------------- */
  gotoMap(first) {
    this.view = 'map';
    this.cur = -1; this.task = null; this.mini = null; this.ueb = null;
    const idx = this.islandIdx();
    this.sel = idx.find(i => this.stations[i].state === ST_OPEN && !this.chapter.stations[i].freiwillig);
    if (this.sel === undefined) {
      const ext = this.mapExtras(), k = ext.findIndex(e => e.id === 'weiter' || e.id === 'heim');
      this.sel = k >= 0 ? this.stations.length + k : idx[0];
    }
    Sound.setLayer('full');
    Sound.play((this.gates()[this.island] || {}).mapMusic || 'field');
    if (this.islandDone() && !this.mitKarte()) { this.nextStage(); return; }
    this.save();
  },

  openStations() { return this.islandIdx().filter(i => this.stations[i].state === ST_OPEN).length; },

  enterStation(i) {
    if (i >= this.stations.length) { this.mapExtra(i - this.stations.length); return; }    // Fähre, zurück, weiter
    const st = this.stations[i];
    if (st && st.state === ST_DONE && this.chapter.ueben && this.onIsland(i)) { this.startUeben(i); return; }
    if (!st || st.state !== ST_OPEN || !this.onIsland(i)) { Sound.sfx('wrong'); return; }
    this.cur = i;
    this.view = 'task';
    const sd = this.chapter.stations[i], auftrag = this.auftragSzenen(i);
    if (!st.seen) { st.seen = true; this.playTalk(sd.intro.concat(auftrag), 'stationIn'); }
    else if (auftrag.length) this.playTalk(auftrag, 'stationIn');
    else this.startTask();
  },

  /* ---------------- Aufgaben ---------------- */
  startTask() {
    const st = this.curSt(), sd = this.chapter.stations[this.cur];
    const def = sd.tasks[st.ti];
    this.task = aufTaste(buildTask(def, st.seed, this.szenario(this.cur)), this.zielTaste(st.seed));
    this.taskPhase = 'ask'; this.pick = -1; this.sel = 0;
    if (this.task.kind === 'mini') {
      this.view = 'mini';
      this.mini = { sel: 0, checked: false, ok: false, lauf: false, zu: false };
      for (const k of miniKeys(this.task)) this.mini[k] = this.task['start' + k];
      // Minispiel mit Wahl (K5 Solarfeld, 2026-11-20): leicht oder schwer; die Wahl gilt für diese Teilaufgabe, auch nach neuen Zahlen
      if (this.task.wahl) { if (st.stufe === undefined) this.mini.waehle = true; else this.miniStufe(st.stufe, true); }
      Sound.setLayer('soft'); Sound.play(sd.music || 'field');
    } else {
      this.view = 'task';
      Sound.setLayer('soft'); Sound.play(sd.music || 'field');
    }
    this.save();
  },

  taskPoints() {
    const st = this.curSt();
    if (this.ueb) return 0;                                   // Üben gibt keine Punkte
    const base = [50, 30, 15][Math.min(2, st.tries)] || 0;
    const manual = Math.max(0, st.hints - (st.auto || 0));
    // Ein selbst geholter Tipp kostet ein Fünftel der Aufgabe: 10 Punkte bei 50, 6 bei 30
    const p = Math.max(0, Math.round(base * (this.task.pts / 50)) - manual * Math.round(10 * this.task.pts / 50));
    return p;
  },

  miniStufe(i, still) {
    const T = this.task, st = this.curSt();
    if (!T || !T.wahl) return;
    if (i > 0 && T.wahl[i]) Object.assign(T, T.wahl[i]);
    T.stufe = i; st.stufe = i; this.mini.waehle = false;
    for (const k of miniKeys(T)) this.mini[k] = T['start' + k];
    if (!still) { Sound.sfx('move'); this.save(); }
  },

  useHint() {
    const st = this.curSt();
    if (!st || this.taskPhase !== 'ask' || !this.task || !this.task.hints) return;
    if (st.hints < this.task.hints.length) { st.hints++; if (!this.ueb) { this.hintsUsed++; this.protokoll(1); } Sound.sfx('hint'); }
  },

  answer(i) {
    if (this.taskPhase !== 'ask') return;
    this.pick = i;
    if (this.task.options[i].ok) this.gotRight();
    else { this.wrongWhy = this.task.options[i].why || ''; this.gotWrong(); }
  },

  /* Richtig: kurzes Lob, keine Erklaerung. */
  gotRight() {
    const p = this.taskPoints();
    this.score += p; if (!this.ueb) this.right++;
    this.taskOk = true; this.taskPhase = 'fb';
    const sd = this.cur >= 0 ? this.chapter.stations[this.cur] : null;
    this.fbSpeaker = (sd && sd.head) || 'math';
    this.fbLine = pickLine((sd && sd.praise) || this.chapter.praise, 'Gut gemacht!');
    Sound.sfx('right'); this.flash(this.ueb ? 'geübt' : '+' + p, LTGREEN);
  },

  /* Falsch: zuerst gibt Mathematthias den Tipp der naechsten Stufe (kostet
     keine Punkte, anders als ein selbst geholter). Danach erschrickt er, und
     F'Abiturio dreht an den Zahlen. Beim dritten Mal schliesst die Station. */
  gotWrong() {
    const st = this.curSt();
    st.tries++; if (!this.ueb) this.wrong++; this.taskOk = false;
    if (!this.ueb) { const o = this.task.kind !== 'mini' && this.task.options && this.task.options[this.pick]; this.protokoll(0, o ? (o.nr || 0) : 0); }
    Sound.sfx('wrong');
    if (st.tries >= 3) {
      if (this.ohneSperre()) st.tries = 2;                   // auf der Ausflugsinsel und beim Üben schließt keine Station
      else { this.lockStation(); return; }
    }
    // Minispiele decken weiter einen Tipp auf. Bei Auswahlaufgaben nicht mehr (Studierende, 2026-11-20: der Tipp zeigte oft
    // auf den Schritt, der schon richtig war); dort steht der Fehlerbildschirm mit Lösung und Rechenweg.
    if (this.task.kind === 'mini' && this.task.hints && st.hints < st.tries && st.hints < this.task.hints.length) {
      st.hints++; st.auto = (st.auto || 0) + 1;
    }
    this.tipMehr = false;
    if (this.task.kind !== 'mini') this.task.mehr = (this.task.hints || []).concat(this.task.explain && this.task.explain.length > 3 ? ['Kurz gesagt: ' + this.task.explain] : []);
    const V = this.villain() || {};
    this.oopsLine = pickLine(V.oops || this.chapter.oops, "Oh nein! F'Abiturio dreht an den Zahlen!");
    this.gloatLine = pickLine(V.gloat || this.chapter.gloat, 'Hihi! Neuer Schabernack!');
    // Erst greift das Tippsystem, danach folgt der Dialog mit dem Zahlendreher.
    this.taskPhase = 'tip';          // Erklaerung und Tipp, danach der Zahlendreher
    Sound.sfx('hint');
  },

  tipDone() {
    this.taskPhase = 'morph';
    Sound.sfx('magic');
  },

  afterFeedback() {
    if (this.taskOk) this.solveTask();
  },

  morphDone() {
    const st = this.curSt(), sd = this.chapter.stations[this.cur];
    // Neue Zahlen - oder bei Begriffsaufgaben eine andere Fassung. Die
    // gleiche Aufgabe noch einmal waere kein Zahlendreher, nur Mischen.
    const sig = t => (t.q || '') + '|' + (t.formula || '');
    const prev = this.task ? sig(this.task) : '';
    for (let k = 0; k < 12; k++) {
      st.seed = this.nextSeed();
      if (sd.szenario) st.sz = this.nextSeed();              // neue Zahlen für das ganze Szenario
      if (sig(buildTask(sd.tasks[st.ti], st.seed, this.szenario(this.cur))) !== prev) break;
    }
    this.startTask();
  },

  solveTask() {
    const st = this.curSt(), sd = this.chapter.stations[this.cur];
    if (this.ueb) {                                          // Üben: nächste Teilaufgabe, am Ende zurück zur Karte
      st.ti++; st.tries = 0; st.hints = 0; st.auto = 0; st.seed = this.nextSeed();
      if (st.ti >= sd.tasks.length) { this.geuebt = (this.geuebt || 0) + 1; Sound.sfx('save'); Sound.setLayer('full'); this.flash('Geübt!', LTGREEN); this.gotoMap(false); }
      else this.startTask();
      return;
    }
    st.ti++; st.tries = 0; st.hints = 0; st.auto = 0; st.seed = this.nextSeed();
    this.unlockOne();
    if (st.ti >= sd.tasks.length) {
      st.state = ST_DONE;
      // uebergabe: Die Stationsleitung übergibt die Belohnung nach dem Schlusswort als Animation
      const gabe = !!(this.chapter.uebergabe && sd.reward);
      if (sd.reward && !gabe) { this.flash(sd.reward.icon + ' ' + sd.reward.name, YELLOW); Sound.sfx('gabe'); }
      Sound.setLayer('full');
      this.playTalk(sd.outro, gabe ? 'gabe' : 'stationOut');
    } else {
      this.startTask();
    }
    this.save();
  },

  /* Musik zur Übergabe: eigene (rw.music) oder die des Kapitels (gabeMusik, in K3 die Glück-auf-Fanfare) */
  gabeKlang(rw) { const m = (rw && rw.music) || this.chapter.gabeMusik; if (m) Sound.play(m); },

  gabeDone() {
    if (!this.gabe || this.t - this.gabe.t0 < (this.gabe.then || this.gabe.weiterTalk || this.chapter.gabeMusik ? 3.2 : 1.6)) return;      // erst ansehen, dann weiter; mit Fanfare wartet es, bis „Glück auf, Glück auf" gerufen ist
    const G = this.gabe;
    if (G.weiterTalk) { this.gabe = null; Sound.sfx('move'); this.view = 'talk'; this.talkAdvance(); return; }
    if (G.then) { this.gabe = null; Sound.sfx('move'); if (G.danach.length) this.playTalk(G.danach, G.then); else this.afterTalk(G.then); return; }
    const seite = this.gabe.seite; this.gabe = null; Sound.sfx('move');
    if (seite) { this.ekOpenBook(this.cur, true); return; }   // Kapitel 3: nach der Seite geht das Steigerbuch auf
    this.finishStation();
  },

  finishStation() {
    if (this.islandDone() && !this.mitKarte()) { this.nextStage(); return; }
    this.gotoMap(false);
  },

  /* Eine gesperrte Station wieder oeffnen - die am laengsten gesperrte zuerst. */
  unlockOne() {
    let best = -1;
    for (let i = 0; i < this.stations.length; i++) {
      const s = this.stations[i];
      if (!this.onIsland(i) && !this.hatAusflug()) continue;      // mit Ausflugsinsel öffnet eine Lösung hier auch einen Ort drüben
      if (s.state === ST_LOCKED && (best < 0 || s.lockAt < this.stations[best].lockAt)) best = i;
    }
    if (best >= 0) {
      this.stations[best].state = ST_OPEN;
      this.stations[best].tries = 0;
      this.stations[best].seed = this.nextSeed();
      this.unlocked = best;
      Sound.sfx('unlock');
    } else this.unlocked = -1;
  },

  lockStation() {
    const st = this.stations[this.cur], sd = this.chapter.stations[this.cur];
    st.state = ST_LOCKED; st.lockAt = ++this.lockCounter;
    if (this.prot && this.prot[this.cur]) this.prot[this.cur].n++;
    st.tries = 0; st.hints = 0; st.auto = 0; st.seed = this.nextSeed();
    Sound.sfx('lock'); Sound.setLayer('full');
    const others = this.stations.some((s, i) => i !== this.cur && (this.onIsland(i) || this.hatAusflug()) && s.state === ST_OPEN);
    this.playTalk(sd.locked, others ? 'locked' : 'partial');
  },
