/* ============================================================
   TERM-ANIMATION (ab Kapitel 3)
   Rechenschritte, bei denen man zusieht, wie sich ein Term verwandelt: Teile
   färben sich, wandern in die nächste Zeile, heben sich auf und verblassen,
   teilen sich (h² wird h·h), schweben vor eine Klammer, werden gekürzt.

   So ist es gebaut:
   - Ein BILD ist ein fertig gesetzter Zustand: jedes Zeichen hat einen Namen
     (id), einen Platz und eine Rolle (Farbe). taBild() setzt Zeilen aus
     Bausteinen: taZ (Zeichen), taH (Hochzahl), taB (Bruch), taLim, taLuft.
   - Eine RECHNUNG ist eine Folge von Phasen { bild, dauer, halt, text, aus,
     nach, bogen }. Von Phase zu Phase gilt: gleicher Name = das Zeichen
     gleitet an den neuen Platz. Neuer Name = es blendet ein; steht es in
     aus: { neu: alt }, löst es sich vom alten Zeichen (Kopie, Teilung).
     Verschwundener Name = es verblasst (in den ersten zwei Dritteln der
     Phase, Neues erscheint erst danach); steht es in nach: { alt: ziel },
     wandert es ins Ziel und geht darin auf. bogen: [namen] lässt Zeichen im
     Bogen schweben statt geradeaus.
   - taStand(phasen, t) liefert, was zur Zeit t zu sehen ist; taZeig() malt es.
   Verblassen läuft über Farbrampen (16er-Palette, keine Transparenz).

   Für eine neue Rechnung: Zeilen als Funktionen schreiben (siehe abE1 … abE6),
   Phasen aufreihen, in FIGS einhängen. Die Engine weiß nichts von Ableitungen.
   ============================================================ */

const TA_RAMPE = {
  ink:  [WHITE, LTGREY, GREY, DGREY],
  dim:  [GREY, DGREY],
  aus:  [DGREY],                 // stärker zurückgenommen als dim (Beispiel n = 3: nicht gewählte Buchstaben)
  gut:  [LTGREEN, GREEN, DGREY],
  weg:  [LTRED, RED, DGREY],
  ziel: [YELLOW, ORANGE, DGREY]
};
function taFarbe(r, al) {
  const R = TA_RAMPE[r] || TA_RAMPE.ink;
  const i = Math.floor((1 - Math.max(0, Math.min(1, al))) * (R.length + 1) - 1e-9);
  return i >= R.length ? -1 : R[Math.max(0, i)];
}

/* ---- Bausteine ---- */
const taZ = (id, s, r) => ({ k: 'z', id, s, r });                 // Zeichen in Normalschrift
const taH = (id, s, r) => ({ k: 'h', id, s, r });                 // Hochzahl
const taB = (id, num, den, r) => ({ k: 'b', id, num, den, r });   // Bruch; id gehört dem Bruchstrich
const taLim = (id, unter, r) => ({ k: 'lim', id, unter, r });     // lim mit Bedingung darunter
const taLuft = w => ({ k: 'luft', w });

function taMass(it) {
  if (Array.isArray(it)) {
    let w = 0, asc = 7, desc = 1;
    for (const e of it) { const m = taMass(e); w += m.w; asc = Math.max(asc, m.asc); desc = Math.max(desc, m.desc); }
    return { w, asc, desc };
  }
  switch (it.k) {
    // In feiner Auflösung (schrift: 2) sind die Zeichen schmaler; die Maße bleiben in alten Bildpunkten
    case 'z': return { w: Screen.fein ? tw(it.s) : [...it.s].length * 8, asc: 7, desc: 1 };
    case 'h': return { w: Screen.fein ? Math.ceil([...it.s].length * 3.5) + 1 : [...it.s].length * 5 + 1, asc: RAISE + 5, desc: 0 };
    case 'luft': return { w: it.w, asc: 0, desc: 0 };
    case 'lim': return { w: Screen.fein ? f2Lo('lim{' + it.unter + '}').w : bLim(it.unter).w, asc: 7, desc: 7 };
    case 'b': {
      const n = taMass(it.num), d = taMass(it.den);
      return { w: Math.max(n.w, d.w) + 4, asc: AXIS + 2 + n.desc + n.asc, desc: Math.max(0, 2 + d.asc + d.desc - AXIS), n, d };
    }
  }
  return { w: 0, asc: 0, desc: 0 };
}
function taSetz(it, x, base, r, out) {
  if (Array.isArray(it)) { for (const e of it) { taSetz(e, x, base, r, out); x += taMass(e).w; } return; }
  const m = taMass(it), rr = it.r || r;
  if (it.k === 'z') out[it.id] = { k: 'z', s: it.s, x, y: base, w: m.w, r: rr };
  else if (it.k === 'h') out[it.id] = { k: 'h', s: it.s, x, y: base - RAISE, w: m.w, r: rr };
  else if (it.k === 'lim') out[it.id] = { k: 'lim', s: it.unter, x, y: base, w: m.w, r: rr };
  else if (it.k === 'b') {
    out[it.id] = { k: 'bar', x: x + 1, y: base - AXIS, w: m.w - 2, r: rr };
    taSetz(it.num, Math.round(x + (m.w - m.n.w) / 2), base - AXIS - 1 - m.n.desc, rr, out);
    taSetz(it.den, Math.round(x + (m.w - m.d.w) / 2), base - AXIS + 2 + m.d.asc, rr, out);
  }
}
/* zeilen: [{ x, y, r, teile }] - x und y relativ zum Bildfeld, y ist die Grundlinie */
function taBild(zeilen) {
  const out = {};
  for (const z of zeilen) taSetz(z.teile, z.x, z.y, z.r || 'ink', out);
  return out;
}
/* Abwandlungen eines Bildes: gleiche Plätze, andere Rollen / gestrichen / ohne einzelne Zeichen */
function taRolle(bild, namen, r) {
  const out = {};
  for (const id in bild) out[id] = namen.includes(id) ? Object.assign({}, bild[id], { r }) : bild[id];
  return out;
}
function taStrich(bild, namen, breite) {
  const out = {};
  for (const id in bild) out[id] = namen.includes(id) ? Object.assign({}, bild[id], { strich: 1, sw: breite || bild[id].w }) : bild[id];
  return out;
}
function taOhne(bild, namen) {
  const out = {};
  for (const id in bild) if (!namen.includes(id)) out[id] = bild[id];
  return out;
}
/* Kopie einer Zeile: alle Namen mit Endung nach bekommen als Quelle denselben Namen mit Endung von */
function taKopie(bild, von, nach) {
  const aus = {};
  for (const id in bild) if (id.endsWith(nach)) aus[id] = id.slice(0, -nach.length) + von;
  return aus;
}

/* ---- Übergang zwischen zwei Bildern; u von 0 bis 1 ---- */
function taMisch(A, B, u, ph) {
  const e = u * u * (3 - 2 * u), out = [], L = (a, b) => a + (b - a) * e;
  const bogen = id => (ph.bogen && ph.bogen.includes(id)) ? -Math.sin(Math.PI * e) * (ph.bogenH || 11) : 0;
  for (const id in A) {
    if (B[id]) continue;
    const a = A[id], z = ph.nach && B[ph.nach[id]];
    if (z) out.push({ p: Object.assign({}, a, { x: L(a.x, z.x), y: L(a.y, z.y) + bogen(id) }), al: e < 0.9 ? 1 : 0 });
    else out.push({ p: a, al: 1 - e / 0.65 });                 // Altes ist verblasst, bevor Neues an seiner Stelle erscheint
  }
  for (const id in B) {
    const b = B[id], a = A[id];
    if (a) {
      out.push({ p: Object.assign({}, b, { x: L(a.x, b.x), y: L(a.y, b.y) + bogen(id), w: L(a.w, b.w), r: e < 0.5 ? a.r : b.r,
                                           strich: b.strich ? (a.strich ? 1 : e) : 0 }), al: 1 });
    } else {
      const q = ph.aus && A[ph.aus[id]];
      if (q) out.push({ p: Object.assign({}, b, { x: L(q.x, b.x), y: L(q.y, b.y) + bogen(id) }), al: 1 });
      else out.push({ p: b, al: (e - 0.45) / 0.55 });
    }
  }
  return out;
}
function taDauer(phasen) { return phasen.reduce((s, p, i) => s + (i ? (p.dauer || 0) : 0) + (p.halt || 0), 0); }
function taStand(phasen, t) {
  let t0 = 0; t = Math.max(0, t);
  for (let i = 0; i < phasen.length; i++) {
    const p = phasen[i], d = i ? (p.dauer || 0) : 0;
    if (t < t0 + d) return { teile: taMisch(phasen[i - 1].bild, p.bild, (t - t0) / d, p), text: p.text };
    t0 += d;
    if (t < t0 + (p.halt || 0) || i === phasen.length - 1) return { teile: Object.keys(p.bild).map(id => ({ p: p.bild[id], al: 1 })), text: p.text, fertig: i === phasen.length - 1 };
    t0 += p.halt || 0;
  }
  return { teile: [], text: '' };
}
function taMal(p, ox, oy, al) {
  const col = taFarbe(p.r, al); if (col < 0) return;
  const x = ox + Math.round(p.x), y = oy + Math.round(p.y);
  if (p.k === 'z') Screen.textPx(p.s, x, y - 7, col);
  else if (p.k === 'h' && Screen.fein) { let xx = x * 2; for (const ch of p.s) { F2.mini(ch, xx, y * 2 - 5, col); xx += 7; } }
  else if (p.k === 'h') { let xx = x; for (const ch of p.s) { Screen.glyph5(ch, xx, y - 5, col); xx += 5; } }
  else if (p.k === 'bar') Screen.rect(x, y, Math.max(1, Math.round(p.w)), 1, col);
  else if (p.k === 'lim') fxDraw(Screen.fein ? f2Lo('lim{' + p.s + '}') : bLim(p.s), x, y, col);
  if (p.strich > 0 && al > 0.3) {                           // durchgestrichen: der Strich wächst von links unten
    const w = (p.sw || p.w) + 1, top = p.k === 'h' ? 6 : 9;
    linie(x - 1, y + 1, x - 1 + w * p.strich, y + 1 - (top + 2) * p.strich, TA_RAMPE.weg[0]);
  }
}
/* Malt den Stand zur Zeit t; Verblassendes zuerst, damit es nichts Festes überdeckt */
function taZeig(phasen, t, ox, oy, textY) {
  const S = taStand(phasen, t);
  for (const q of S.teile) if (q.al < 1) taMal(q.p, ox, oy, q.al);
  for (const q of S.teile) if (q.al >= 1) taMal(q.p, ox, oy, 1);
  if (S.text) Screen.textPx(S.text, ox + Math.max(0, Math.round((224 - tw(S.text)) / 2)), oy + textY, CYAN);
  return S;
}

/* ============================================================
   Die Rechnung von Kapitel 3: f(x) = x², Ableitung mit der h-Methode.
   Jede Dialogszene (figStep 1 bis 6) zeigt oben die Zeile von vorher und
   lässt darunter die nächste entstehen. figStep 7 schreibt zum Schluss die

const AB_O = 22, AB_U = 60, AB_TXT = 88;                  // Grundlinien der beiden Zeilen, Zeile der Beschriftung
/* Zeile: links f'(x) (nur oben), dann =, dann der Ausdruck */
function abZeile(s, y, r, ausdruck, mitF) {

  if (mitF) z.unshift({ x: 2, y, r, teile: [taZ('F' + s, "f'(x)")] });
  return z;
}
function abOp(id, ch, r) { return [taLuft(3), taZ(id, ch, r), taLuft(3)]; }
/* Die Zeilen der Rechnung; s ist die Endung der Namen (o = obere Zeile, u = untere), o färbt einzelne Namen */
function abE1(s, o) { o = o || {};

  /* 5: jetzt geht h gegen 0 */
  { const a = B(oben(abE5('o'))), b = B(oben(abE5('o'), 'dim'), unten(abE5('u')));

/* ============================================================
   STATIONSLEITER - Portraits im selben 32x40-Format wie
   Mathematthias und F'Abiturio, aber aus Grundformen gebaut statt
   gepixelt. Farben als Hex-Index in die Palette.
   ============================================================ */
function buildFace(draw) {
  const g = Array.from({ length: 40 }, () => Array(32).fill('.'));
  const R = (x, y, w, h, c) => {
    for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++)
      if (i >= 0 && i < 32 && j >= 0 && j < 40) g[j][i] = c;
  };
  const E = (cx, cy, rx, ry, c) => {
    for (let j = 0; j < 40; j++) for (let i = 0; i < 32; i++) {
      const dx = (i + 0.5 - cx) / rx, dy = (j + 0.5 - cy) / ry;
      if (dx * dx + dy * dy <= 1) g[j][i] = c;
    }
  };
  draw(R, E);
  return g.map(r => r.join(''));
}

/* Silhouette von Derivia am Horizont: Hügel, Wasserturm, Achterbahn, F'Abiturios Turm */
function deriviaFern(HOR, xa, c1, c2) {
  for (let x = xa; x < SW; x++) { const h = 9 + 6 * Math.sin((x - xa) / 26) + 3 * Math.sin(x / 6); Screen.rect(x, HOR - Math.round(h), 1, Math.round(h), x % 2 || h < 9 ? c1 : c2); }
  const wx = xa + 44;                                                         // Wasserturm
  Screen.rect(wx, HOR - 30, 2, 18, c1); Screen.rect(wx + 10, HOR - 30, 2, 18, c1); Screen.rect(wx - 3, HOR - 38, 18, 9, c1); Screen.rect(wx, HOR - 41, 12, 3, c1);
  for (let x = xa + 70; x < xa + 112; x++) {                                  // Achterbahn
    const y = HOR - 13 - Math.round(15 * Math.pow(Math.sin((x - xa - 70) / 42 * Math.PI), 2) * (x < xa + 91 ? 1 : 0.6));
    Screen.px(x, y, c1); Screen.px(x, y + 1, c1); if (x % 5 === 0) Screen.rect(x, y, 1, HOR - 10 - y, c1);
  }
  const tx = Math.min(SW - 22, xa + 132);                                     // der schiefe Turm des Zauberers
  for (let k = 0; k < 34; k++) Screen.rect(tx + Math.round(k * 0.12), HOR - 12 - k, 8, 1, 18);
  for (let k = 0; k < 8; k++) Screen.rect(tx + 4 - 6 + k * 0 + Math.round(k * 0.75) - 1 + 2, HOR - 54 + k, 14 - Math.round(k * 0) - (7 - k) * 2 + 0, 1, 18);
  Screen.px(tx + 6, HOR - 34, 22); Screen.px(tx + 7, HOR - 34, 23);
}

/* Die drei Ableitungsregeln: oben die Funktion, unten die Ableitung. Der Exponent wandert
   in einem Bogen nach vorn; danach steht die Zeile fertig da. step 1 Potenz, 2 Faktor, 3 Summe. */
FIGS.regeln = function (th, t, ox, oy, still, step) {
  const S = [null,
    { titel: 'Potenzregel', oben: 'f(x) = x^{3}', unten: "f'(x) = 3x^{2}", von: [133, 30], nach: [132, 66], was: '3', merke: 'Exponent nach vorn, im Exponenten 1 weniger' },
    { titel: 'Faktorregel', oben: 'f(x) = 5x^{3}', unten: "f'(x) = 15x^{2}", von: [141, 30], nach: [136, 66], was: '·3', merke: 'Faktor mal Exponent: 5 mal 3 = 15' },
    { titel: 'Summenregel', oben: 'f(x) = x^{3} + 4x + 7', unten: "f'(x) = 3x^{2} + 4", von: [197, 34], nach: [197, 80], was: '7', merke: 'Einzeln ableiten. Die 7 fällt weg.' }][step || 1];
  Screen.textPx(S.titel, ox + 4, oy + 3, th.b);
  drawFormulaAt(S.oben, ox + 44, oy + 26, th.ink);
  const a = still ? 1 : Math.min(1, Math.max(0, (t - 0.8) / 1.6));
  if (a >= 1) {
    drawFormulaAt(S.unten, ox + 44, oy + 58, th.a);
    for (const ln of wrapText(S.merke, 27).slice(0, 2).map((s, i) => [s, i])) Screen.textPx(ln[0], ox + 4, oy + 78 + ln[1] * 9, th.txt);
  } else if (t > 0.8) {
    // das wandernde Zeichen: bei der Summenregel fällt die 7 nach unten und verblasst
    const fall = step === 3, e = a * a * (3 - 2 * a);
    const x = S.von[0] + (S.nach[0] - S.von[0]) * e - (fall ? 0 : Math.sin(e * Math.PI) * 34), y = S.von[1] + (S.nach[1] - S.von[1]) * e;
    Screen.textPx(S.was, ox + Math.round(x) - 84, oy + Math.round(y) - 11, fall && a > 0.6 ? th.dim : th.b);
  }
};

};

/* Feines Portrait (64x80, gebaut mit feinGesicht in 56_fein_people.js): Farbnummern, 255 = durchsichtig.
   Es liegt in der feinen Ebene und ist auf dem Bildschirm so groß wie ein altes (32x40). */
function drawPortraitF(art, fx, fy, zoom, forceCol) {
  const d = art.d, w = art.w, h = art.h;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const c = d[y * w + x]; if (c === 255) continue;
    if (zoom === 1) F2.px(fx + x, fy + y, forceCol >= 0 ? forceCol : c);
    else F2.rect(fx + x * zoom, fy + y * zoom, zoom, zoom, forceCol >= 0 ? forceCol : c);
  }
}

function drawPortrait(art, px, py) {
  if (art.fein) { drawPortraitF(art, Math.round(px * 2), Math.round(py * 2), 1, -1); return; }
  for (let y = 0; y < art.length; y++) {
    const row = art[y];
    for (let x = 0; x < row.length; x++) {
      const c = row[x];
      if (c === '.') continue;
      Screen.px(px + x, py + y, PCOL[c]);
    }
  }
}

function drawPortrait2x(art, px, py, forceCol) {
  if (art.fein) { drawPortraitF(art, Math.round(px * 2), Math.round(py * 2), 2, forceCol); return; }

/* ---------------- Dialog ---------------- */
function talkPages(s) {
  if (s.schild) return [wrapText(s.text, s.bild ? 24 : 32)];          // Hinweistafel: eine Seite, eigener Umbruch
  const lines = wrapText(s.text, 36);
  // Mit Formel passt auf die letzte Seite weniger Text: je höher die Formel, desto weniger
  let lastPerPage = 6;
  if (s.formula) { const fb = fxParse(s.formula); lastPerPage = Math.max(1, Math.min(4, Math.floor((54 - fb.asc - fb.desc) / 9))); }
  const perPage = 6;
  const pages = [];
  let rest = lines.slice();
  // Kapitel mit umbruch: 'absatz' brechen lieber an einer Leerzeile um als mitten im Satz
  // und lassen nie eine einzelne Zeile auf der letzten Seite stehen (ab Kapitel 3).
  const absatz = !!(Game.chapter && Game.chapter.umbruch === 'absatz');
  while (rest.length) {
    const isLast = rest.length <= lastPerPage;
    // Was nicht mehr neben die Formel passt, kommt auf eine Seite davor
    let take = isLast ? lastPerPage : Math.min(perPage, s.formula ? rest.length - 1 : perPage);
    if (absatz && !isLast) {
      let k = -1;
      for (let j = Math.min(take, rest.length - 1); j >= 1; j--) if (rest[j] === '') { k = j; break; }
      if (k >= 1) { pages.push(rest.slice(0, k)); rest = rest.slice(k + 1); continue; }
      if (rest.length - take === 1 && take > 2) take--;
    }
    pages.push(rest.slice(0, take));
    rest = rest.slice(take);
  }
  return pages.length ? pages : [[]];
}

/* ---------------- Der Weg nach Sinusia ---------------- */
/* Spielfigur im Schlafanzug, 9x14 Pixel, zwei Schrittbilder */
const WALKER = [
  ['...888...', '..87778..', '..77777..', '..7.7.7..', '...777...', '..3.3.3..', '.3333333.',
   '.3.333.3.', '.3.333.3.', '...333...', '...3.3...', '..33.33..', '..3...3..', '.11...11.'],
  ['...888...', '..87778..', '..77777..', '..7.7.7..', '...777...', '..3.3.3..', '.3333333.',
   '.3.333.3.', '.3.333.3.', '...333...', '...3.3...', '...3.3...', '...3.3...', '...1.1...']
];
/* Die Spielfigur auf dem Weg in feinen Punkten (640x400): X Mitte, Y Fußlinie, p Schrittphase.
   Kopf mit Augen auf halber Höhe, abfallende Schultern, Arme und Beine pendeln gegengleich, Knie beugen sich. */
function wandererFein(X, Y, p, laeuft) {
  const dick = (x1, y1, x2, y2, d, c) => { const n = Math.ceil(Math.hypot(x2 - x1, y2 - y1)) + 1;
    for (let i = 0; i <= n; i++) F2.rect(Math.round(x1 + (x2 - x1) * i / n - d / 2), Math.round(y1 + (y2 - y1) * i / n - d / 2), d, d, c); };
  const HA = [HOLZ[0], HOLZ[1], HOLZ[2]], SK = [HAUT[0], HAUT[1], HAUT[2]], HE = [79, 80], HO = [76, 77], SCH = [STEIN[0], STEIN[1]];
  const s = laeuft ? Math.sin(p) : 0, hub = laeuft ? Math.round(Math.abs(Math.cos(p)) * 1.5) : 0, y0 = Y - hub;
  const bein = (ph, c, cs) => {                                      // Hüfte -> Knie -> Knöchel
    const a = laeuft ? Math.sin(ph) * 0.45 : 0, beug = laeuft ? Math.max(0, -Math.cos(ph)) * 0.6 : 0;
    const hx = X, hy = y0 - 26, kx = hx + Math.sin(a) * 13, ky = hy + Math.cos(a) * 13;
    const fx = kx + Math.sin(a - beug) * 12, fy = Math.min(Y - 2, ky + Math.cos(a - beug) * 12);
    dick(hx, hy, kx, ky, 5, c); dick(kx, ky, fx, fy, 4, c); F2.rect(Math.round(fx) - 2, Math.round(fy) - 1, 7, 3, cs);
  };
  const arm = (ph, c) => {                                           // Schulter -> Ellbogen -> Hand
    const a = laeuft ? -Math.sin(ph) * 0.5 : 0.08, sx = X, sy = y0 - 42;
    const ex = sx + Math.sin(a) * 9, ey = sy + Math.cos(a) * 9, hx = ex + Math.sin(a + 0.35) * 8, hy = ey + Math.cos(a + 0.35) * 8;
    dick(sx, sy, ex, ey, 3, c); dick(ex, ey, hx, hy, 3, c); F2.rect(Math.round(hx) - 1, Math.round(hy) - 1, 3, 3, SK[1]);
  };
  bein(p + Math.PI, HO[0], SCH[0]); arm(p, HE[0]);                   // hinten, dunkler
  for (let r = 0; r < 18; r++) {                                     // Rumpf: abfallende Schultern, zur Hüfte schmaler
    const yy = y0 - 44 + r, b = r === 0 ? 8 : r === 1 ? 11 : Math.round(12 - r * 0.12);
    const x0 = X - Math.floor(b / 2);
    F2.rect(x0, yy, b, 1, HE[1]); F2.rect(x0, yy, 2, 1, HE[0]);
  }
  F2.rect(X - 5, y0 - 27, 11, 2, HO[0]);                             // Gürtel
  bein(p, HO[1], SCH[1]); arm(p + Math.PI, HE[1]);                   // vorn
  F2.rect(X - 1, y0 - 46, 4, 3, SK[1]);                              // Hals
  for (let r = 0; r < 10; r++) {                                     // Kopf, zur Gehrichtung gedreht
    const b = [5, 7, 9, 9, 9, 9, 9, 8, 7, 5][r], x0 = X + 1 - Math.floor(b / 2), yy = y0 - 56 + r;
    F2.rect(x0, yy, b, 1, SK[2]); F2.rect(x0, yy, 1, 1, SK[1]);
  }
  F2.rect(X - 2, y0 - 57, 7, 2, HA[1]); F2.rect(X - 3, y0 - 55, 9, 2, HA[1]); F2.rect(X - 4, y0 - 53, 3, 4, HA[0]);   // Haar, hinten tiefer
  F2.rect(X + 1, y0 - 56, 3, 1, HA[2]);
  F2.rect(X + 2, y0 - 51, 1, 2, BLACK); F2.rect(X + 4, y0 - 51, 1, 2, BLACK);   // Augen auf halber Kopfhöhe
  F2.rect(X + 5, y0 - 49, 1, 1, SK[1]); F2.rect(X + 2, y0 - 48, 3, 1, SK[0]);   // Nase, Mund
}

function drawSprite(rows, px, py, map) {
  for (let y = 0; y < rows.length; y++) for (let x = 0; x < rows[y].length; x++) {
    const c = rows[y][x]; if (c === '.') continue;

/* Skizze neben einer Torfrage (Rücklauf 2026-11-17, 16:53): Q rückt an P heran, die Sekante dreht sich in die
   Tangente. Gemalt in feinen Bildpunkten, wenn es sie gibt, sonst grob. x, y, w, h in alten Koordinaten. */
function f2Linie(x0, y0, x1, y1, c, strich, kl, dick) {
  const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1);
  for (let i = 0; i <= n; i++) {
    if (strich && (i % 8) > 4) continue;
    const x = Math.round(x0 + (x1 - x0) * i / n), y = Math.round(y0 + (y1 - y0) * i / n);
    if (kl && (x < kl[0] || x > kl[2] || y < kl[1] || y > kl[3])) continue;
    if (Screen.fein) { F2.px(x, y, c); if (dick) F2.px(x, y + 1, c); } else Screen.px(x >> 1, y >> 1, c);
  }
}
function gateSkizze(name, x, y, w, h, t) {
  if (name === 'streifen') {   // Ober- und Untersumme: immer mehr, immer schmalere Streifen; O - U ist der orange Rest
    const X = x * 2, Y = y * 2, W = w * 2, H = h * 2, R = (a, b, c, d, e) => { if (d > 0 && c > 0) { if (Screen.fein) F2.rect(a, b, c, d, e); else Screen.rect(a >> 1, b >> 1, Math.max(1, c >> 1), Math.max(1, d >> 1), e); } };
    if (Screen.fein) { F2.rect(X, Y, W, H, BLACK); F2.frame(X, Y, W, H, DGREY); } else { Screen.rect(x, y, w, h, BLACK); Screen.frame(x, y, w, h, DGREY); }
    const x0 = X + 14, x1 = X + W - 12, yb = Y + H - 14, f = u => 0.18 + 0.72 * u * u, hh = H - 46;
    const n = [2, 4, 8, 16, 32][Math.floor(t / 1.6) % 5], bw = (x1 - x0) / n;
    for (let k = 0; k < n; k++) { const a = Math.round(x0 + k * bw), b = Math.round(x0 + (k + 1) * bw), lo = Math.round(f(k / n) * hh), hi = Math.round(f((k + 1) / n) * hh);
      R(a, yb - hi, b - a, hi - lo, ORANGE); R(a, yb - lo, b - a, lo, BLUE); if (n <= 16) R(a, yb - hi, 1, hi, BLACK); }
    for (let i = 0; i <= x1 - x0; i++) R(x0 + i, yb - Math.round(f(i / (x1 - x0)) * hh) - 1, 1, 2, WHITE);
    R(x0 - 4, yb, x1 - x0 + 8, 1, LTGREY); R(x0, Y + 20, 1, yb - Y - 20, LTGREY);
    Screen.textPx('O - U', x + 4, y + 3, ORANGE); Screen.textPx(n + ' Streifen', x + 4, y + 13, LTGREY);
    return;
  }
  if (name !== 'sekante') return;
  const X = x * 2, Y = y * 2, W = w * 2, H = h * 2, kl = [X + 2, Y + 2, X + W - 3, Y + H - 3];
  if (Screen.fein) { F2.rect(X, Y, W, H, BLACK); F2.frame(X, Y, W, H, DGREY); } else { Screen.rect(x, y, w, h, BLACK); Screen.frame(x, y, w, h, DGREY); }
  const fx = u => X + 12 + u * (W - 24), fy = v => Y + H - 14 - v * (H - 34), f = u => 0.08 + 0.92 * u * u;
  for (let i = 0; i < 200; i++) { const u0 = i / 200, u1 = (i + 1) / 200; f2Linie(fx(u0), fy(f(u0)), fx(u1), fy(f(u1)), WHITE, false, kl, true); }
  const uP = 0.38, p = Math.min(1, (t % 6) / 4.5), uQ = uP + 0.55 * Math.pow(1 - p, 1.6) + 0.004;
  const sl = (u0, u1) => (fy(f(u1)) - fy(f(u0))) / (fx(u1) - fx(u0));
  const gerade = (m, c, strich) => f2Linie(X, fy(f(uP)) + (X - fx(uP)) * m, X + W, fy(f(uP)) + (X + W - fx(uP)) * m, c, strich, kl, true);
  gerade(sl(uP, uP + 1e-4), p >= 1 ? LTGREEN : GREEN, true);                 // Tangente in P, gestrichelt
  if (p < 1) gerade(sl(uP, uQ), ORANGE, false);                                    // Sekante durch P und Q
  const punkt = (u, c, s, dx) => { const px = Math.round(fx(u)), py = Math.round(fy(f(u)));
    if (Screen.fein) { F2.rect(px - 2, py - 2, 5, 5, c); } else Screen.rect((px >> 1) - 1, (py >> 1) - 1, 3, 3, c);
    Screen.textPx(s, (px >> 1) + dx, (py >> 1) - 4, c); };
  if (p < 1) punkt(uQ, ORANGE, 'Q', -9);
  punkt(uP, YELLOW, 'P', 4);
  Screen.textPx(p >= 1 ? 'Tangente' : 'Sekante', x + 4, y + 3, p >= 1 ? LTGREEN : ORANGE);
}

function renderTask(t) {
  const s = Game.task, st = Game.curSt();
  if (s.ekWahl && typeof renderPendelWahl === 'function' && renderPendelWahl(t)) return;   // Zuruf am Bremsberg: Auswahl unter Experiment und Tabelle
  Screen.clear(BLACK);
  Screen.rect(0, 8, SW, 2, DGREY);

  let y = 13;
  const st0 = Game.curSt();
  if (s.fest && s.context) {
    // Aufgabe mit Teilaufgaben: Der Kontext bleibt immer stehen, der Tipp kommt darunter
    for (const ln of wrapText(s.context, 39).slice(0, 2)) { Screen.textPx(ln, 2, y, CYAN); y += 9; }
    y += 2;
    if (st0.hints > 0 && s.hints) {
      const h = 'Tipp: ' + s.hints[Math.min(st0.hints, s.hints.length) - 1];
      for (const ln of wrapText(h, 39).slice(0, 3)) { Screen.textPx(ln, 2, y, YELLOW); y += 9; }
      y += 2;
    }
  } else if (st0.hints > 0 && s.hints) {
    // Der Tipp ersetzt die Kontextzeile - so verdeckt er keine Antwort.
    const h = 'Tipp: ' + s.hints[Math.min(st0.hints, s.hints.length) - 1];
    for (const ln of wrapText(h, 39).slice(0, 3)) { Screen.textPx(ln, 2, y, YELLOW); y += 9; }
    y += 2;
  } else if (s.context) {
    for (const ln of wrapText(s.context, 39).slice(0, 2)) { Screen.textPx(ln, 2, y, CYAN); y += 9; }
    y += 2;
  }
  // Kapitel mit gegebenZuerst: erst das Gegebene (die Formel), dann die Frage
  const vor = !!Game.chapter.gegebenZuerst && s.formula;
  if (vor) { y += 1; y += drawFormulaCentered(s.formula, y, YELLOW) + 4; }
  for (const ln of wrapText(s.q, 39).slice(0, 4)) { Screen.textPx(ln, 2, y, WHITE); y += 9; }
  if (s.formula && !vor) { y += 3; y += drawFormulaCentered(s.formula, y, YELLOW) + 4; }

  // Passt eine Antwort mit Bruch und Hochzahl nicht in die übliche Zeile, werden die Zeilen höher
  // und rücken dichter an die Frage; sonst bleibt alles, wie es war
  const optAlt = Math.max(y + 4, s.formula ? 84 : 62), rowAlt = Math.min(24, Math.floor((188 - optAlt) / s.options.length));
  const boxH = optHoehe(s.options), eng = boxH > rowAlt - 2;
  const optTop = eng ? Math.max(y + 4, s.formula ? 84 : 44) : optAlt;
  const rowH = eng ? Math.min(boxH + 6, Math.floor((188 - optTop) / s.options.length)) : rowAlt;
  const ow = s.skizze ? 198 : 312;                       // mit Skizze rechts daneben sind die Antwortzeilen schmaler (wie am Tor)
  if (s.skizze) gateSkizze(s.skizze, 208, optTop, 108, rowH * s.options.length - 2, t);
  s.options.forEach((o, i) => {
    const oy = optTop + i * rowH;
    let col = LTGREY, frame = DGREY;
    if (Game.sel === i) { col = WHITE; frame = LTBLUE; }
    Screen.rect(4, oy, ow, rowH - 2, Game.sel === i ? BLUE : BLACK);
    Screen.frame(4, oy, ow, rowH - 2, frame);
    (Screen.fein ? Screen.textPx : Screen.glyph).call(Screen, String(i + 1), 8, oy + Math.round((rowH - 10) / 2), YELLOW);   // fein: Ziffer in derselben Schrift wie die Antwort
    if (optF(o)) {
      const box = fxParse(optF(o));
      fxDraw(box, 22, oy + Math.round((rowH - 2) / 2) + Math.round((box.asc - box.desc) / 2), col);
      if (o.f && o.t) Screen.textPx(o.t, 22 + box.w + 8, oy + Math.round((rowH - 10) / 2), col);
    } else {
      const lines = wrapText(o.t, s.skizze ? 22 : 36);
      lines.slice(0, 2).forEach((ln, k) =>
        Screen.textPx(ln, 22, oy + Math.round((rowH - 2 - lines.length * 9) / 2) + k * 9, col));
    }
    hot(4, oy, ow, rowH - 2, { pick: i });
  });

  const fussE = !!Game.chapter.nochmalIntro && !s.probe;
  footer(s.noHints ? ' [K] Karte   Antwort 1-4'
         : (st.hints < (s.hints ? s.hints.length : 0)
          ? ' [H] Tipp ' + (st.hints + 1) + '/' + s.hints.length
          : ' Kein Tipp mehr') + '  [K] Karte  ' + (fussE ? '[E] Einführung  ' : '') + 'Antwort 1-4');
  if (fussE) {                                   // feine Fußzeile: drei Tippflächen nebeneinander
    hot(0, SH - 10, 62, 10, { hint: true }); hot(64, SH - 10, 50, 10, { map: true }); hot(116, SH - 10, 82, 10, { intro: true });
  } else {
  hot(0, SH - 8, 110, 8, { hint: true });
  hot(180, SH - 8, 70, 8, { map: true });
  }
}

/* Fehlerbildschirm (Rückmeldung der Studierenden, 2026-11-20): bei Auswahlaufgaben steht da, was gewählt wurde, was
   richtig gewesen wäre und wo der Denkfehler steckt; „Ausführlich" zeigt den Rechenweg aus Tipps und Erklärung.
   Danach kommen wie bisher neue Zahlen. */
function fehlerSchirm(s) { return !!(s && s.kind !== 'mini' && !s.ekWahl && s.options && Game.pick >= 0 && s.options[Game.pick]); }

/* Umbruch nach Pixelbreite (breite Schrift in K1/K2, schmale ab K3 fein); Wörter bleiben ganz */
function wrapPx(text, w) {
  const out = [];
  for (const absatz of String(text || '').split('\n')) {
    let z = '';
    for (const wort of absatz.split(' ')) {
      const neu = z ? z + ' ' + wort : wort;
      if (z && tw(neu) > w) { out.push(z); z = wort; } else z = neu;
    }
    out.push(z);
  }
  return out;
}
const FEHLER_X = () => 12 + Math.max(tw('Deine Antwort:'), tw('Richtig wäre:')) + 8;

function fehlerZeile(lab, o, y, col) {
  if (lab) Screen.textPx(lab, 12, y, LTGREY);
  let x = FEHLER_X(); const f = optF(o);
  if (f) {
    const bx = fxParse(f);
    if (bx.w > 304 - x) { x = 20; y += 10; drawFormulaAt(f, x, y - 2, col); return 10 + Math.max(12, bx.asc + bx.desc + 4); }   // breite Formel: eine Zeile tiefer
    drawFormulaAt(f, x, y - 2, col); return Math.max(12, bx.asc + bx.desc + 4);
  }
  const zl = wrapPx(o.t, 304 - x).slice(0, 2);
  zl.forEach((ln, i) => Screen.textPx(ln, x, y + i * 9, col));
  return zl.length * 9 + 3;
}

  }

    const lines = wrapText(h, 39).slice(0, 2);

  } else {
    Screen.textPx(s.title, 2, 10, LTGREEN);
    Screen.textPx(s.auftrag || 'Stelle genau diese Funktion ein:', 2, 19, GREY);
  }
  drawFormulaCentered(s.formula, 30, YELLOW);

  if (MINI_FELD[s.fn]) miniFeld(s, m); else {
  const L = 16, R = 304, T = 48, B = 118;
  const xmin = s.xmin || 0, xmax = s.xmax, ymin = s.ymin, ymax = s.ymax;
  const X = x => L + (x - xmin) / (xmax - xmin) * (R - L);
  const Y = y => B - (y - ymin) / (ymax - ymin) * (B - T);
  for (let gx = Math.ceil(xmin); gx <= xmax; gx += s.gx) { const px = Math.round(X(gx));
    for (let py = T; py <= B; py += 4) Screen.px(px, py, DGREY); }
  for (let gy = Math.ceil(ymin); gy <= ymax; gy += s.gy) { const py = Math.round(Y(gy));
    for (let px = L; px <= R; px += 4) Screen.px(px, py, DGREY); }
  const ax = Math.round(X(Math.max(xmin, Math.min(xmax, 0))));
  Screen.rect(L, Math.round(Y(0)), R - L, 1, GREY);
  Screen.rect(ax, T, 1, B - T, GREY);
  for (let gy = Math.ceil(ymin); gy <= ymax; gy += (s.kaestchen ? s.gy : 2)) {    // mit Kästchen: Achse in Kästchenschritten
    const py = Math.round(Y(gy));
    if (py < T || py > B - 5 || gy === 0) continue;
    Screen.rect(ax - 2, py, 3, 1, GREY);
    text5(String(gy), ax - 3 - String(gy).length * 5, py - 2, LTGREY);
  }
  Screen.textPx(s.xvar || 't', R - 8, Math.min(B - 9, Math.round(Y(0)) + 2), GREY);
  if (xmin < 0) {
    for (let gx = Math.ceil(xmin / 2) * 2; gx <= xmax; gx += 2) {
      if (gx === 0 || gx === xmax) continue;
      text5(String(gx), Math.round(X(gx)) - String(gx).length * 2, Math.min(B - 4, Math.round(Y(0)) + 3), GREY);
    }
  } else text5(String(xmax), R - 14, Math.min(B - 4, Math.round(Y(0)) + 4), GREY);

  let mine;
  if (s.fn === 'tang') {                         // Tangente anlegen: Kurve und Punkt stehen fest, gestellt wird die Steigung der Geraden
    plotFn(px => Y(s.kurve((px - L) / (R - L) * (xmax - xmin) + xmin)), L, R, WHITE, T, B);
    mine = x => s.py + m.A * (x - s.px);
    scheibe(Math.round(X(s.px)), Math.round(Y(s.py)), 2, LTRED); Screen.textPx('P', Math.round(X(s.px)) - 10, Math.round(Y(s.py)) - 11, LTRED);
  }
  else if (s.fn === 'stamm') {                   // Stammfunktion einhängen: F(x) + C soll durch P gehen, gestellt wird C
    mine = x => s.kurve(x) + m.A;
    scheibe(Math.round(X(s.px)), Math.round(Y(s.py)), 2, LTRED); Screen.textPx('P', Math.round(X(s.px)) + 5, Math.round(Y(s.py)) - 3, LTRED);
  }
  else if (s.fn === 'grenze' || s.fn === 'flut') {   // Fläche unter der Kurve von a bis zur Grenze: füllt sich blau
    const a0 = s.von || 0, gr = Math.max(a0, Math.min(xmax, m.A)), y0 = Math.round(Y(0));
    for (let fx = Math.round(X(a0) * 2); fx <= Math.round(X(gr) * 2); fx++) {
      const xx = (fx / 2 - L) / (R - L) * (xmax - xmin) + xmin, yy = Math.round(Y(Math.max(0, s.kurve(xx))) * 2);
      if (Screen.fein) F2.rect(fx, yy, 1, Math.max(0, y0 * 2 - yy), s.kaestchen || (fx + (yy >> 2)) % 9 ? BLUE : LTBLUE);   // mit Kästchen einfarbig, sonst gehen die Linien unter else if (fx % 2 === 0) Screen.rect(fx >> 1, yy >> 1, 1, Math.max(0, y0 - (yy >> 1)), BLUE);
    }
    plotFn(px => Y(s.kurve((px - L) / (R - L) * (xmax - xmin) + xmin)), L, R, WHITE, T, B);
    Screen.rect(Math.round(X(gr)), T, 1, B - T, YELLOW);
    if (s.fn === 'grenze') Screen.textPx('b', Math.round(X(gr)) + 3, T + 2, YELLOW);
    if (s.kaestchen) {                           // leicht: grobe Kästchen zum Abzählen (2026-11-20), über der Fläche gut sichtbar
      const lin = (x, y, w, h) => { if (Screen.fein) F2.rect(x * 2, y * 2, Math.max(1, w * 2), Math.max(1, h * 2), LTGREY); else Screen.rect(x, y, w, h, LTGREY); };
      for (let x = xmin; x <= xmax + 1e-9; x += (s.gx || 1)) lin(Math.round(X(x)), Math.round(Y(s.ymax)), 0.5, Math.round(Y(0)) - Math.round(Y(s.ymax)));
      for (let y = 0; y <= s.ymax + 1e-9; y += s.gy) lin(Math.round(X(xmin)), Math.round(Y(y)), Math.round(X(xmax)) - Math.round(X(xmin)), 0.5);
      const lab = '1 Kästchen = ' + z(s.kaestchen) + ' kWh';
      Screen.textPx(lab, R - tw(lab), T - 9, LTGREY);                 // über dem Feld rechts, damit nichts von der Fläche verdeckt ist
    }
    mine = null;
  }
  else if (s.fn === 'parab') mine = x => m.A * (x - m.C) * (x - m.C) + m.D;
  else { const trig = s.fn === 'cos' ? Math.cos : Math.sin; mine = x => m.A * trig(m.B * (x - m.C)) + m.D; }
  if (mine) plotFn(px => Y(mine((px - L) / (R - L) * (xmax - xmin) + xmin)), L, R, YELLOW, T, B);
  if (s.merk && s.kaestchen) Screen.textPx(s.merk, L, T - 9, LTGREEN);       // mit Kästchen: über dem Feld links
  else if (s.merk) { Screen.rect(L + 2, T + 1, tw(s.merk) + 6, 10, BLACK); Screen.textPx(s.merk, L + 5, T + 2, LTGREEN); }   // das Ziel bleibt im Bild, auch wenn ein Tipp den Auftrag ersetzt   // das Ziel bleibt im Bild, auch wenn ein Tipp den Auftrag ersetzt
  }
  if (s.fn === 'flut') {                         // kein Regler: Uhr und ein Knopf für den Schieber
    Screen.textPx('t = ' + z(Math.floor(m.A * 10) / 10) + ' min', 20, 136, m.lauf ? YELLOW : WHITE);
    Screen.textPx(m.lauf ? 'Das Wasser strömt ein ...' : (m.zu ? 'Schieber ist zu.' : 'Der Schieber ist noch zu.'), 20, 150, LTGREY);
    if (!m.zu) button(176, 132, 128, 26, m.lauf ? 'Schieber ZU' : 'Schieber AUF', { flut: true }, m.lauf ? LTRED : LTGREEN, BLACK);
    footer((st.hints < (s.hints ? s.hints.length : 0) ? ' [H] Tipp' : ' ') + '  [K] Karte');      // der Schieber hat einen Knopf
    hot(0, SH - 8, 80, 8, { hint: true }); hot(88, SH - 8, 80, 8, { map: true });
    return;
  }

  const keys = miniKeys(s);
  const params = s.fn === 'tang' ? [
    { k: 'A', v: m.A, sym: 'm', lab: 'Steigung der Geraden' }
  ] : s.fn === 'stamm' ? [
    { k: 'A', v: m.A, sym: 'C', lab: 'schiebt F nach oben/unten' }
  ] : s.fn === 'grenze' ? [
    { k: 'A', v: m.A, sym: 'b', lab: 'obere Grenze' }
  ] : s.fn === 'abfahren' ? [
    { k: 'A', v: m.A, sym: s.xvar || 't', lab: 'Steigung dort: ' + s.abl + ' = ' + z(Math.round(s.ableitung(Math.max(s.xmin, Math.min(s.xmax, m.A))) * 100) / 100) }
  ] : s.fn === 'asymp' ? [
    { k: 'A', v: m.A, sym: 'x', lab: 'senkrechte Gerade' },
    { k: 'D', v: m.D, sym: 'y', lab: 'waagerechte Gerade' }
  ] : s.fn === 'parab' ? [
    { k: 'A', v: m.A, sym: 'a', lab: 'Streckung' },
    { k: 'C', v: m.C, sym: 'd', lab: 'nach links/rechts' },
    { k: 'D', v: m.D, sym: 'e', lab: 'nach oben/unten' }
  ] : [

/* Minispiele von Kapitel 4 mit eigenem Zeichenfeld (2026-11-18): Steigung abfahren (Wasserturm) und Asymptoten anlegen
   (Horizontsteg). Kurven und Striche liegen bei feiner Schrift in der feinen Ebene. Das Feld gilt auch fürs Ziehen. */
const MINI_FELD = {
  abfahren: { L: 22, R: 302, T: 44, B: 92, T2: 99, B2: 130 },
  asymp:    { L: 16, R: 302, T: 52, B: 130 }
};
function miniPunkt(x, y, r, col) {
  if (!Screen.fein) { scheibe(Math.round(x), Math.round(y), Math.max(1, Math.round(r / 2)), col); return; }
  const cx = Math.round(x * 2), cy = Math.round(y * 2);
  for (let dy = -r; dy <= r; dy++) { const w = Math.round(Math.sqrt(r * r - dy * dy)); F2.rect(cx - w, cy + dy, 2 * w + 1, 1, col); }
}
/* Kurve f (in Einheiten) über das Feld; pol: Stelle, an der die Kurve abreißt (Polstelle) */
function miniKurve(f, xmin, xmax, L, R, Y, T, B, col, pol) {
  const xv = px => (px - L) / (R - L) * (xmax - xmin) + xmin;
  if (!Screen.fein) { plotFn(px => { const v = f(xv(px)); return isFinite(v) ? Y(v) : NaN; }, L, R, col, T, B); return; }
  let prev = null, prevX = null;
  for (let fx = L * 2; fx <= R * 2; fx++) {
    const x = xv(fx / 2), v = f(x);
    if (pol !== undefined && prevX !== null && (prevX - pol) * (x - pol) <= 0) prev = null;
    prevX = x;
    if (!isFinite(v)) { prev = null; continue; }
    const yy = Math.round(Y(v) * 2);
    if (prev !== null) {
      const a = Math.max(Math.min(prev, yy), T * 2), b = Math.min(Math.max(prev, yy), B * 2 - 1);
      if (b >= a) F2.rect(fx, a, 2, b - a + 2, col);
    } else if (yy >= T * 2 && yy < B * 2) F2.rect(fx, yy, 2, 2, col);
    prev = yy;
  }
}
/* gestrichelte waagerechte (y0 = y1) oder senkrechte Linie in alten Koordinaten */
function miniStrich(x0, y0, x1, y1, col, dick) {
  const d = dick ? 3 : 2;
  if (Screen.fein) {
    if (y0 === y1) for (let fx = Math.round(x0 * 2); fx < x1 * 2; fx += 8) F2.rect(fx, Math.round(y0 * 2) - (d >> 1), Math.min(5, Math.round(x1 * 2) - fx), d, col);
    else for (let fy = Math.round(Math.min(y0, y1) * 2); fy < Math.max(y0, y1) * 2; fy += 8) F2.rect(Math.round(x0 * 2) - (d >> 1), fy, d, Math.min(5, Math.round(Math.max(y0, y1) * 2) - fy), col);
  } else {
    if (y0 === y1) for (let x = Math.round(x0); x < x1; x += 4) Screen.rect(x, Math.round(y0), 2, 1, col);
    else for (let y = Math.round(Math.min(y0, y1)); y < Math.max(y0, y1); y += 4) Screen.rect(Math.round(x0), y, 1, 2, col);
  }
}
function miniFeld(s, m) {
  const F = MINI_FELD[s.fn], L = F.L, R = F.R, xmin = s.xmin, xmax = s.xmax;
  const X = x => L + (x - xmin) / (xmax - xmin) * (R - L);
  if (s.fn === 'abfahren') {
    // oben der Graph von V mit dem Punkt P und seiner Tangente, unten wächst Punkt für Punkt die Spur von V'
    const T = F.T, B = F.B, T2 = F.T2, B2 = F.B2;
    const Y = v => B - (v - s.ymin) / (s.ymax - s.ymin) * (B - T), mid = Math.round((T2 + B2) / 2), Y2 = d => mid - d / s.dmax * (B2 - T2) / 2;
    for (let gx = Math.ceil(xmin); gx <= xmax; gx += s.gx) { const px = Math.round(X(gx));
      for (let py = T; py <= B2; py += 4) if (py <= B || py >= T2) Screen.px(px, py, DGREY); }
    const jede = (B - T) / ((s.ymax - s.ymin) / s.gy) < 9 ? 2 : 1;     // Zahlen an der Hochachse nicht dichter als 9 Punkte
    for (let gy = s.ymin, n = 0; gy < s.ymax; gy += s.gy, n++) { const py = Math.round(Y(gy));
      for (let px = L; px <= R; px += 4) Screen.px(px, py, DGREY);
      Screen.rect(L - 2, py, 2, 1, GREY); if (n % jede === 0) text5(String(gy), L - 3 - String(gy).length * 5, py - 2, LTGREY); }
    Screen.rect(L, B, R - L + 1, 1, GREY); Screen.rect(L, T, 1, B - T, GREY);
    Screen.rect(L, mid, R - L + 1, 1, GREY); Screen.rect(L, T2, 1, B2 - T2, GREY);
    text5('0', L - 7, mid - 2, LTGREY);
    for (let gx = 2; gx <= xmax; gx += 2) text5(String(gx), Math.round(X(gx)) - String(gx).length * 2, B2 + 2, GREY);
    Screen.textPx(s.xvar || 't', R + 4, B - 5, GREY); Screen.textPx(s.xvar || 't', R + 4, mid - 4, GREY);
    Screen.textPx(s.fname, L + 4, T, WHITE);
    Screen.textPx(s.abl, L + 4, B2 - 9, LTGREEN);
    miniKurve(s.kurve, xmin, xmax, L, R, Y, T, B, WHITE);
    const tp = Math.max(xmin, Math.min(xmax, m.A)), vp = s.kurve(tp), mp = s.ableitung(tp), dx = (xmax - xmin) * 0.14;
    m.spur = m.spur || {}; m.spur[tp.toFixed(2)] = 1;

    miniStrich(X(tp), Y(vp) + 3, X(tp), Y2(mp), GREY);
    miniKurve(t => (Math.abs(t - tp) <= dx ? vp + mp * (t - tp) : NaN), xmin, xmax, L, R, Y, T, B, YELLOW);

  const T = F.T, B = F.B, ymin = s.ymin, ymax = s.ymax, Y = y => B - (y - ymin) / (ymax - ymin) * (B - T);
  for (let gx = Math.ceil(xmin); gx <= xmax; gx += s.gx) { const px = Math.round(X(gx)); for (let py = T; py <= B; py += 4) Screen.px(px, py, DGREY); }
  for (let gy = Math.ceil(ymin); gy <= ymax; gy += s.gy) { const py = Math.round(Y(gy)); for (let px = L; px <= R; px += 4) Screen.px(px, py, DGREY); }
  const ax = Math.round(X(0)), ay = Math.round(Y(0));

  for (let gy = Math.ceil(ymin / 2) * 2; gy <= ymax; gy += 2) { if (!gy) continue; const py = Math.round(Y(gy));
    if (py < T + 3 || py > B - 3) continue; Screen.rect(ax - 2, py, 3, 1, GREY); text5(String(gy), ax - 3 - String(gy).length * 5, py - 2, LTGREY); }

  Screen.textPx('x', R - 6, ay + 2, GREY); Screen.textPx('y', ax + 4, T, GREY);
  miniKurve(s.kurve, xmin, xmax, L, R, Y, T, B, WHITE, s.pol);
  const xa = Math.max(xmin, Math.min(xmax, m.A)), ya = Math.max(ymin, Math.min(ymax, m.D));
  const cA = m.sel === 0 ? YELLOW : ORANGE, cD = m.sel === 1 ? YELLOW : ORANGE;

  const tA = 'x = ' + z(xa), tD = 'y = ' + z(ya), yA = Y(ya) < T + 16 ? B - 10 : T + 1;
  Screen.textPx(tA, Math.min(R - tw(tA) - 2, Math.round(X(xa)) + 4), yA, cA);
  Screen.textPx(tD, Math.round(X(xa)) > R - 60 ? L + 4 : R - tw(tD) - 2, Math.max(T, Math.round(Y(ya)) - 10), cD);
}

function drawPiFrac(v, x, y, col) {
  const dens = [1, 2, 3, 4, 6, 8, 12, 24];
  for (const d of dens) {
    const n = v * d / Math.PI;
    if (Math.abs(n - Math.round(n)) < 0.02) {
      const nn = Math.round(n);
      if (nn === 0) { Screen.textPx('0', x, y + 1, col); return; }
      const num = (Math.abs(nn) === 1 ? '' : Math.abs(nn)) + 'pi';
      drawFormulaAt((nn < 0 ? '-' : '') + (d === 1 ? num : '<<' + num + '/' + d + '>>'), x, y - 4, col);
      return;
    }
  }
  Screen.textPx(fmtNum(v), x, y + 1, col);
}

/* Kleine Ziffern (5x5) fuer Achsenbeschriftungen, auch mehrstellig und negativ */
function text5(str, x, y, col) {
  if (typeof FM !== 'undefined' && FM.an) { for (const ch of String(str)) { const g = glyph5[ch]; if (g) for (let r = 0; r < 5; r++) for (let c = 0; c < 5; c++) if ((g[r] >> (4 - c)) & 1) F2.rect((x + c) * 2, (y + r) * 2, 2, 2, col); x += 5; } return; }   // fein: dieselbe kleine Schrift, aber in der Deckschicht, damit sie über feinen Flächen steht
  for (const ch of String(str)) { Screen.glyph5(ch, x, y, col); x += 5; }
}

  dreieck(xa, ya, xb, yb, col) {

  /* Maßstab an der senkrechten Seite: weiß mit Teilstrichen je Viertelmeter (px = feine Punkte je Meter), volle Meter rot */
  massstab(x, ya, yb, px) {

  },
  /* Wimpel an einer Stange: Spitze zeigt in Richtung sign */
  wimpel(x, y, sign, col, dunkel) {

  },
  /* Setzwaage in der Lupe (seit 2026-11-17, löst den Gradbogen ab): Die Lupe zeigt das Stück Schiene zwischen Bremsstelle (rot)
     und Markierung (gelb) so vergrößert, dass die beiden Füße immer gleich weit auseinander stehen. Die Kurve ist echt gerechnet:
     Bei großem h ist sie krumm, bei kleinem fast gerade. Das Gestell steht auf den beiden Punkten, das Lot hängt senkrecht,
     am Querholz liest man ab, wie schief das Gestell steht - also die mittlere Steigung zwischen den Füßen.
     f: Kurve, x0: Bremsstelle, h: Abstand mit Vorzeichen, vx/vy: Bildpunkte je Einheit im großen Bild, t: Zeit (Zittern). */
  setzwaage(cx, cy, R, f, x0, h, vx, vy, t, amp) {
    const W = 58, sg = h < 0 ? -1 : 1, ah = Math.abs(h), fm = (f(x0) + f(x0 + h)) / 2, k = W / (ah * vx);
    const P = u => [cx + sg * (u - 0.5) * W, cy + 16 - (f(x0 + u * h) - fm) * vy * k];

    const drin = (x, y) => (x - cx) * (x - cx) + (y - cy) * (y - cy) < (R - 5) * (R - 5);
    for (let u = -0.6; u <= 1.6; u += 0.004) {                                 // Fels unter der Schiene, dann die Schiene
      const [x, y] = P(u); const xx = Math.round(x), yy = Math.round(y);

    // Am Galgen hängt das Lot senkrecht; an der Skala auf der Bordwand sieht man, wie schief der Wagen steht.
    const dx = (B[0] - A[0]) / len, dy = (B[1] - A[1]) / len;
    for (let q = -len / 2 - 7; q <= len / 2 + 7; q += 0.5) for (let r = 7; r <= 23; r += 0.5) {
      const x = Math.round(mx + dx * q + nx * r), y = Math.round(my + dy * q + ny * r); if (!drin(x, y)) continue;
      const rand = r < 8.5 || r > 21.5 || Math.abs(q) > len / 2 + 5.5, fuge = Math.abs(((q + 200) % 12) - 6) < 0.6;
      F2.px(x, y, rand ? HOLZ[1] : fuge ? HOLZ[2] : r > 19 ? HOLZ[5] : HOLZ[3]);
    }
    for (let i = 1; i < 8; i++) { const q = (i - 4) * len / 9, x = mx + dx * q + nx * 12, y = my + dy * q + ny * 12; const hh = i === 4 ? 6 : 3; for (let k = 0; k < hh; k++) { const xx = Math.round(x + nx * k), yy = Math.round(y + ny * k); if (drin(xx, yy)) F2.px(xx, yy, i === 4 ? LTRED : DUNST[3]); } }   // Skala, Mitte rot
    for (const F of [A, B]) { const wx = F[0] + nx * 5, wy = F[1] + ny * 5; if (drin(Math.round(wx), Math.round(wy))) { FM.D(wx, wy, 5.2, STEIN[1]); FM.D(wx, wy, 3.2, STEIN[3]); FM.D(wx, wy, 1.2, DUNST[2]); } }

    const sw = (amp || 0) * (0.7 * Math.sin(t * 4.1) + 0.3 * Math.sin(t * 6.7 + 1)), lot = [S[0] + Math.sin(sw) * 27, S[1] + Math.cos(sw) * 27];
    L(S, lot, DUNST[3]); FM.D(lot[0], lot[1] + 3, 4.2, LICHT[0]); F2.px(Math.round(lot[0]) - 1, Math.round(lot[1]) + 1, WHITE); FM.D(S[0], S[1], 2, 22);
    FM.D(A[0], A[1], 3.2, LTRED); FM.D(B[0], B[1], 3.2, LICHT[0]);

  /* Gradbogen des Pendels: Balken an zwei Haken, darunter der Messingbogen mit Teilstrichen */
  gradbogen(cx, cy) {

    for (let g = 10; g <= 100; g += 10) { const a = g * Math.PI / 180, l = g % 30 === 0 ? 9 : 5; FM.L(cx + Math.cos(a) * (70 - l), cy + Math.sin(a) * (70 - l), cx + Math.cos(a) * 70, cy + Math.sin(a) * 70, DUNST[1]); }

/* Messhunt (Kapitel 3, Bremsberg, seit 2026-11-17), für grobe und feine Auflösung aus einer Funktion.
   A, B: Auflagepunkte der beiden Achsen auf der Schiene in groben Bildpunkten (rote Nabe: die Achse, die an der Bremsstelle
   einrastet; gelbe Nabe: die Achse, die herangezogen wird). amp: Ausschlag des Pendels in rad (0 = hängt still und senkrecht).
   teil: 'kasten' malt nur den Wagen, 'lot' nur das Pendel, sonst beides. Liefert den Aufhängepunkt. */
function messhuntBild(Ax, Ay, Bx, By, amp, t, teil) {
  const k = FM.an ? 2 : 1;
  const P = FM.an ? (x, y, c) => F2.px(Math.round(x), Math.round(y), c) : (x, y, c) => Screen.px(Math.round(x), Math.round(y), c);
  const D = (cx, cy, r, c) => { const q = Math.ceil(r); for (let y = -q; y <= q; y++) for (let x = -q; x <= q; x++) if (x * x + y * y <= r * r + 0.3) P(cx + x, cy + y, c); };
  const L = (x1, y1, x2, y2, c) => { const n = Math.ceil(Math.hypot(x2 - x1, y2 - y1)) * 2 + 1; for (let i = 0; i <= n; i++) { const x = x1 + (x2 - x1) * i / n, y = y1 + (y2 - y1) * i / n; P(x, y, c); if (k > 1) P(x + 1, y, c); } };

  const len = Math.hypot(Bx - Ax, By - Ay), dx = len > 0.01 ? (Bx - Ax) / len : 1, dy = len > 0.01 ? (By - Ay) / len : 0;
  let nx = -dy, ny = dx; if (ny > 0) { nx = -nx; ny = -ny; }                      // Normale nach oben
  const mx = (Ax + Bx) / 2, my = (Ay + By) / 2, S = [mx + nx * 20 * k, my + ny * 20 * k];
  if (teil !== 'lot') {

/* Malhelfer für grob und fein: Koordinaten in groben Punkten, fein mit halben Punkten genau. */
function fmMaler() {
  const k = Screen.fein ? 2 : 1;
  const P = Screen.fein ? (x, y, c) => F2.px(Math.round(x * 2), Math.round(y * 2), c) : (x, y, c) => Screen.px(Math.round(x), Math.round(y), c);
  const R = Screen.fein ? (x, y, w, h, c) => F2.rect(Math.round(x * 2), Math.round(y * 2), Math.max(1, Math.round(w * 2)), Math.max(1, Math.round(h * 2)), c)

  // Punkt für Punkt in feiner Auflösung: f(x, y) mit x, y in groben Punkten (Schritt 1/k)
  const jeder = (x0, y0, w, h, f) => { for (let y = 0; y < h * k; y++) for (let x = 0; x < w * k; x++) f(x0 + x / k, y0 + y / k, x, y); };
  const PX = Screen.fein ? (x, y, c) => F2.px(Math.round(x * 2), Math.round(y * 2), c) : P;

function beschlagBild(th, t, ox, oy, still, step) {

    M.PX(x, y, rand ? (x < bx + 2 ? HOLZ[1] : HOLZ[2]) : (v ? HOLZ[2] : HOLZ[3])); });
  M.R(bx + 9, by, 1, bh, HOLZ[1]);
  M.R(bx + 16, by + 8, bw - 24, 1, HOLZ[4]); M.R(bx + 16, by + bh - 9, bw - 24, 1, HOLZ[4]);
  M.R(bx + 16, by + 8, 1, bh - 16, HOLZ[4]); M.R(bx + bw - 9, by + 8, 1, bh - 16, HOLZ[4]);
  const tt = 'Steigerbuch'; if (tw(tt) <= bw - 14) Screen.textPx(tt, Math.round(bx + 9 + (bw - 9 - tw(tt)) / 2), by + 30, t > 3.0 ? Rm[n - 2] : HOLZ[4]);
  Screen.textPx('⚒', Math.round(bx + 9 + (bw - 9 - tw('⚒')) / 2), by + 46, t > 3.0 ? Rm[n - 2] : HOLZ[4]);
  // vier Ecken nacheinander, jede mit einem kurzen Aufblitzen
  const ecken = [[bx, by, 1, 1], [bx + bw, by, -1, 1], [bx, by + bh, 1, -1], [bx + bw, by + bh, -1, -1]];

GABEN.helm = function (hx, hy, z, t) {

    if (bu * bu + bv * bv <= 1) return 2;

    else if (f === 3) c = St[kl(Math.round(5 - (v - 0.37) * 25), 1, 6)];

};

/* Die Latte selbst: rot-weiß gestreift wie eine Fluchtstange, mit dunkler Unterkante.
   Jedes Feld ist einen Viertelmeter lang. */
function messlatte(x1, y1, x2, y2, felder) {
  x1 = Math.round(x1); x2 = Math.round(x2);
  for (let px = x1; px <= x2; px++) {
    const u = (px - x1) / Math.max(1, x2 - x1), y = Math.round(y1 + (y2 - y1) * u);
    const feld = Math.min(felder - 1, Math.floor(u * felder));
    Screen.px(px, y - 4, feld % 2 ? 62 : WHITE);
    Screen.px(px, y - 3, feld % 2 ? LTRED : WHITE); Screen.px(px, y - 2, feld % 2 ? LTRED : DUNST[3]);
    Screen.px(px, y - 1, feld % 2 ? 59 : DUNST[2]);
    Screen.px(px, y, NACHTB[0]);
  }
}

/* ---------------- Eingaben der Erklärinsel ---------------- */
function ekAct(a) {
  const G = Game, em = G.em;
  if (a.ek === 'buch') { if (G.view === 'map') { Sound.sfx('move'); G.ekOpenBook(Math.min(G.sel, G.ekN() - 1), false); } return; }
  if (G.view === 'buch' && G.buch) {
    if (a.ek === 'booknext') G.ekBookNext();
    else if (a.ek === 'bookprev') G.ekBookTurn(-1);
    else if (a.ek === 'bookturn') G.ekBookTurn(1);
    else if (a.ek === 'bookclose') G.ekBookClose();
    return;
  }
  if (G.view === 'ekfrage') { if (a.ek === 'frage') G.ekFrageWahl(a.i); return; }
  if (G.view !== 'emini' || !em) return;
  if (a.ek === 'hint') { G.ekHint(); return; }
  if (a.ek === 'ok') {
    if (em.kind === 'fahrt') G.ekFahrtWeiter();
    else if (em.won) G.ekMiniDone();
    else if (em.msg) { em.msg = null; em.gut = false; }
    return;
  }
  if (em.msg || em.won) return;
  if (em.kind === 'latte') { if (a.ek === 'left') G.ekLatteMove(-1); else if (a.ek === 'right') G.ekLatteMove(1); else if (a.ek === 'set') G.ekLatteSet(); else if (a.ek === 'zieh' && Input.pointer) G.ekLatteDrag(Input.pointer.x); }
  else if (em.kind === 'pendel') {
    // Pfeil zur Bremsstelle hin heißt näher; die Markierung steht je nach Probe rechts oder links
    if (em.phase === 'schieben' && (a.ek === 'left' || a.ek === 'right')) G.ekHuntSchieb(a.ek === 'left' ? -1 : 1);
    else if (a.ek === 'left') G.ekPendelStep(em.sign); else if (a.ek === 'right') G.ekPendelStep(-em.sign);
    else if (a.ek === 'set') G.ekPendelFrage();
    else if (a.ek === 'zieh' && Input.pointer) G.ekPendelDrag(Input.pointer.x);
  }
  else if (em.kind === 'plan') { if (a.ek === 'up') G.ekPlanMove(1); else if (a.ek === 'down') G.ekPlanMove(-1); else if (a.ek === 'set') G.ekPlanSet(); else if (a.ek === 'planzieh' && Input.pointer) G.ekPlanDrag(Input.pointer.y); }
  else if (em.kind === 'korb') {
    if (a.ek === 'tile') { G.ekKorbPut(a.i); }
    else if (a.ek === 'slot') G.ekKorbTap(a.i);
    else if (a.ek === 'set') G.ekKorbPush();
  }
}

/* Tasten; true = Taste verbraucht */
function ekKey(k) {
  const G = Game, em = G.em, enter = k === ' ' || k === 'Enter';
  if (G.view === 'map') {
    const n = G.ekN();
    if (k === 'ArrowRight' || k === 'ArrowDown') { G.sel = (G.sel + 1) % (n + 1); G.ekConfirm = false; Sound.sfx('move'); return true; }
    if (k === 'ArrowLeft' || k === 'ArrowUp') { G.sel = (G.sel + n) % (n + 1); G.ekConfirm = false; Sound.sfx('move'); return true; }
    if (enter) { G.enterStation(G.sel); return true; }
    if (k === 'b' || k === 'B') { ekAct({ ek: 'buch' }); return true; }
    return false;
  }
  if (G.view === 'buch' && G.buch) {
    if (enter) G.ekBookNext();
    else if (k === 'ArrowRight') G.ekBookTurn(1);
    else if (k === 'ArrowLeft') G.ekBookTurn(-1);
    else if (k === 'k' || k === 'K' || k === 'b' || k === 'B' || k === 'Escape') G.ekBookClose();
    return true;
  }
  if (G.view === 'ekfrage' && G.ekf) {                 // vier Tasten in zwei Reihen
    if (k === 'ArrowRight' || k === 'ArrowLeft') { G.ekf.sel ^= 1; Sound.sfx('move'); }
    else if (k === 'ArrowDown' || k === 'ArrowUp') { G.ekf.sel ^= 2; Sound.sfx('move'); }
    else if (enter) G.ekFrageWahl(G.ekf.sel);
    else if (k >= '1' && k <= '4' && k.length === 1) G.ekFrageWahl(+k - 1);
    return true;
  }
  if (G.view === 'emini' && em) {
    if (k === 'k' || k === 'K') { G.abortTask(); return true; }
    if (k === 'h' || k === 'H') { G.ekHint(); return true; }
    if (em.kind === 'fahrt') { if (enter && em.phase === 'aus') G.ekFahrtWeiter(); return true; }
    if (em.won || em.msg) { if (enter) ekAct({ ek: 'ok' }); return true; }
    if (em.kind === 'latte') {
      if (k === 'ArrowLeft') G.ekLatteMove(-1); else if (k === 'ArrowRight') G.ekLatteMove(1); else if (enter) G.ekLatteSet();
    } else if (em.kind === 'pendel') {
      if (em.phase === 'schieben' && (k === 'ArrowLeft' || k === 'ArrowRight')) G.ekHuntSchieb(k === 'ArrowLeft' ? -1 : 1);
      else if (k === 'ArrowLeft') G.ekPendelStep(em.sign); else if (k === 'ArrowRight') G.ekPendelStep(-em.sign);
      else if (enter) { if (G.ekPendelBereit(em)) G.ekPendelFrage(); else G.ekPendelStep(1); }
    } else if (em.kind === 'plan') {
      if (k === 'ArrowUp') G.ekPlanMove(1); else if (k === 'ArrowDown') G.ekPlanMove(-1); else if (enter || k === 'ArrowRight') G.ekPlanSet();
    } else if (em.kind === 'korb') {
      if (k === 'ArrowLeft') G.ekKorbTile(-1); else if (k === 'ArrowRight') G.ekKorbTile(1);
      else if (k === 'ArrowUp') G.ekKorbSlot(-1); else if (k === 'ArrowDown') G.ekKorbSlot(1);
      else if (enter) G.ekKorbPush();
    }
    return true;
  }
  return false;
}

K4ALT.landeplatz = BACKGROUNDS.wasserturm;
function hiBallon(cx, cy, r, ph) {       // Hülle mit Bahnen, nach unten zum Brenner hin schmaler; ph: leichtes Atmen der Hülle
  const BAHN = [[59, 2, 58, 10], [9, 8, 22, 56], [28, 27, 26, 25], [60, 70, 61, 62]];
  for (let y = -r; y <= Math.round(r * 1.25); y++) {
    const yy = y / r, w = yy <= 0.15 ? Math.sqrt(Math.max(0, 1 - yy * yy)) * r : r * Math.sqrt(1 - 0.0225) * (1 - 0.72 * Math.min(1, (yy - 0.15) / 1.1));
    const ww = Math.round(w * (1 + ph * 0.02));
    for (let x = -ww; x <= ww; x++) {
      const u = x / Math.max(1, ww), bahn = Math.floor((Math.asin(Math.max(-1, Math.min(1, u))) / Math.PI + 0.5) * 8) % 4;
      const hell = 0.75 - u * 0.35 - Math.max(0, yy) * 0.25 + (Math.abs(u) > 0.92 ? -0.25 : 0);
      H2.P(cx + x, cy + y, H2.M(BAHN[bahn], hell, cx + x, cy + y));
    }
  }
}

function hiFern(HOR, xa, turm, ohneHaeuser) {                 // Integralia am Horizont: Hügel, Häuser, Leuchtturm
  for (let x = xa; x < HW; x++) { const h = 16 + 14 * Math.sin((x - xa) / 64) + 6 * Math.sin(x / 15) + 2 * Math.sin(x / 4); for (let y = HOR - Math.round(h); y < HOR; y++) H2.P(x, y, (x + y) % 2 || h < 16 ? 19 : 20); }
  const hg = x => HOR - Math.round(16 + 14 * Math.sin((x - xa) / 64) + 6 * Math.sin(x / 15)) + 3;   // Häuser stehen auf dem Hügel (2026-11-17: sie schwebten)
  for (let k = 0; k < (ohneHaeuser ? 0 : 7); k++) { const x = xa + 16 + k * 26, hh = 6 + (k * 5) % 7, b = Math.max(hg(x), hg(x + 10)); H2.R(x, b - hh, 10, hh + 4, 18); for (let j = 0; j < 5; j++) H2.R(x - 1 + j, b - hh - 1 - j, 12 - 2 * j, 1, 18); if (k % 2) H2.P(x + 4, b - hh + 3, 22); }

   x, y: Mitte der Füße. Platz je Szene in TIERE; die Szenenfunktionen werden umwickelt, ihre Eigenschaften bleiben.

function loKatze(x, y, t, sp) {
  const P = (dx, dy, c) => Screen.px(Math.round(sp ? x - dx : x + dx), Math.round(y + dy), c);
  const R = (dx, dy, w, h, c) => { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) P(dx + i, dy + j, c); };
  const w = Math.round(Math.sin(t * 2.2) * 1.4);
  for (let k = 0; k < 6; k++) P(5 + (k > 2 ? w : 0), -2 - k, 0);                   // Schwanz, die Spitze wedelt
  P(4, -1, 0);
  R(-3, -5, 8, 5, 0); R(-2, -6, 6, 1, 0);                                           // Körper
  R(-6, -10, 5, 5, 0); P(-6, -11, 0); P(-2, -11, 0);                                // Kopf, Ohren
  R(-5, -5, 3, 3, 63); P(-4, -2, 63);                                               // weißer Latz
  P(-4, 0, 63); P(-1, 0, 63); P(2, 0, 0); P(4, 0, 0);                               // Pfoten
  if ((t % 5.3) < 0.15) { P(-5, -8, 39); P(-3, -8, 39); } else { P(-5, -8, 57); P(-3, -8, 57); }   // Augen, blinzelt

function loEule(x, y, t, sp) {

  const dreh = (t % 7) > 5.6 ? 1 : 0;                                               // dreht ab und zu den Kopf
  R(-3, -9, 7, 9, HOLZ[3]); R(-2, -10, 5, 1, HOLZ[3]); P(-3, -10, HOLZ[2]); P(3, -10, HOLZ[2]); P(-3, -11, HOLZ[2]); P(3, -11, HOLZ[2]);   // Körper, Federohren
  R(-3, -5, 1, 5, HOLZ[2]); R(3, -5, 1, 5, HOLZ[2]);                                 // Flügel
  R(-2, -4, 5, 4, HOLZ[4]); P(-1, -3, HOLZ[2]); P(1, -2, HOLZ[2]);                   // Bauch, Tupfen
  R(-2 + dreh, -9, 5, 4, HOLZ[5]);                                                  // Gesicht
  if ((t % 4.1) < 0.18) { P(-1 + dreh, -8, HOLZ[2]); P(1 + dreh, -8, HOLZ[2]); } else { P(-1 + dreh, -8, YELLOW); P(1 + dreh, -8, YELLOW); }
  P(dreh, -7, ORANGE);                                                              // Schnabel

}
function hiEule(x, y, t, sp) {
  const R = (dx, dy, w, h, c) => H2.R(sp ? x - dx - w + 1 : x + dx, y + dy, w, h, c);
  const dreh = (t % 7) > 5.6 ? 2 : 0;
  R(-8, -22, 16, 22, 34); R(-6, -24, 12, 2, 34); R(-8, -27, 3, 5, 33); R(5, -27, 3, 5, 33);   // Körper, Federohren
  R(-9, -14, 3, 12, 33); R(6, -14, 3, 12, 33);                                      // Flügel
  R(-5, -10, 10, 9, 36); for (const [a, b] of [[-3, -8], [1, -7], [-1, -4], [3, -4]]) R(a, b, 2, 1, 34);   // Bauch mit Tupfen
  R(-6 + dreh, -21, 12, 9, 37); R(-5 + dreh, -22, 4, 1, 37); R(1 + dreh, -22, 4, 1, 37);   // Gesichtsschleier
  if ((t % 4.1) < 0.18) { R(-4 + dreh, -17, 4, 1, 34); R(1 + dreh, -17, 4, 1, 34); }
  else { R(-4 + dreh, -19, 4, 4, 57); R(1 + dreh, -19, 4, 4, 57); R(-3 + dreh, -18, 2, 2, 0); R(2 + dreh, -18, 2, 2, 0); R(-3 + dreh, -19, 1, 1, 63); R(2 + dreh, -19, 1, 1, 63); }
  R(-1 + dreh, -15, 2, 3, 22);                                                      // Schnabel
  R(-4, 0, 3, 1, 22); R(2, 0, 3, 1, 22);                                            // Füße
}

/* ===== Zurück, Bildschirmcode und Fußzeile (seit 2026-11-19, Wunsch von Matthias) =====

   Z (oder Tippen auf „Z zurück" in der Fußzeile):
   - immer: in einem Gespräch eine Seite bzw. eine Szene zurück (nur Text, ändert nichts am Spielstand);
   - im Testmodus: auf jeden früheren Bildschirm zurück (Abbild des ganzen Spielzustands beim Betreten).
     Im normalen Spiel nicht, sonst ließen sich falsche Antworten ungeschehen machen.

   Testmodus: Adresse mit ?test (kapitel3.html?test, geht auch als Datei) oder localStorage fab.test = 1.
   Dann steht rechts unten ein kleiner Bildschirmcode, z. B. „K3 S47.2" = Kapitel 3, Szene 47, Seite 2.
   Szenennummern zählen alle Szenen des Kapitels in der Reihenfolge der Inhaltsdatei (`node szenen.js 3`).
   Abschalten: TESTMODUS unten auf false setzen oder ?test weglassen.

   Fußzeile (Kapitel mit fussZeile: true, zuerst K3): links fest „K Karte  Q Pause  Z zurück",
   rechts im Wechsel der Hinweis des Bildschirms und ein Tipp aus fussTipps. */

const TESTMODUS = (() => { try { return /[?&]test\b/.test(location.search) || localStorage.getItem('fab.test') === '1'; } catch (e) { return false; } })();

/* ---- Szenennummern ---- */
const SZ = { nr: null, text: null, inhalt: null };
function szAufbau() {
  SZ.nr = new WeakMap(); SZ.text = new Map(); SZ.inhalt = new WeakSet();
  let n = 0;
  const lauf = v => {
    if (!v || typeof v !== 'object' || SZ.inhalt.has(v)) return;
    SZ.inhalt.add(v);
    if (!Array.isArray(v) && typeof v.text === 'string' && (v.bg || v.speaker || v.music)) {
      n++; SZ.nr.set(v, n); if (!SZ.text.has(v.text)) SZ.text.set(v.text, n);
    }
    for (const k in v) lauf(v[k]);
  };
  lauf(Game.chapter);
}
function szNr(sz) {
  if (!sz) return '?';
  if (!SZ.nr) szAufbau();
  return SZ.nr.get(sz) || SZ.text.get(sz.text) || ('?' + (sz.bg || ''));
}

/* ---- Bildschirmcode: kurz zum Anzeigen; Signatur: bestimmt, wann ein neuer Bildschirm beginnt ---- */
function bildCode() {
  const G = Game;
  if (G.mode !== 'play') return G.mode;
  const st = G.cur >= 0 && G.stations[G.cur];
  switch (G.view) {
    case 'talk': return 'S' + szNr(G.talk && G.talk.list[G.talk.i]) + (G.page ? '.' + (G.page + 1) : '');
    case 'walk': return 'W' + (G.walk ? G.walk.said : 0) + (G.walk && G.walk.talking ? 's' : '');
    case 'map': return 'M' + G.sel;
    case 'task': case 'mini': return 'A' + G.cur + '-' + (st ? st.ti : 0) + (G.taskPhase ? G.taskPhase[0] : '');
    case 'emini': return 'E' + G.cur + (G.em && G.em.meister ? 'M' : '') + (G.em && G.em.phase ? G.em.phase[0] : '') + (G.em && (G.em.won || G.em.msg) ? '!' : '');
    case 'ekfrage': return 'F' + G.cur;
    case 'buch': return 'B' + (G.buch ? G.buch.page + '.' + G.buch.sub : '');
    case 'gate': return 'T' + G.gateIx + '-' + (G.gate ? G.gate.i : 0) + (G.gate && G.gate.phase === 'fb' ? 'f' : '');
    case 'boss': return 'X' + (G.boss ? G.boss.q : 0) + (G.boss && G.boss.phase !== 'ask' ? G.boss.phase[0] : '');
    case 'gabe': return 'G' + (G.gabe ? G.gabe.st : '');
  }
  return G.view;
}

/* ---- Abbild des Spielzustands (nur Testmodus) ---- */
const ZR = { stapel: [], sig: '' };
function zKopie(v, memo) {
  if (v === null || typeof v !== 'object') return v;
  if (SZ.inhalt && SZ.inhalt.has(v)) return v;                   // Inhalt des Kapitels: nur verweisen
  if (memo.has(v)) return memo.get(v);
  if (Array.isArray(v)) { const a = []; memo.set(v, a); for (const x of v) a.push(zKopie(x, memo)); return a; }
  const p = Object.getPrototypeOf(v);
  if (p !== Object.prototype && p !== null) return v;            // Leinwand, Map, Audio …
  const o = {}; memo.set(v, o); for (const k in v) o[k] = zKopie(v[k], memo); return o;
}
function zAbbild() {
  const s = {}, memo = new Map();
  for (const k of Object.keys(Game)) if (k !== 'chapter' && typeof Game[k] !== 'function') s[k] = zKopie(Game[k], memo);
  return { s, musik: Sound.song ? Sound.song.name : null };
}
function zHerstellen(a) {
  const memo = new Map();
  for (const k of Object.keys(Game)) if (k !== 'chapter' && typeof Game[k] !== 'function' && !(k in a.s)) Game[k] = undefined;
  for (const k in a.s) Game[k] = zKopie(a.s[k], memo);
  if (a.musik && (!Sound.song || Sound.song.name !== a.musik)) Sound.play(a.musik);
}

/* jedes Bild: beginnt ein neuer Bildschirm, im Testmodus das Abbild merken */
function zPruefen() {
  if (Game.mode !== 'play') { if (Game.mode !== 'end') { ZR.stapel = []; ZR.sig = ''; } return; }
  if (!SZ.nr) szAufbau();
  const sig = bildCode();
  if (sig === ZR.sig) return;
  ZR.sig = sig;
  if (TESTMODUS) { ZR.stapel.push(zAbbild()); if (ZR.stapel.length > 80) ZR.stapel.shift(); }
}

function zMeldung(txt) { Game.msg = txt; Game.msgT = 1.6; Game.msgCol = LTGREY; }

/* Z: eine Stufe zurück. true, wenn die Taste verbraucht ist */
function zurueck() {
  const G = Game;
  if (G.mode !== 'play') return false;
  if (TESTMODUS) {
    if (ZR.stapel.length < 2) { zMeldung('Weiter zurück geht nicht.'); return true; }
    ZR.stapel.pop();
    zHerstellen(ZR.stapel[ZR.stapel.length - 1]);
    ZR.sig = bildCode(); Sound.sfx('move');
    return true;
  }
  if (G.view === 'talk' && G.talk) {                             // ohne Testmodus: nur im Gespräch zurückblättern
    if (G.page > 0) G.page--;
    else if (G.talk.i > 0) { G.talk.i--; G.page = Math.max(0, talkPages(G.talk.list[G.talk.i]).length - 1); G.talkSel = 0; }
    else { zMeldung('Weiter zurück geht nicht.'); return true; }
    G.typing = false; G.typed = 1e9; Sound.sfx('move');
    return true;
  }
  zMeldung('Zurück geht nur im Gespräch.');
  return true;
}
