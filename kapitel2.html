/* ============================================================
   KERN: Bildschirm, Palette, Zeichenausgabe, Eingabe
   Logische Auflösung 320x200 Pixel, 40x25 Zeichen a 8x8.
   ============================================================ */

const PAL = ['#000000','#ffffff','#9f4e44','#6abfc6','#a057a3','#5cab5e','#50459b','#c9d487',
             '#a1683c','#6d5412','#cb7e75','#626262','#898989','#9ae29b','#887ecb','#adadad'];
const BLACK=0, WHITE=1, RED=2, CYAN=3, PURPLE=4, GREEN=5, BLUE=6, YELLOW=7,
      ORANGE=8, BROWN=9, LTRED=10, DGREY=11, GREY=12, LTGREEN=13, LTBLUE=14, LTGREY=15;

const SW = 320, SH = 200, CW = 8, CH = 8, COLS = 40, ROWS = 25;
const INTERN = 3;   // interner Vergrößerungsfaktor des Zeichenpuffers

// Glyphen aus Hex entpacken
const glyph8 = {}, glyph5 = {};
for (const k in FONT8) {
  const a = []; for (let i = 0; i < 8; i++) a.push(parseInt(FONT8[k].substr(i*2,2),16));
  glyph8[k] = a;
}
for (const k in FONT5) {
  const a = []; for (let i = 0; i < 5; i++) a.push(parseInt(FONT5[k].substr(i*2,2),16));
  glyph5[k] = a;
}

const Screen = {
  buf: new Uint8Array(SW * SH),
  border: BLUE,
  bg: BLACK,
  canvas: null, ctx: null, img: null, scale: 1, ox: 0, oy: 0,

  init(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d', { alpha: false });
    this.ctx.imageSmoothingEnabled = false;
    this.resize();
    window.addEventListener('resize', () => this.resize());
  },

  resize() {
    // Der Zeichenpuffer hat immer 352x232 mal INTERN, harte Pixel.
    // Auf die Fenstergröße skaliert dann der Browser (image-rendering: pixelated).
    const wrap = document.getElementById('wrap');
    const availW = wrap.clientWidth, availH = wrap.clientHeight;
    const totW = 352, totH = 232;
    this.dpr = INTERN;
    this.scale = 1;
    if (this.canvas.width !== totW * INTERN) {
      this.canvas.width  = totW * INTERN;
      this.canvas.height = totH * INTERN;
      this.ctx = this.canvas.getContext('2d', { alpha: false });
      this.ctx.imageSmoothingEnabled = false;
    }
    const css = Math.min(availW / totW, availH / totH);
    this.css = css;
    this.canvas.style.width  = Math.floor(totW * css) + 'px';
    this.canvas.style.height = Math.floor(totH * css) + 'px';
    this.flush();
  },

  clear(c) { this.buf.fill(c === undefined ? this.bg : c); },

  px(x, y, c) {
    if (x < 0 || y < 0 || x >= SW || y >= SH) return;
    this.buf[y * SW + x] = c;
  },

  rect(x, y, w, h, c) {
    const x0 = Math.max(0, x|0), y0 = Math.max(0, y|0);
    const x1 = Math.min(SW, (x+w)|0), y1 = Math.min(SH, (y+h)|0);
    for (let yy = y0; yy < y1; yy++) {
      const row = yy * SW;
      for (let xx = x0; xx < x1; xx++) this.buf[row + xx] = c;
    }
  },

  frame(x, y, w, h, c) {
    this.rect(x, y, w, 1, c); this.rect(x, y+h-1, w, 1, c);
    this.rect(x, y, 1, h, c); this.rect(x+w-1, y, 1, h, c);
  },

  // Ein Zeichen an Pixelposition. bg<0 = transparent
  glyph(ch, px, py, fg, bg) {
    const g = glyph8[ch] || glyph8['?'];
    for (let r = 0; r < 8; r++) {
      const bits = g[r], yy = py + r;
      if (yy < 0 || yy >= SH) continue;
      const row = yy * SW;
      for (let cIdx = 0; cIdx < 8; cIdx++) {
        const on = (bits >> (7 - cIdx)) & 1;
        const xx = px + cIdx;
        if (xx < 0 || xx >= SW) continue;
        if (on) this.buf[row + xx] = fg;
        else if (bg !== undefined && bg >= 0) this.buf[row + xx] = bg;
      }
    }
  },

  glyph5(ch, px, py, fg) {
    const g = glyph5[ch]; if (!g) return;
    for (let r = 0; r < 5; r++) {
      const bits = g[r], yy = py + r;
      if (yy < 0 || yy >= SH) continue;
      const row = yy * SW;
      for (let cIdx = 0; cIdx < 5; cIdx++) {
        if ((bits >> (4 - cIdx)) & 1) {
          const xx = px + cIdx;
          if (xx >= 0 && xx < SW) this.buf[row + xx] = fg;
        }
      }
    }
  },

  // Text an Pixelposition
  textPx(s, px, py, fg, bg) {
    let x = px;
    for (const ch of s) { this.glyph(ch, x, py, fg, bg); x += 8; }
    return x;
  },

  // Text an Zeichenposition (Spalte/Zeile)
  text(s, col, row, fg, bg) { this.textPx(s, col * 8, row * 8, fg, bg); },

  textCentered(s, row, fg, bg) {
    const col = Math.max(0, Math.round((COLS - [...s].length) / 2));
    this.text(s, col, row, fg, bg);
  },

  flush() {
    const ctx = this.ctx, s = INTERN;
    ctx.fillStyle = PAL[this.border];
    ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
    if (!this.img || this.img.width !== SW) this.img = ctx.createImageData(SW, SH);
    const d = this.img.data;
    for (let i = 0, n = SW * SH; i < n; i++) {
      const hex = PAL[this.buf[i]];
      d[i*4]   = parseInt(hex.substr(1,2),16);
      d[i*4+1] = parseInt(hex.substr(3,2),16);
      d[i*4+2] = parseInt(hex.substr(5,2),16);
      d[i*4+3] = 255;
    }
    if (!this.tmp) { this.tmp = document.createElement('canvas'); this.tmp.width = SW; this.tmp.height = SH; }
    this.tmp.getContext('2d').putImageData(this.img, 0, 0);
    ctx.imageSmoothingEnabled = false;
    this.ox = 16 * s; this.oy = 16 * s;
    ctx.drawImage(this.tmp, 0, 0, SW, SH, this.ox, this.oy, SW * s, SH * s);
  },

  // Bildschirmkoordinaten eines Mausklicks in logische Pixel
  toLogical(clientX, clientY) {
    const r = this.canvas.getBoundingClientRect();
    const s = r.width / 352;
    return { x: (clientX - r.left) / s - 16, y: (clientY - r.top) / s - 16 };
  }
};

/* ---------------- Eingabe ---------------- */
const Input = {
  keys: {}, queue: [], hotspots: [], pointer: null,

  init(canvas) {
    window.addEventListener('keydown', e => {
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
      this.keys[e.key] = true;
      // Liegt der Fokus im versteckten Eingabefeld, kommt der Text über dessen input-Ereignis.
      const inField = (typeof hidden !== 'undefined') && hidden && document.activeElement === hidden;
      if (inField && e.key.length === 1) { Sound.unlock(); return; }
      if (inField && e.key === 'Backspace') { Sound.unlock(); return; }
      this.queue.push({ type: 'key', key: e.key });
      Sound.unlock();
    });
    window.addEventListener('keyup', e => { this.keys[e.key] = false; });
    const tap = (cx, cy) => {
      const p = Screen.toLogical(cx, cy);
      this.pointer = p;
      this.queue.push({ type: 'tap', x: p.x, y: p.y });
      Sound.unlock();
    };
    canvas.addEventListener('mousedown', e => {
      tap(e.clientX, e.clientY);
      if (typeof syncTap === 'function') syncTap(Screen.toLogical(e.clientX, e.clientY));
    });
    canvas.addEventListener('mousemove', e => { this.pointer = Screen.toLogical(e.clientX, e.clientY); });
    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      const t = e.changedTouches[0]; tap(t.clientX, t.clientY);
      if (typeof syncTap === 'function') syncTap(Screen.toLogical(t.clientX, t.clientY));
    }, { passive: false });
    canvas.addEventListener('touchmove', e => {
      const t = e.changedTouches[0];
      this.pointer = Screen.toLogical(t.clientX, t.clientY);
      this.queue.push({ type: 'drag', x: this.pointer.x, y: this.pointer.y });
      e.preventDefault();
    }, { passive: false });
    // iOS gibt Tastatur und Ton nur innerhalb der Geste frei - und Ton erst beim
    // Loslassen. Deshalb hier synchron nachfassen, nicht erst im naechsten Bild.
    canvas.addEventListener('touchend', e => {
      const t = e.changedTouches[0];
      if (t && typeof syncTap === 'function') syncTap(Screen.toLogical(t.clientX, t.clientY));
      Sound.unlock(); Sound.resume();
      this.queue.push({ type: 'release' });
    });
    canvas.addEventListener('mouseup', e => { this.queue.push({ type: 'release' }); });
  },

  poll() { const q = this.queue; this.queue = []; return q; }
};

/* --------- Textumbruch auf Zeichenbreite --------- */
/* Formel-Markup in reinem Text lesbar machen. Im Textfeld gibt es keinen
   Formelsatz - ohne diese Umsetzung stuende dort woertlich <<2*pi/B>>. */
function plainMath(s) {
  return s
    .replace(/<=/g, '\u2264').replace(/>=/g, '\u2265').replace(/!=/g, '\u2260')
    .replace(/<<([^<>]*?)\/([^<>]*?)>>/g, '$1/$2')
    .replace(/\^\{2\}/g, '²')
    .replace(/\^\{([^{}]*)\}/g, '^($1)')
    .replace(/_\{1\}/g, '₁').replace(/_\{2\}/g, '₂')
    .replace(/_\{([^{}]*)\}/g, '$1')
    .replace(/sqrt\{([^{}]*)\}/g, '\u221A($1)')
    .replace(/(^|[^A-Za-z\u00e4\u00f6\u00fc\u00c4\u00d6\u00dc\u00df])pi(?![A-Za-z\u00e4\u00f6\u00fc])/g, '$1\u03C0')
    .replace(/(\S)\*(\S)/g, '$1\u00B7$2')
    .replace(/(\S)\*(\S)/g, '$1\u00B7$2')
    .replace(/ \* /g, ' \u00B7 ');
}

function wrapText(s, width) {
  s = plainMath(String(s));
  // {name} wird ueberall durch den eingegebenen Vornamen ersetzt.
  if (typeof Game !== 'undefined' && Game && Game.name) s = s.replace(/\{name\}/g, Game.name);
  else s = s.replace(/\{name\}/g, 'du');
  // Punkte wie P(2 | 7) nie am senkrechten Strich umbrechen
  s = s.replace(/ \| /g, '\u00a0|\u00a0');
  const out = [];
  for (const para of s.split('\n')) {
    if (para === '') { out.push(''); continue; }
    let line = '';
    for (const word of para.split(' ')) {
      if (line === '') line = word;
      else if ([...line].length + 1 + [...word].length <= width) line += ' ' + word;
      else { out.push(line); line = word; }
    }
    if (line !== '') out.push(line);
  }
  return out.map(l => l.replace(/\u00a0/g, ' '));
}

/* ===== 15_rng.js ===== */
/* ============================================================
   ZUFALL UND ZAHLENFORMAT
   Der Zufall ist gesaet: aus derselben Saat entsteht immer dieselbe
   Aufgabe. Nur so laesst sich ein Spielstand spaeter exakt fortsetzen,
   und nur so kann der Pruefer vor dem Bauen alle erzeugbaren Varianten
   durchrechnen.
   ============================================================ */

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function RNG(seed) {
  const r = mulberry32(seed >>> 0);
  return {
    seed: seed >>> 0,
    f: r,
    int(lo, hi) { return lo + Math.floor(r() * (hi - lo + 1)); },
    pick(arr) { return arr[Math.floor(r() * arr.length)]; },
    // Mehrere verschiedene Elemente ziehen
    some(arr, n) {
      const c = arr.slice();
      for (let i = c.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [c[i], c[j]] = [c[j], c[i]]; }
      return c.slice(0, n);
    },
    shuffle(arr) {
      const c = arr.slice();
      for (let i = c.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [c[i], c[j]] = [c[j], c[i]]; }
      return c;
    },
    next() { return (r() * 4294967296) >>> 0; }
  };
}

/* ---- Zahlen in Schulnotation ---- */

// 1.8 -> "1,8" ; 12 -> "12" ; rundet stille Rechenreste weg
function z(v, dec) {
  const d = dec === undefined ? 3 : dec;
  let s = (Math.round(v * Math.pow(10, d)) / Math.pow(10, d)).toString();
  return s.replace('.', ',');
}

// Vorfaktor: 1 verschwindet, -1 wird zum Minus
function zf(v) {
  if (Math.abs(v - 1) < 1e-9) return '';
  if (Math.abs(v + 1) < 1e-9) return '-';
  return z(v) + '*';
}

// Summand mit Vorzeichen: 3.2 -> " + 3,2" ; -1.5 -> " - 1,5" ; 0 -> ""
function zs(v) {
  if (Math.abs(v) < 1e-9) return '';
  return (v > 0 ? ' + ' : ' - ') + z(Math.abs(v));
}

// Klammerinhalt t - C in Schulschreibweise
function zsub(varName, c) {
  if (Math.abs(c) < 1e-9) return varName;
  return varName + (c > 0 ? ' - ' : ' + ') + z(Math.abs(c));
}

// Vielfaches von pi als Bruch im Formel-Markup: pi/6, 2pi/3, pi, 2pi
function zpi(v) {
  const dens = [1, 2, 3, 4, 5, 6, 8, 10, 12];
  for (const d of dens) {
    const n = v * d / Math.PI;
    if (Math.abs(n - Math.round(n)) < 1e-6) {
      const nn = Math.round(n);
      if (nn === 0) return '0';
      const sign = nn < 0 ? '-' : '';
      const num = (Math.abs(nn) === 1 ? 'pi' : Math.abs(nn) + 'pi');
      return d === 1 ? sign + num : sign + '<<' + num + '/' + d + '>>';
    }
  }
  return z(v);
}

// Uhrzeit aus einer Stundenzahl: 7 -> "7:00 Uhr", 7.5 -> "7:30 Uhr"
function zuhr(h) {
  let hh = Math.floor(((h % 24) + 24) % 24);
  let mm = Math.round((h - Math.floor(h)) * 60);
  if (mm === 60) { mm = 0; hh = (hh + 1) % 24; }
  return hh + ':' + String(mm).padStart(2, '0') + ' Uhr';
}

/* ===== 20_formula.js ===== */
/* ============================================================
   FORMELSATZ AUF DEM PIXELRASTER
   Markup (an math-exam-docx angelehnt):
     <<a/b>>    Bruch          ^{..} Exponent      _{..} Index
     sqrt{..}   Wurzel         pi * <= >= != +- ~~ -> werden ersetzt
   Ausgabe: echte Pixelglyphen, keine Ersatzzeichen.
   ============================================================ */

const AXIS = 3;     // Höhe des Bruchstrichs über der Grundlinie
const RAISE = 5;    // Hochstellung
const DROP = 3;     // Tiefstellung

function fxPre(s) {
  return s
    .replace(/<=/g, '≤').replace(/>=/g, '≥').replace(/!=/g, '≠')
    .replace(/\+-/g, '±').replace(/~~/g, '≈').replace(/->/g, '→')
    .replace(/\*/g, '·').replace(/\binf\b/g, '∞')
    .replace(/(^|[^A-Za-z])pi($|[^A-Za-z])/g, '$1π$2')
    .replace(/(^|[^A-Za-z])pi($|[^A-Za-z])/g, '$1π$2');
}

/* ---- Boxen ---- */
function bChar(ch) {
  return { w: 8, asc: 7, desc: 1, kind: 'ch', ch };
}
function bMini(str) {
  return { w: str.length * 5 - (str.length ? 1 : 0) + 1, asc: 5, desc: 0, kind: 'mini', s: str };
}
function bRow(items) {
  let w = 0, asc = 0, desc = 0;
  for (const it of items) { w += it.w; asc = Math.max(asc, it.asc); desc = Math.max(desc, it.desc); }
  return { w, asc, desc, kind: 'row', items };
}
function bFrac(num, den) {
  const w = Math.max(num.w, den.w) + 4;
  const asc = AXIS + 2 + num.desc + num.asc;
  const desc = Math.max(0, 2 + den.asc + den.desc - AXIS);
  return { w, asc, desc, kind: 'frac', num, den };
}
function bSqrt(inner) {
  return { w: inner.w + 9, asc: inner.asc + 4, desc: inner.desc, kind: 'sqrt', inner };
}
function bSup(base, exp) {
  return { w: base.w + exp.w, asc: Math.max(base.asc, RAISE + exp.asc), desc: base.desc, kind: 'sup', base, exp };
}
function bSub(base, sub) {
  return { w: base.w + sub.w, asc: base.asc, desc: Math.max(base.desc, DROP + sub.asc), kind: 'sub', base, sub };
}
function bParen(open, inner) {
  // skalierende Klammer, wenn der Inhalt höher ist als eine Normalzeile
  const tall = (inner.asc + inner.desc) > 10;
  return { w: (tall ? 5 : 8), asc: tall ? inner.asc : 7, desc: tall ? inner.desc : 1,
           kind: 'paren', open, tall, h: inner.asc + inner.desc, ia: inner.asc };
}

/* ---- Parser ---- */
function fxParse(src) {
  const s = fxPre(src);
  let i = 0;

  function parseGroup(stopFn) {
    const items = [];
    while (i < s.length) {
      if (stopFn && stopFn()) break;
      const c = s[i];

      if (s.startsWith('<<', i)) {           // Bruch
        i += 2;
        let depth = 0, numSrc = '';
        while (i < s.length) {
          if (s.startsWith('<<', i)) { depth++; numSrc += '<<'; i += 2; continue; }
          if (s.startsWith('>>', i)) { depth--; numSrc += '>>'; i += 2; continue; }
          if (s[i] === '/' && depth === 0) { i++; break; }
          numSrc += s[i++];
        }
        let d2 = 0, denSrc = '';
        while (i < s.length) {
          if (s.startsWith('<<', i)) { d2++; denSrc += '<<'; i += 2; continue; }
          if (s.startsWith('>>', i)) { if (d2 === 0) { i += 2; break; } d2--; denSrc += '>>'; i += 2; continue; }
          denSrc += s[i++];
        }
        items.push(bFrac(fxParse(numSrc), fxParse(denSrc)));
        continue;
      }

      if (s.startsWith('sqrt', i)) {         // Wurzel
        i += 4;
        let inner = '';
        if (s[i] === '{') { i++; let d = 0;
          while (i < s.length) { if (s[i] === '{') d++; if (s[i] === '}') { if (!d) { i++; break; } d--; } inner += s[i++]; }
        }
        items.push(bSqrt(fxParse(inner)));
        continue;
      }

      if (c === '^' || c === '_') {          // Hoch-/Tiefstellung
        i++;
        let arg = '';
        if (s[i] === '{') { i++; let d = 0;
          while (i < s.length) { if (s[i] === '{') d++; if (s[i] === '}') { if (!d) { i++; break; } d--; } arg += s[i++]; }
        } else { arg = s[i++] || ''; }
        const base = items.length ? items.pop() : bRow([]);
        items.push(c === '^' ? bSup(base, bMini(arg)) : bSub(base, bMini(arg)));
        continue;
      }

      if (c === '(' || c === ')') {          // Klammern mit Höhenanpassung
        if (c === '(') {
          const start = i; i++;
          let d = 0, innerSrc = '';
          while (i < s.length) {
            if (s[i] === '(') d++;
            if (s[i] === ')') { if (!d) break; d--; }
            innerSrc += s[i++];
          }
          if (s[i] === ')') i++;
          const inner = fxParse(innerSrc);
          const tall = (inner.asc + inner.desc) > 10;
          if (tall) {
            items.push(bParen('(', inner));
            items.push(inner);
            items.push(bParen(')', inner));
          } else {
            items.push(bChar('(')); items.push(inner); items.push(bChar(')'));
          }
          continue;
        }
        i++; items.push(bChar(')')); continue;
      }

      items.push(bChar(c)); i++;
    }
    return bRow(items);
  }
  return parseGroup(null);
}

/* ---- Zeichnen ---- */
function fxDraw(box, x, base, col) {
  switch (box.kind) {
    case 'ch': Screen.glyph(box.ch, x, base - 7, col); break;
    case 'mini': {
      let xx = x;
      for (const ch of box.s) { Screen.glyph5(ch, xx, base - 5, col); xx += 5; }
      break;
    }
    case 'row': { let xx = x; for (const it of box.items) { fxDraw(it, xx, base, col); xx += it.w; } break; }
    case 'frac': {
      const cx = x + box.w / 2;
      const lineY = base - AXIS;
      Screen.rect(x + 1, lineY, box.w - 2, 1, col);
      fxDraw(box.num, Math.round(cx - box.num.w / 2), lineY - 1 - box.num.desc, col);
      fxDraw(box.den, Math.round(cx - box.den.w / 2), lineY + 2 + box.den.asc, col);
      break;
    }
    case 'sqrt': {
      const inner = box.inner;
      const topY = base - inner.asc - 3;
      const botY = base + inner.desc;
      // Haken
      Screen.px(x, botY - 4, col); Screen.px(x + 1, botY - 4, col);
      Screen.px(x + 1, botY - 3, col); Screen.px(x + 2, botY - 2, col);
      Screen.px(x + 2, botY - 1, col); Screen.px(x + 3, botY, col);
      for (let yy = topY; yy <= botY; yy++) {
        const t = (yy - topY) / Math.max(1, botY - topY);
        Screen.px(x + 4 + Math.round((1 - t) * 1), yy, col);
      }
      Screen.rect(x + 5, topY, inner.w + 3, 1, col);
      fxDraw(inner, x + 6, base, col);
      break;
    }
    case 'sup': fxDraw(box.base, x, base, col);
                fxDraw(box.exp, x + box.base.w, base - RAISE, col); break;
    case 'sub': fxDraw(box.base, x, base, col);
                fxDraw(box.sub, x + box.base.w, base + DROP + box.sub.asc - 5 + 5, col); break;
    case 'paren': {
      const top = base - box.asc, bot = base + box.desc;
      if (box.open === '(') {
        Screen.rect(x + 2, top + 1, 2, bot - top - 1, col);
        Screen.px(x + 3, top, col); Screen.px(x + 4, top, col);
        Screen.px(x + 3, bot, col); Screen.px(x + 4, bot, col);
      } else {
        Screen.rect(x + 1, top + 1, 2, bot - top - 1, col);
        Screen.px(x, top, col); Screen.px(x + 1, top, col);
        Screen.px(x, bot, col); Screen.px(x + 1, bot, col);
      }
      break;
    }
  }
}

function fxMeasure(src) { return fxParse(src); }

/* Formel zentriert in eine Bildschirmzeile setzen; gibt belegte Höhe zurück */
function drawFormulaCentered(src, yTop, col, leftPad) {
  const box = fxParse(src);
  const x = leftPad !== undefined ? leftPad : Math.round((SW - box.w) / 2);
  fxDraw(box, x, yTop + box.asc, col);
  return box.asc + box.desc;
}

function drawFormulaAt(src, x, yTop, col) {
  const box = fxParse(src);
  fxDraw(box, x, yTop + box.asc, col);
  return box;
}

/* ===== 30_sound.js ===== */
/* ============================================================
   KLANG v2 - vierstimmiger Tracker im Stil der Amiga-Zeit (ca. 1987).
   Gegenueber v1 neu: vier statt drei Stimmen, Vibrato mit Einschwingzeit,
   Portamento im Bass, Pulsweiten-Modulation im Lead, Echo-Send,
   weicherer Tiefpass, Percussion aus gefiltertem Rauschen mit
   Tonhoehenhuellkurve, laengere Songformen ueber eine Pattern-Reihenfolge
   und eine adaptive Mischung: beim Rechnen pausiert der Lead.
   Alle Melodien sind Eigenkompositionen.
   ============================================================ */

const Sound = {
  ctx: null, master: null, dry: null, echoIn: null,
  on: true, ready: false, pending: null,
  timer: null, song: null, rowIdx: 0, ordIdx: 0, nextTime: 0,
  waves: {}, layer: 'full', lastBass: null,

  unlock() {
    if (this.ready) return;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();

      this.master = this.ctx.createGain();
      this.master.gain.value = 0.20;

      // Weicher Ausgangsfilter - nimmt dem Rechteck die Schaerfe.
      const filt = this.ctx.createBiquadFilter();
      filt.type = 'lowpass'; filt.frequency.value = 2600; filt.Q.value = 0.6;

      // Etwas Hoehenglanz zurueck, damit es nicht dumpf wird.
      const shelf = this.ctx.createBiquadFilter();
      shelf.type = 'highshelf'; shelf.frequency.value = 3000; shelf.gain.value = 2.5;

      this.master.connect(filt); filt.connect(shelf); shelf.connect(this.ctx.destination);

      // Echo-Send: das Kennzeichen der MOD-Aera.
      this.echoIn = this.ctx.createGain(); this.echoIn.gain.value = 1;
      const dl = this.ctx.createDelay(1.0); dl.delayTime.value = 0.21;
      const fb = this.ctx.createGain(); fb.gain.value = 0.30;
      const dampen = this.ctx.createBiquadFilter();
      dampen.type = 'lowpass'; dampen.frequency.value = 1700;
      this.echoIn.connect(dl); dl.connect(dampen); dampen.connect(fb); fb.connect(dl);
      dampen.connect(filt);

      this.ready = true;
      if (this.pending) { const p = this.pending; this.pending = null; this.play(p); }
    } catch (e) { this.on = false; }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },

  /* iOS startet den AudioContext oft angehalten; bei jeder Geste nachschieben. */
  resume() {
    try { if (this.ctx && this.ctx.state !== 'running') this.ctx.resume(); } catch (e) {}
  },

  /* Mischung: 'full' im Dialog, auf der Karte und im Bosskampf,
     'soft' waehrend gerechnet wird - Lead und Schlagwerk schweigen. */
  setLayer(l) {
    if (this.layer === l) return;
    this.layer = l;
    if (this.master) {
      const t = this.ctx.currentTime;
      this.master.gain.cancelScheduledValues(t);
      this.master.gain.setTargetAtTime(l === 'soft' ? 0.12 : 0.20, t, 0.4);
    }
  },

  pulseWave(duty) {
    const key = 'p' + duty.toFixed(2);
    if (this.waves[key]) return this.waves[key];
    const n = 24, real = new Float32Array(n), imag = new Float32Array(n);
    for (let i = 1; i < n; i++) {
      // sanfte Obertonbedaempfung - das ist der Unterschied zum harten SID
      real[i] = (2 / (i * Math.PI)) * Math.sin(i * Math.PI * duty) * Math.pow(0.86, i - 1);
    }
    const w = this.ctx.createPeriodicWave(real, imag, { disableNormalization: false });
    this.waves[key] = w; return w;
  },

  freq(n) { return 440 * Math.pow(2, (n - 69) / 12); },

  /* Ein Ton. opts: wave, duty, vol, a/d/s/r, vib, glideFrom, echo, arp, pwm */
  note(n, t, dur, opts) {
    if (!this.ready || !this.on) return;
    const o = Object.assign({
      wave: 'pulse', duty: 0.35, vol: 0.4, a: 0.008, d: 0.09, s: 0.55, r: 0.10,
      vib: null, glideFrom: null, echo: 0, arp: null, pwm: 0
    }, opts || {});

    const osc = this.ctx.createOscillator();
    if (o.wave === 'pulse') osc.setPeriodicWave(this.pulseWave(o.duty));
    else osc.type = o.wave;

    const g = this.ctx.createGain();
    // Pro Stimme ein sanfter Filter - macht aus Rechteck etwas Floetenartiges.
    const vf = this.ctx.createBiquadFilter();
    vf.type = 'lowpass';
    vf.frequency.setValueAtTime(Math.min(9000, this.freq(n) * 7 + 400), t);
    vf.Q.value = 0.9;
    osc.connect(vf); vf.connect(g); g.connect(this.master);
    if (o.echo > 0) { const sg = this.ctx.createGain(); sg.gain.value = o.echo; g.connect(sg); sg.connect(this.echoIn); }

    const f = this.freq(n);
    if (o.glideFrom && Math.abs(o.glideFrom - n) > 0.1) {
      osc.frequency.setValueAtTime(this.freq(o.glideFrom), t);
      osc.frequency.exponentialRampToValueAtTime(f, t + Math.min(0.09, dur * 0.4));
    } else {
      osc.frequency.setValueAtTime(f, t);
    }

    if (o.arp) {
      const step = 0.035;
      for (let k = 0; k * step < dur; k++) osc.frequency.setValueAtTime(this.freq(n + o.arp[k % o.arp.length]), t + k * step);
    }

    // Vibrato setzt verzoegert ein - gehaltene Toene bekommen erst spaet Leben.
    if (o.vib) {
      const lfo = this.ctx.createOscillator(); lfo.frequency.value = o.vib.rate;
      const amt = this.ctx.createGain();
      amt.gain.setValueAtTime(0.0001, t);
      amt.gain.setValueAtTime(0.0001, t + (o.vib.delay || 0.15));
      amt.gain.linearRampToValueAtTime(f * o.vib.depth, t + (o.vib.delay || 0.15) + 0.12);
      lfo.connect(amt); amt.connect(osc.frequency);
      lfo.start(t); lfo.stop(t + dur + 0.05);
    }

    // Pulsweiten-Modulation: ein zweiter Ton mit leicht anderer Weite,
    // minimal verstimmt - das schwebende Breite-Gefuehl der MOD-Leads.
    if (o.pwm > 0 && o.wave === 'pulse') {
      const o2 = this.ctx.createOscillator();
      o2.setPeriodicWave(this.pulseWave(Math.min(0.48, o.duty + 0.14)));
      o2.frequency.setValueAtTime(f * 1.004, t);
      const g2 = this.ctx.createGain(); g2.gain.value = o.pwm;
      o2.connect(g2); g2.connect(vf);
      o2.start(t); o2.stop(t + dur + 0.02);
    }

    const peak = o.vol;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + o.a);
    g.gain.linearRampToValueAtTime(peak * o.s, t + o.a + o.d);
    g.gain.setValueAtTime(peak * o.s, t + Math.max(o.a + o.d, dur - o.r));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.start(t); osc.stop(t + dur + 0.03);
  },

  noise(t, dur, vol, freq, type, q) {
    if (!this.ready || !this.on) return;
    const len = Math.max(1, Math.floor(this.ctx.sampleRate * dur));
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 1.6);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const bp = this.ctx.createBiquadFilter();
    bp.type = type || 'bandpass';
    bp.frequency.value = freq || 1200; bp.Q.value = q === undefined ? 1.2 : q;
    const g = this.ctx.createGain(); g.gain.value = vol || 0.3;
    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t);
  },

  /* ---- Schlagwerk: gerendert statt geklickt ---- */
  drum(kind, t) {
    if (!this.ready || !this.on) return;
    if (kind === 'k') {                       // Bassdrum mit Tonhoehenabfall
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(128, t);
      o.frequency.exponentialRampToValueAtTime(42, t + 0.11);
      g.gain.setValueAtTime(0.5, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
      o.connect(g); g.connect(this.master); o.start(t); o.stop(t + 0.18);
      this.noise(t, 0.03, 0.12, 900, 'lowpass', 0.7);
    } else if (kind === 's') {                // Snare: Rauschen plus Koerper
      this.noise(t, 0.14, 0.26, 1900, 'bandpass', 0.8);
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = 'triangle'; o.frequency.setValueAtTime(190, t);
      g.gain.setValueAtTime(0.18, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
      o.connect(g); g.connect(this.master); o.start(t); o.stop(t + 0.1);
    } else if (kind === 'h') {                // Hihat
      this.noise(t, 0.035, 0.09, 8000, 'highpass', 0.7);
    }
  },

  /* ---- Effekte ---- */
  sfx(name) {
    if (!this.ready || !this.on) return;
    const t = this.ctx.currentTime;
    const L = { wave: 'pulse', duty: 0.35, echo: 0.2 };
    switch (name) {
      case 'tick':  this.note(84, t, 0.035, { duty: 0.5, vol: 0.10, d: 0.02, s: 0.2 }); break;
      case 'move':  this.note(76, t, 0.05, { duty: 0.2, vol: 0.16, d: 0.03, s: 0.3 }); break;
      case 'right': [72, 76, 79, 84].forEach((n, i) => this.note(n, t + i * 0.055, 0.16, Object.assign({ vol: 0.36 }, L))); break;
      case 'wrong': [61, 58, 54].forEach((n, i) => this.note(n, t + i * 0.1, 0.2, { wave: 'sawtooth', vol: 0.3, echo: 0.25 })); break;
      case 'hint':  [79, 84, 88].forEach((n, i) => this.note(n, t + i * 0.06, 0.14, { duty: 0.5, vol: 0.22, echo: 0.35 })); break;
      case 'hit':   this.drum('s', t); this.note(45, t, 0.16, { wave: 'sawtooth', vol: 0.34 }); break;
      case 'damage':this.drum('k', t); this.noise(t, 0.35, 0.3, 380, 'lowpass', 0.8);
                    this.note(38, t, 0.3, { wave: 'sawtooth', vol: 0.38 }); break;
      case 'magic': for (let i = 0; i < 10; i++) this.note(58 + i * 3, t + i * 0.032, 0.11, { duty: 0.2, vol: 0.16, echo: 0.4 }); break;
      case 'save':  [67, 72, 76].forEach((n, i) => this.note(n, t + i * 0.08, 0.24, { duty: 0.35, vol: 0.26, echo: 0.3 })); break;
      case 'lock':  [55, 51, 48].forEach((n, i) => this.note(n, t + i * 0.12, 0.3, { wave: 'triangle', vol: 0.3, echo: 0.4 })); break;
      case 'unlock':[60, 64, 67, 72].forEach((n, i) => this.note(n, t + i * 0.07, 0.2, { duty: 0.3, vol: 0.26, echo: 0.35 })); break;
      case 'gate':  this.noise(t, 0.5, 0.2, 260, 'lowpass', 0.9); this.note(36, t, 0.5, { wave: 'sawtooth', vol: 0.3 }); break;
    }
  },

  /* ---- Abspieler ---- */
  play(name) {
    if (!this.ready) { this.pending = name; return; }
    if (this.song && this.song.name === name) return;
    this.stop();
    const s = SONGS[name]; if (!s) return;
    this.song = { name, data: s };
    this.rowIdx = 0; this.ordIdx = 0; this.lastBass = null;
    this.nextTime = this.ctx.currentTime + 0.06;
    this.timer = setInterval(() => this.pump(), 40);
    this.pump();
  },

  stop() {
    if (this.timer) clearInterval(this.timer);
    this.timer = null; this.song = null;
  },

  pump() {
    if (!this.song || !this.on || !this.ready) return;
    const s = this.song.data, rowDur = 60 / s.bpm / s.div;
    const soft = this.layer === 'soft';
    const I = s.instr || {};
    while (this.nextTime < this.ctx.currentTime + 0.35) {
      const patName = s.order[this.ordIdx % s.order.length];
      const pat = s.patterns[patName];
      const row = pat[this.rowIdx % pat.length];
      const t = this.nextTime;

      // Stimme 1: Lead - schweigt in der weichen Mischung
      if (row[0] > 0 && !soft) {
        this.note(row[0] + (s.transpose || 0), t, rowDur * (s.leadLen || 1.7),
          Object.assign({ duty: 0.35, vol: 0.30, echo: 0.28, pwm: 0.35,
                          vib: { rate: 5.2, depth: 0.007, delay: 0.16 } }, I.lead || {}));
      }
      // Stimme 2: Bass - mit Portamento zwischen benachbarten Toenen
      if (row[1] > 0) {
        const n = row[1] + (s.transpose || 0);
        this.note(n, t, rowDur * 0.92,
          Object.assign({ wave: 'triangle', vol: soft ? 0.30 : 0.34, a: 0.006, d: 0.12, s: 0.45, r: 0.06,
                          glideFrom: (s.glide && this.lastBass) ? this.lastBass : null }, I.bass || {}));
        this.lastBass = n;
      }
      // Stimme 3: Flaeche bzw. Arpeggio
      if (row[2] > 0) {
        this.note(row[2] + (s.transpose || 0), t, rowDur * (s.padLen || 1.9),
          Object.assign({ duty: 0.5, vol: soft ? 0.09 : 0.13, a: 0.12, d: 0.25, s: 0.7, r: 0.3,
                          echo: 0.4, arp: s.arp || null }, I.pad || {}));
      }
      // Stimme 4: Gegenstimme
      if (row[3] > 0 && !soft) {
        this.note(row[3] + (s.transpose || 0), t, rowDur * 1.2,
          Object.assign({ duty: 0.2, vol: 0.14, a: 0.01, d: 0.1, s: 0.4, r: 0.1, echo: 0.3 }, I.counter || {}));
      }
      // Schlagwerk
      if (s.perc && !soft) {
        const p = s.perc[patName] || s.perc.A;
        if (p) { const k = p[this.rowIdx % p.length]; if (k && k !== '.') this.drum(k, t); }
      }

      this.nextTime += rowDur;
      this.rowIdx++;
      if (this.rowIdx % pat.length === 0) { this.ordIdx++; this.rowIdx = 0; }
    }
  }
};

/* ===== 40_engine.js ===== */
/* ============================================================
   SPIELKERN v2.2
   Ablauf: Vorspann -> Torwaechter -> Karte mit Stationen in freier
   Reihenfolge -> Bosskampf -> Abspann.
   Seit Kapitel 2 kann ein Kapitel mehrere Tore haben (gates statt gate):
   hinter jedem Tor liegt eine Insel mit eigenen Stationen (station.island).
   Sind alle Stationen einer Insel geloest, kommt das naechste Tor. Ein Tor
   mit retry: true schickt bei Misserfolg in eine neue Fragerunde statt
   ans Kapitelende.
   Seit v2.3 kann jede Insel ihren eigenen Bösewicht haben (gates[i].villain:
   dreht an den Zahlen, hat eigene Schreck-/Hohnzeilen) und einen eigenen
   Endgegner (gates[i].boss), der nach der letzten Station der Insel kommt.
   Aufgaben werden aus Generatoren erzeugt, die Antwortreihenfolge wird
   gemischt, und wer danebenliegt, bekommt nach dem Tipp dieselbe Aufgabe
   mit neuen Zahlen. Dreimal daneben sperrt die Station, bis anderswo
   etwas geloest wurde.
   ============================================================ */

const ST_OPEN = 0, ST_LOCKED = 1, ST_DONE = 2;

const Game = {
  mode: 'boot',          // boot|title|help|name|teacher|play|end
  view: 'talk',          // innerhalb play: talk|gate|map|task|mini|boss
  t: 0,
  name: '', nameBuf: '',
  score: 0, right: 0, wrong: 0, hintsUsed: 0, lives: 3,
  startedAt: 0,
  chapter: null, chapterId: 1,
  seed: 1,

  talk: null,            // { list, i, then }
  gate: null,            // { i, right, phase, pick, qs }
  stations: [],          // [{ state, ti, seed, tries, hints, lockAt, seen }]
  cur: -1,
  task: null, taskPhase: 'ask', pick: -1,
  mini: null,
  boss: null,
  lockCounter: 0,
  endStatus: 1,

  msg: null, msgT: 0, msgCol: 7,
  typed: 0, typing: false, page: 0, sel: 0,
  codeBuf: '', codeResult: null, code: '',

  /* ---------------- Start und Grundzustand ---------------- */
  start(chapter) {
    this.chapter = chapter;
    this.chapterId = chapter.id;
    this.mode = 'title';
    this.startedAt = Date.now();
    Sound.setLayer('full');
    Sound.play('title');
  },

  reset() {
    this.score = 0; this.right = 0; this.wrong = 0; this.hintsUsed = 0;
    this.lives = 3; this.startedAt = Date.now();
    this.seed = (Date.now() ^ 0x9e3779b9) >>> 0;
    this.stations = this.chapter.stations.map(() => ({
      state: ST_OPEN, ti: 0, seed: this.nextSeed(), tries: 0, hints: 0, lockAt: 0, seen: false
    }));
    this.cur = -1; this.task = null; this.mini = null; this.boss = null;
    this.gate = null; this.lockCounter = 0; this.endStatus = 1;
    this.talk = null; this.taskPhase = 'ask'; this.pick = -1;
    this.walk = null; this.gatePassed = false;
    this.gateIx = 0; this.island = 0; this.gatesPassed = 0; this.gateScored = [];
    this.bossDef = null; this.bossIsland = -1; this.islandBossDone = [];
  },

  /* Bösewicht der aktuellen Insel (oder null: dann F'Abiturio aus dem Kapitel) */
  villain() { const g = this.gates()[this.island]; return (g && g.villain) || null; },

  /* ---------------- Tore und Inseln ---------------- */
  gates() { return this.chapter.gates || [this.chapter.gate]; },
  curGate() { return this.gates()[this.gateIx] || this.gates()[0]; },
  onIsland(i) { return (this.chapter.stations[i].island || 0) === this.island; },
  islandIdx() { return this.chapter.stations.map((_, i) => i).filter(i => this.onIsland(i)); },
  islandDone() { return this.islandIdx().every(i => this.stations[i].state === ST_DONE); },
  saveKey() { return 'fab.save.k' + this.chapterId; },

  /* Insel fertig: naechstes Tor oder Bosskampf */
  nextStage() {
    // Erst der Endgegner der Insel, falls es einen gibt
    const ib = this.gates()[this.island] && this.gates()[this.island].boss;
    if (ib && !this.islandBossDone[this.island]) {
      Sound.setLayer('full');
      this.playTalk(ib.intro, 'islandBoss');
      this.save();
      return;
    }
    if (this.stations.every(s => s.state === ST_DONE) || this.gateIx + 1 >= this.gates().length) { this.toBoss(); return; }
    this.gateIx = this.island + 1;
    Sound.setLayer('full');
    this.playTalk(this.curGate().intro, 'gate');
    this.save();
  },

  nextSeed() { this.seed = (Math.imul(this.seed, 1664525) + 1013904223) >>> 0; return this.seed; },

  minutes() { return Math.min(511, Math.round((Date.now() - this.startedAt) / 60000)); },

  flash(text, col) { this.msg = text; this.msgCol = col === undefined ? YELLOW : col; this.msgT = 2.0; },

  /* ---------------- Dialogstrecken ---------------- */
  playTalk(list, then) {
    if (!list || !list.length) { this.afterTalk(then); return; }
    this.talk = { list, i: 0, then };
    this.view = 'talk';
    this.typed = 0; this.typing = true; this.page = 0;
    const s = list[0];
    Sound.setLayer('full');
    if (s.music) Sound.play(s.music);
  },

  talkAdvance() {
    const T = this.talk;
    T.i++;
    if (T.i >= T.list.length) { const then = T.then; this.talk = null; this.afterTalk(then); return; }
    this.typed = 0; this.typing = true; this.page = 0;
    const s = T.list[T.i];
    if (s.music) Sound.play(s.music);
  },

  afterTalk(then) {
    switch (then) {
      case 'walk':      this.startWalk(); break;
      case 'gate':      this.startGate(); break;
      case 'gatePass':  this.gatePassed = true; this.gatesPassed = this.gateIx + 1;
                        this.island = this.gateIx; this.gotoMap(true); break;
      case 'none':      break;
      case 'gateFail':  if (this.curGate().retry) this.startGate(); else this.finish(3); break;
      case 'map':       this.gotoMap(false); break;
      case 'stationIn': this.startTask(); break;
      case 'stationOut':this.finishStation(); break;
      case 'locked':    this.afterLock(); break;
      case 'boss':      this.beginBoss(); break;
      case 'islandBoss': this.beginBoss(this.island); break;
      case 'islandBossDone': this.nextStage(); break;
      case 'outro':     this.finish(1); break;
      case 'partial':   this.finish(2); break;
      default:          this.gotoMap(false);
    }
    this.save();
  },

  /* ---------------- Der Weg nach Sinusia ----------------
     Ein kurzes Stueck zu Fuss: Taste halten oder antippen, die Landschaft
     zieht vorbei, unterwegs redet Mathematthias, am Ende steht das Stadttor. */
  startWalk() {
    const W = this.chapter.walk || { length: 200 };
    this.walk = { x: 0, goal: W.length || 200, burst: 0, go: false, step: 0, arrived: false,
                  said: 0, talking: null };
    this.view = 'walk';
    Sound.setLayer('full'); Sound.play(W.music || 'field');
    this.save();
  },

  walkUpdate(dt) {
    const w = this.walk;
    if (!w || w.arrived) return;
    // Erreicht die Figur eine Stelle, an der jemand etwas sagt, bleibt sie
    // stehen, bis weitergeklickt wird - sonst rauscht der Text vorbei.
    const lines = (this.chapter.walk && this.chapter.walk.lines) || [];
    if (w.talking) return;
    if (w.said < lines.length && w.x >= lines[w.said].at) {
      w.talking = lines[w.said]; w.go = false; w.burst = 0; w.typed = 0;
      return;
    }
    const moving = w.go || w.burst > 0;
    w.burst = Math.max(0, w.burst - dt);
    if (moving) { w.x += 42 * dt; w.step += dt; }
    if (w.x >= w.goal) {
      w.x = w.goal; w.arrived = true;
      Sound.sfx('gate');
      this.gateIx = 0;
      this.playTalk(this.curGate().intro, 'gate');
    }
  },

  walkContinue() {
    const w = this.walk;
    if (!w || !w.talking) return false;
    if (w.typed < w.talking.text.length) { w.typed = 1e9; return true; }   // erst fertig tippen
    w.talking = null; w.said++;
    return true;
  },

  /* ---------------- Torwaechter ---------------- */
  startGate() {
    const g = this.curGate();
    const R = RNG(this.nextSeed());
    const qs = R.some(g.questions, Math.min(g.ask || 5, g.questions.length))
                .map(q => { const o = Object.assign({}, q); o.options = R.shuffle(q.options); return o; });
    this.gate = { i: 0, right: 0, phase: 'ask', pick: -1, qs };
    this.view = 'gate';
    this.sel = 0;
    Sound.play('gate'); Sound.setLayer('soft');
    this.save();
  },

  gateAnswer(i) {
    const G = this.gate;
    if (G.phase !== 'ask') return;
    G.pick = i; G.phase = 'fb';
    const ok = !!G.qs[G.i].options[i].ok;
    G.ok = ok;
    if (ok) {
      G.right++; this.right++; Sound.sfx('right');
      // Punkte gibt es hoechstens fuer need richtige je Tor - auch ueber
      // mehrere Fragerunden hinweg, sonst wuerde Durchfallen belohnt.
      const g = this.curGate(), pts = g.pts || 10, cap = this.gateNeed() * pts;
      const had = this.gateScored[this.gateIx] || 0;
      if (had < cap) { this.score += pts; this.gateScored[this.gateIx] = had + pts; }
      this.fbLine = pickLine(g.praise, 'Der Wächter nickt.');
    }
    else { this.wrong++; Sound.sfx('wrong'); }
  },

  gateNeed() { return this.curGate().need || Math.floor(this.gate.qs.length / 2) + 1; },

  gateNext() {
    const G = this.gate, need = this.gateNeed();
    G.i++; G.phase = 'ask'; G.pick = -1; this.sel = 0;
    const left = G.qs.length - G.i;
    const wrongs = G.i - G.right;
    const maxWrong = this.curGate().maxWrong || (G.qs.length - need + 1);
    const passed = G.right >= need;
    const hopeless = wrongs >= maxWrong || G.right + left < need;
    if (passed || hopeless || G.i >= G.qs.length) {
      Sound.setLayer('full');
      if (passed) this.playTalk(this.curGate().pass, 'gatePass');
      else this.playTalk(this.curGate().fail, 'gateFail');
    }
    this.save();
  },

  /* ---------------- Karte ---------------- */
  gotoMap(first) {
    this.view = 'map';
    this.cur = -1; this.task = null; this.mini = null;
    const idx = this.islandIdx();
    this.sel = idx.find(i => this.stations[i].state === ST_OPEN);
    if (this.sel === undefined) this.sel = idx[0];
    Sound.setLayer('full');
    Sound.play('field');
    if (this.islandDone()) { this.nextStage(); return; }
    this.save();
  },

  openStations() { return this.islandIdx().filter(i => this.stations[i].state === ST_OPEN).length; },

  enterStation(i) {
    const st = this.stations[i];
    if (!st || st.state !== ST_OPEN || !this.onIsland(i)) { Sound.sfx('wrong'); return; }
    this.cur = i;
    this.view = 'task';
    const sd = this.chapter.stations[i];
    if (!st.seen) { st.seen = true; this.playTalk(sd.intro, 'stationIn'); }
    else this.startTask();
  },

  /* ---------------- Aufgaben ---------------- */
  startTask() {
    const st = this.stations[this.cur], sd = this.chapter.stations[this.cur];
    const def = sd.tasks[st.ti];
    this.task = buildTask(def, st.seed);
    this.taskPhase = 'ask'; this.pick = -1; this.sel = 0;
    if (this.task.kind === 'mini') {
      this.view = 'mini';
      this.mini = { sel: 0, checked: false, ok: false };
      for (const k of miniKeys(this.task)) this.mini[k] = this.task['start' + k];
      Sound.setLayer('soft'); Sound.play(sd.music || 'field');
    } else {
      this.view = 'task';
      Sound.setLayer('soft'); Sound.play(sd.music || 'field');
    }
    this.save();
  },

  taskPoints() {
    const st = this.stations[this.cur];
    const base = [50, 30, 15][Math.min(2, st.tries)] || 0;
    const manual = Math.max(0, st.hints - (st.auto || 0));
    const p = Math.max(0, Math.round(base * (this.task.pts / 50)) - manual * 10);
    return p;
  },

  useHint() {
    const st = this.stations[this.cur];
    if (!st || this.taskPhase !== 'ask' || !this.task || !this.task.hints) return;
    if (st.hints < this.task.hints.length) { st.hints++; this.hintsUsed++; Sound.sfx('hint'); }
  },

  answer(i) {
    if (this.taskPhase !== 'ask') return;
    this.pick = i;
    if (this.task.options[i].ok) this.gotRight();
    else { this.wrongWhy = this.task.options[i].why || ''; this.gotWrong(); }
  },

  /* Richtig: kurzes Lob, keine Erklaerung. */
  gotRight() {
    const p = this.taskPoints();
    this.score += p; this.right++;
    this.taskOk = true; this.taskPhase = 'fb';
    const sd = this.cur >= 0 ? this.chapter.stations[this.cur] : null;
    this.fbSpeaker = (sd && sd.head) || 'math';
    this.fbLine = pickLine((sd && sd.praise) || this.chapter.praise, 'Gut gemacht!');
    Sound.sfx('right'); this.flash('+' + p, LTGREEN);
  },

  /* Falsch: zuerst gibt Mathematthias den Tipp der naechsten Stufe (kostet
     keine Punkte, anders als ein selbst geholter). Danach erschrickt er, und
     F'Abiturio dreht an den Zahlen. Beim dritten Mal schliesst die Station. */
  gotWrong() {
    const st = this.stations[this.cur];
    st.tries++; this.wrong++; this.taskOk = false;
    Sound.sfx('wrong');
    if (st.tries >= 3) { this.lockStation(); return; }
    if (this.task.hints && st.hints < st.tries && st.hints < this.task.hints.length) {
      st.hints++; st.auto = (st.auto || 0) + 1;
    }
    const V = this.villain() || {};
    this.oopsLine = pickLine(V.oops || this.chapter.oops, "Oh nein! F'Abiturio dreht an den Zahlen!");
    this.gloatLine = pickLine(V.gloat || this.chapter.gloat, 'Hihi! Neuer Schabernack!');
    // Erst greift das Tippsystem, danach folgt der Dialog mit dem Zahlendreher.
    this.taskPhase = 'tip';          // Erklaerung und Tipp, danach der Zahlendreher
    Sound.sfx('hint');
  },

  tipDone() {
    this.taskPhase = 'morph';
    Sound.sfx('magic');
  },

  afterFeedback() {
    if (this.taskOk) this.solveTask();
  },

  morphDone() {
    const st = this.stations[this.cur], sd = this.chapter.stations[this.cur];
    // Neue Zahlen - oder bei Begriffsaufgaben eine andere Fassung. Die
    // gleiche Aufgabe noch einmal waere kein Zahlendreher, nur Mischen.
    const sig = t => (t.q || '') + '|' + (t.formula || '');
    const prev = this.task ? sig(this.task) : '';
    for (let k = 0; k < 12; k++) {
      st.seed = this.nextSeed();
      if (sig(buildTask(sd.tasks[st.ti], st.seed)) !== prev) break;
    }
    this.startTask();
  },

  solveTask() {
    const st = this.stations[this.cur], sd = this.chapter.stations[this.cur];
    st.ti++; st.tries = 0; st.hints = 0; st.auto = 0; st.seed = this.nextSeed();
    this.unlockOne();
    if (st.ti >= sd.tasks.length) {
      st.state = ST_DONE;
      if (sd.reward) { this.flash(sd.reward.icon + ' ' + sd.reward.name, YELLOW); Sound.sfx('save'); }
      Sound.setLayer('full');
      this.playTalk(sd.outro, 'stationOut');
    } else {
      this.startTask();
    }
    this.save();
  },

  finishStation() {
    if (this.islandDone()) { this.nextStage(); return; }
    this.gotoMap(false);
  },

  /* Eine gesperrte Station wieder oeffnen - die am laengsten gesperrte zuerst. */
  unlockOne() {
    let best = -1;
    for (let i = 0; i < this.stations.length; i++) {
      const s = this.stations[i];
      if (!this.onIsland(i)) continue;
      if (s.state === ST_LOCKED && (best < 0 || s.lockAt < this.stations[best].lockAt)) best = i;
    }
    if (best >= 0) {
      this.stations[best].state = ST_OPEN;
      this.stations[best].tries = 0;
      this.stations[best].seed = this.nextSeed();
      this.unlocked = best;
      Sound.sfx('unlock');
    } else this.unlocked = -1;
  },

  lockStation() {
    const st = this.stations[this.cur], sd = this.chapter.stations[this.cur];
    st.state = ST_LOCKED; st.lockAt = ++this.lockCounter;
    st.tries = 0; st.hints = 0; st.auto = 0; st.seed = this.nextSeed();
    Sound.sfx('lock'); Sound.setLayer('full');
    const others = this.stations.some((s, i) => i !== this.cur && this.onIsland(i) && s.state === ST_OPEN);
    this.playTalk(sd.locked, others ? 'locked' : 'partial');
  },

  afterLock() { this.gotoMap(false); },

  /* Aufgabe vertagen und anderswo weitermachen */
  abortTask() {
    if (this.cur < 0) return;
    Sound.sfx('move');
    this.task = null; this.mini = null;
    this.gotoMap(false);
  },

  /* ---------------- Minispiel ---------------- */
  miniCheck() {
    const m = this.mini, T = this.task;
    m.checked = true;
    const keys = miniKeys(T);
    m.dev = {};
    for (const k of keys) m.dev[k] = m[k] - T.target[k];
    m.ok = keys.every(k => Math.abs(m.dev[k]) < T['tol' + k]);
    if (m.ok) this.gotRight();
    else {
      // Beim Minispiel ist die Erklaerung, welche Werte noch nicht stimmen.
      const names = T.names || { A: 'die Amplitude A', B: 'die Streckung B', C: 'die Verschiebung C', D: 'der Mittelwert D' };
      const bad = keys.filter(k => Math.abs(m.dev[k]) >= T['tol' + k])
        .map(k => names[k] + (m.dev[k] < 0 ? ' ist zu klein' : ' ist zu groß'));
      this.wrongWhy = 'Noch nicht: ' + bad.join(', ') + '.';
      this.gotWrong();
    }
  },

  /* ---------------- Bosskampf ---------------- */
  toBoss() {
    Sound.setLayer('full');
    this.playTalk(this.chapter.bossIntro, 'boss');
  },

  /* island: Index der Insel mit eigenem Endgegner, sonst der Kapitel-Boss */
  beginBoss(island) {
    const isl = (typeof island === 'number' && island >= 0) ? island : -1;
    const b = isl >= 0 ? this.gates()[isl].boss : this.chapter.boss;
    this.bossDef = b; this.bossIsland = isl;
    const R = RNG(this.nextSeed());
    const qs = b.questions.map(q => buildTask(q, R.next()));
    this.boss = { hp: qs.length, max: qs.length, q: 0, phase: 'ask', shake: 0, flashT: 0, qs, rescue: false };
    this.lives = 3;
    this.view = 'boss';
    this.sel = 0;
    Sound.setLayer('full'); Sound.play('boss');
    this.save();
  },

  bossPick(i) {
    const b = this.boss;
    if (b.phase !== 'ask') return;
    const q = b.qs[b.q];
    b.lastPick = i;
    b.correct = !!q.options[i].ok;
    b.phase = 'fb';
    if (b.correct) {
      b.hp--; b.flashT = 0.25; this.score += this.bossDef.pts; this.right++;
      this.fbLine = pickLine(this.bossDef.praise || this.chapter.praise, 'Treffer!');
      Sound.sfx('hit');
    } else {
      this.lives--; this.wrong++; b.shake = 0.4; Sound.sfx('damage');
      this.gloatLine = pickLine(this.bossDef.gloat || this.chapter.gloat, 'Hihi!');
      if (this.lives <= 0) { b.rescue = true; this.lives = 1; }
    }
  },

  bossNext() {
    const b = this.boss;
    b.phase = 'ask';
    if (b.rescue) { b.rescue = false; b.hp--; }
    else if (!b.correct) return;
    b.q++;
    this.sel = 0;
    if (b.hp <= 0 || b.q >= b.qs.length) {
      if (this.bossIsland >= 0) {
        // Inselboss besiegt: weiter zum nächsten Tor, der Kampf ist abgehakt
        this.islandBossDone[this.bossIsland] = true;
        const def = this.bossDef;
        this.boss = null; this.bossDef = null; this.bossIsland = -1;
        this.playTalk(def.outro, 'islandBossDone');
      } else this.playTalk(this.chapter.outro, 'outro');
    }
    this.save();
  },

  /* ---------------- Abschluss ---------------- */
  /* status: 0 abgebrochen, 1 geloest, 2 Teilsieg, 3 am Tor gescheitert */
  finish(status) {
    this.mode = 'end';
    this.endStatus = status;
    this.code = makeCode({
      ver: 2, kap: this.chapterId, pts: Math.min(1023, this.score),
      right: Math.min(63, this.right), wrong: Math.min(63, this.wrong),
      hints: Math.min(63, this.hintsUsed), min: this.minutes(), status
    }, this.name);
    this.transfer = makeTransfer(this.chapterId, this.name, this.code);
    Sound.setLayer('full');
    Sound.play(status === 1 ? 'victory' : (status === 2 ? 'calm' : 'defeat'));
    // Nur ein abgeschlossenes Kapitel loescht den Stand. Wer mit Q eine
    // Pause macht, findet sein Spiel beim naechsten Start wieder.
    if (status !== 0) { try { localStorage.removeItem(this.saveKey()); } catch (e) {} }
  },

  /* ---------------- Spielstand ---------------- */
  save() {
    if (this.mode !== 'play') return;
    try {
      localStorage.setItem(this.saveKey(), JSON.stringify({
        v: 2, k: this.chapterId, n: this.name, t: this.startedAt,
        p: this.score, r: this.right, w: this.wrong, h: this.hintsUsed,
        sd: this.seed, lc: this.lockCounter, gp: this.gatesPassed, gi: this.gateIx, il: this.island,
        gs: this.gateScored,
        view: this.view,
        st: this.stations.map(s => [s.state, s.ti, s.seed, s.tries, s.hints, s.lockAt, s.seen ? 1 : 0, s.auto || 0]),
        cur: this.cur,
        g: this.gate ? { i: this.gate.i, r: this.gate.right } : null,
        b: this.boss ? { q: this.boss.q, hp: this.boss.hp, lv: this.lives, ib: this.bossIsland } : null,
        ibd: this.islandBossDone
      }));
    } catch (e) {}
  },

  hasSave() {
    try {
      const d = JSON.parse(localStorage.getItem(this.saveKey()) || 'null');
      return !!(d && d.v === 2 && d.k === this.chapterId);
    } catch (e) { return false; }
  },

  savedName() {
    try { return (JSON.parse(localStorage.getItem(this.saveKey()) || 'null') || {}).n || ''; }
    catch (e) { return ''; }
  },

  load() {
    let d;
    try { d = JSON.parse(localStorage.getItem(this.saveKey()) || 'null'); } catch (e) { return false; }
    if (!d || d.v !== 2 || d.k !== this.chapterId) return false;
    this.reset();
    this.name = d.n; this.startedAt = d.t;
    this.score = d.p; this.right = d.r; this.wrong = d.w; this.hintsUsed = d.h;
    this.seed = d.sd; this.lockCounter = d.lc || 0; this.gatePassed = !!d.gp;
    this.gatesPassed = d.gp || 0; this.gateIx = d.gi || 0; this.island = d.il || 0;
    this.gateScored = d.gs || [];
    this.stations = d.st.map(a => ({ state: a[0], ti: a[1], seed: a[2], tries: a[3], hints: a[4], lockAt: a[5], seen: !!a[6], auto: a[7] || 0 }));
    this.cur = d.cur;
    this.mode = 'play';
    // Beim Fortsetzen immer auf der Karte einsteigen - das ist der
    // verlaesslichste Punkt, und die Station laeuft dort weiter, wo sie stand.
    this.islandBossDone = d.ibd || [];
    if (d.b) {
      this.beginBoss(d.b.ib);
      this.boss.q = Math.min(d.b.q, this.boss.qs.length - 1);
      this.boss.hp = d.b.hp; this.lives = d.b.lv;
    } else if (d.g && d.view === 'gate') {
      this.startGate();
      this.gate.i = d.g.i; this.gate.right = d.g.r;
      if (this.gate.i >= this.gate.qs.length) this.gate.i = this.gate.qs.length - 1;
    } else if (!this.gatesPassed) {
      this.startWalk();            // vor dem ersten Tor gespeichert: noch einmal hinlaufen
    } else if (this.gateIx >= this.gatesPassed) {
      this.playTalk(this.curGate().intro, 'gate');   // zwischen zwei Inseln gespeichert
    } else {
      this.gotoMap(false);
    }
    return true;
  }
};

/* ============================================================
   AUFGABE AUS EINER VORLAGE BAUEN
   Entweder aus einem Generator (Zahlenaufgaben) oder aus einem
   Variantenvorrat (Begriffsaufgaben ohne Zahlen). Die Antworten
   werden in jedem Fall gemischt - die richtige steht nie fest oben.
   ============================================================ */
function buildTask(def, seed) {
  const R = RNG(seed);
  let d;
  if (def.gen) d = def.gen(R);
  else if (def.variants) d = Object.assign({}, R.pick(def.variants));
  else d = Object.assign({}, def);
  const t = Object.assign({}, d);
  if (t.options) t.options = R.shuffle(t.options);
  t.kind = def.kind || 'quiz';
  t.pts = def.pts || d.pts || 50;
  t.id = def.id;
  return t;
}

/* ============================================================
   LEVELCODE  (12 Zeichen, an den Namen gebunden)
   ============================================================ */
const B32 = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';

/* Vornamen vereinheitlichen, damit Code und Name immer zusammenpassen -
   auch wenn Umlaute im Spiel und im Sammelcode unterschiedlich aussehen. */
function normName(name) {
  return (name || '').toUpperCase()
    .replace(/\u00C4/g, 'AE').replace(/\u00D6/g, 'OE').replace(/\u00DC/g, 'UE')
    .replace(/\u00DF/g, 'SS')
    .replace(/[^A-Z0-9]/g, '')
    .substr(0, 12);
}

function nameKey(name) {
  let h = 5381;
  const up = normName(name);
  for (let i = 0; i < up.length; i++) h = ((h * 33) ^ up.charCodeAt(i)) >>> 0;
  return h;
}

function packBits(vals) {
  let bits = '';
  for (const [v, n] of vals) bits += (v >>> 0).toString(2).padStart(n, '0').slice(-n);
  return bits;
}

function makeCode(d, name) {
  const body = packBits([[d.ver,3],[d.kap,5],[d.pts,10],[d.right,6],[d.wrong,6],[d.hints,6],[d.min,9],[d.status,2]]);
  const key = nameKey(name);
  let sum = key % 8191;
  for (let i = 0; i < body.length; i += 8) sum = (sum * 31 + parseInt(body.substr(i, 8).padEnd(8, '0'), 2)) % 8191;
  const full = body + sum.toString(2).padStart(13, '0');   // 47 + 13 = 60 bit
  let out = '';
  for (let i = 0; i < 60; i += 5) out += B32[parseInt(full.substr(i, 5), 2)];
  return out.substr(0, 4) + '-' + out.substr(4, 4) + '-' + out.substr(8, 4);
}

function readCode(code, name) {
  const c = (code || '').toUpperCase().replace(/[^0-9A-Z]/g, '')
              .replace(/O/g, '0').replace(/I/g, '1').replace(/L/g, '1').replace(/U/g, 'V');
  if (c.length !== 12) return { ok: false, err: 'Code muss 12 Zeichen haben.' };
  let bits = '';
  for (const ch of c) {
    const v = B32.indexOf(ch);
    if (v < 0) return { ok: false, err: 'Ungültiges Zeichen: ' + ch };
    bits += v.toString(2).padStart(5, '0');
  }
  const body = bits.substr(0, 47), sum = parseInt(bits.substr(47, 13), 2);
  const key = nameKey(name);
  let s2 = key % 8191;
  for (let i = 0; i < body.length; i += 8) s2 = (s2 * 31 + parseInt(body.substr(i, 8).padEnd(8, '0'), 2)) % 8191;
  const take = (off, n) => parseInt(body.substr(off, n), 2);
  const res = {
    ok: s2 === sum,
    ver: take(0,3), kap: take(3,5), pts: take(8,10), right: take(18,6),
    wrong: take(24,6), hints: take(30,6), min: take(36,9), status: take(45,2)
  };
  if (!res.ok) res.err = 'Code passt nicht zu diesem Namen.';
  return res;
}

/* Welche Regler ein Minispiel hat: Sinus und Kosinus A bis D, die Parabel
   nur a, d, e (intern A, C, D). */
function miniKeys(T) { return T.keys || ['A', 'B', 'C', 'D']; }

/* ============================================================
   SAMMELCODE
   Ein einziger Text, den die Schuelerin kopiert und der Lehrkraft
   schickt: Kapitel, Vorname und der an den Namen gebundene Leistungscode.
   Format:  FAB-K1-LENA-4F3K9P2TW7XM
   Wer den Vornamen im Code aendert, zerstoert die Pruefsumme - die
   Codepruefung meldet das.
   ============================================================ */
function makeTransfer(chapterId, name, code) {
  return 'FAB-K' + chapterId + '-' + normName(name) + '-' + (code || '').replace(/-/g, '');
}

function parseTransfer(s) {
  const t = (s || '').toUpperCase().replace(/\s+/g, '');
  const m = t.match(/^FAB-K(\d+)-([A-Z0-9]{2,12})-([A-Z0-9-]{12,14})$/);
  if (!m) return null;
  return { kap: parseInt(m[1], 10), name: m[2], code: m[3].replace(/-/g, '') };
}

/* Eine Zeile aus einem Vorrat ziehen - fuer Lob, Schreck und Hohn. */
function pickLine(pool, fallback) {
  if (!pool || !pool.length) return fallback;
  return pool[Math.floor(Math.random() * pool.length)];
}

/* Gesammelte Belohnungen ergeben sich aus den erledigten Stationen -
   so muessen sie nicht eigens gespeichert werden. */
function earnedRewards() {
  return Game.chapter.stations.map((sd, i) => ({ r: sd.reward, got: Game.stations[i] && Game.stations[i].state === ST_DONE }))
    .filter(x => x.r);
}

/* ============================================================
   HINTERGRUNDBILDER. Die Szenen zeigen nicht Deko, sondern die
   Funktionen der jeweiligen Aufgabe in Bewegung.
   Zeichenbereich: y = 8 .. 119
   ============================================================ */

const BGY = 8, BGH = 112;

const STARS = [];
(function () {
  let seed = 20260915;
  const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
  for (let i = 0; i < 46; i++) STARS.push({ x: (rnd() * 320) | 0, y: BGY + (rnd() * 60) | 0, p: rnd() * 6 });
})();

function drawStars(t, dense) {
  for (const s of STARS) {
    const b = Math.sin(t * 1.7 + s.p);
    Screen.px(s.x, s.y, b > 0.55 ? WHITE : (b > 0 ? LTGREY : DGREY));
  }
}

function plotFn(f, x0, x1, col, clipTop, clipBot) {
  let prev = null;
  for (let px = x0; px <= x1; px++) {
    const y = f(px);
    if (!isFinite(y)) { prev = null; continue; }
    const yy = Math.round(y);
    if (prev !== null) {
      const a = Math.min(prev, yy), b = Math.max(prev, yy);
      for (let q = a; q <= b; q++) if (q >= clipTop && q <= clipBot) Screen.px(px, q, col);
    } else if (yy >= clipTop && yy <= clipBot) Screen.px(px, yy, col);
    prev = yy;
  }
}

/* ---------- Koordinatensystem mit frei waehlbarer Funktion ---------- */
function bgGraph(t, fn, xmin, xmax, ymin, ymax, col, label) {
  Screen.rect(0, BGY, SW, BGH, BLACK);
  const L = 26, R = 306, T = BGY + 6, B = BGY + 102;
  const X = x => L + (x - xmin) / (xmax - xmin) * (R - L);
  const Y = y => B - (y - ymin) / (ymax - ymin) * (B - T);
  // Raster
  for (let gx = Math.ceil(xmin); gx <= xmax; gx++) {
    const px = Math.round(X(gx));
    for (let py = T; py <= B; py += 4) Screen.px(px, py, DGREY);
  }
  for (let gy = Math.ceil(ymin); gy <= ymax; gy++) {
    const py = Math.round(Y(gy));
    for (let px = L; px <= R; px += 4) Screen.px(px, py, DGREY);
  }
  // Achsen
  const y0 = Math.round(Y(Math.max(ymin, Math.min(ymax, 0))));
  const x0 = Math.round(X(Math.max(xmin, Math.min(xmax, 0))));
  Screen.rect(L, y0, R - L, 1, GREY);
  Screen.rect(x0, T, 1, B - T, GREY);
  plotFn(px => Y(fn((px - L) / (R - L) * (xmax - xmin) + xmin)), L, R, col, T, B);
  if (label) Screen.text(label, 4, (BGY / 8) | 0, col);
}

/* Nachtmeer mit Wellen ab Hoehe y0 */
function drawSea(t, y0, col) {
  for (let x = 0; x < SW; x++) {
    const y = y0 + Math.round(Math.sin(x / 11 + t * 1.8) * 1.2 + Math.sin(x / 4 - t) * 0.6);
    Screen.rect(x, y, 1, BGY + BGH - y, col === undefined ? BLUE : col);
    Screen.px(x, y, LTBLUE);
    if ((x * 7 + ((t * 11) | 0)) % 23 === 0) Screen.px(x, y + 4, CYAN);
  }
}

/* Lineara am Horizont: nur gerade Kanten */
function drawLinearaSil(x, y, s, col) {
  for (let i = 0; i <= 40 * s; i++) {
    const h = i < 16 * s ? i * 0.9 : (i < 28 * s ? 16 * s * 0.9 : 16 * s * 0.9 - (i - 28 * s) * 1.2);
    if (h > 0) Screen.rect(x + i, y - Math.round(h), 1, Math.round(h), col);
  }
}
/* Quadrata am Horizont: ein Parabelbogen */
function drawQuadrataSil(x, y, s, col) {
  const w = 44 * s;
  for (let i = 0; i <= w; i++) {
    const u = (i - w / 2) / (w / 2);
    const h = Math.round(18 * s * (1 - u * u));
    if (h > 0) Screen.rect(x + i, y - h, 1, h, col);
  }
}

/* ---------- Brunnen auf Quadrata: Wasserstrahlen als Parabeln ---------- */
function bgBrunnen(t) {
  Screen.rect(0, BGY, SW, BGH, BLACK);

  Screen.rect(0, BGY + 96, SW, 16, DGREY);
  for (let x = 0; x < SW; x += 20) Screen.rect(x, BGY + 96, 1, 16, BLACK);

  Screen.rect(100, BGY + 84, 120, 4, BLUE);
  Screen.rect(154, BGY + 70, 12, 16, LTGREY);          // Duese
  // drei Strahlen, je eine Parabel y = h - k (x - x0)^2
  const jets = [[160, 118, 52, 0.020], [160, 202, 40, 0.028], [160, 160, 60, 0]];
  const puls = 0.9 + Math.sin(t * 2.2) * 0.1;
  for (const [x0, xe, hmax] of jets.slice(0, 2)) {
    const xm = (x0 + xe) / 2, half = Math.abs(xe - x0) / 2;
    for (let i = 0; i <= 2 * half; i++) {
      const x = Math.min(x0, xe) + i;
      const u = (x - xm) / half;
      const y = BGY + 70 - Math.round(hmax * puls * (1 - u * u));
      Screen.px(x, y, (i + ((t * 20) | 0)) % 6 < 3 ? CYAN : LTBLUE);
    }
  }
  // Tropfen fliegen die Bahn entlang
  for (let k = 0; k < 4; k++) {
    const u = ((t * 0.7 + k / 4) % 1) * 2 - 1;
    const x = 139 + Math.round(u * 21), y = BGY + 70 - Math.round(52 * puls * (1 - u * u));
    Screen.rect(x, y, 2, 2, WHITE);
  }
  // Mittlerer Strahl senkrecht, spritzt oben
  const top = BGY + 18 + Math.round(Math.sin(t * 3) * 3);
  Screen.rect(159, top, 2, BGY + 70 - top, CYAN);
  Screen.rect(156, top - 2, 8, 2, LTBLUE);
}

/* ============================================================
   STATIONSLEITER - Portraits im selben 32x40-Format wie
   Mathematthias und F'Abiturio, aber aus Grundformen gebaut statt
   gepixelt. Farben als Hex-Index in die Palette.
   ============================================================ */
function buildFace(draw) {
  const g = Array.from({ length: 40 }, () => Array(32).fill('.'));
  const R = (x, y, w, h, c) => {
    for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++)
      if (i >= 0 && i < 32 && j >= 0 && j < 40) g[j][i] = c;
  };
  const E = (cx, cy, rx, ry, c) => {
    for (let j = 0; j < 40; j++) for (let i = 0; i < 32; i++) {
      const dx = (i + 0.5 - cx) / rx, dy = (j + 0.5 - cy) / ry;
      if (dx * dx + dy * dy <= 1) g[j][i] = c;
    }
  };
  draw(R, E);
  return g.map(r => r.join(''));
}

let HOT = [];
function hot(x, y, w, h, act) { HOT.push({ x, y, w, h, act }); }

function panel(x, y, w, h, colBorder, colFill) {
  Screen.rect(x, y, w, h, colFill === undefined ? BLACK : colFill);
  Screen.frame(x, y, w, h, colBorder);
  Screen.frame(x + 1, y + 1, w - 2, h - 2, colBorder === WHITE ? LTGREY : BLACK);
}

function button(x, y, w, h, label, act, col, fg) {
  Screen.rect(x, y, w, h, col === undefined ? DGREY : col);
  Screen.textPx(label, x + Math.max(2, Math.round((w - label.length * 8) / 2)),
                y + Math.round((h - 8) / 2), fg === undefined ? WHITE : fg);
  hot(x, y, w, h, act);
}

function statusBar() {
  Screen.rect(0, 0, SW, 8, DGREY);
  Screen.text(Game.chapter ? Game.chapter.short : '', 0, 0, LTGREEN);
  const pts = 'PKT ' + String(Game.score).padStart(4, '0');
  Screen.text(pts, 40 - pts.length, 0, YELLOW);
  if (Game.view === 'boss' && Game.boss) {
    for (let i = 0; i < 3; i++) Screen.glyph('♥', 128 + i * 9, 0, i < Game.lives ? LTRED : DGREY);
  } else if (Game.stations && Game.stations.length) {
    if ((Game.view === 'task' || Game.view === 'mini') && Game.cur >= 0) {
      const used = Game.stations[Game.cur].tries;
      for (let i = 0; i < 3; i++)
        Screen.glyph('\u2022', 184 + i * 9, 0, i < used ? LTRED : DGREY);
    }
    // Stationsanzeige: voll, offen, gesperrt
    let x = 118;
    for (const s of Game.stations) {
      Screen.glyph(s.state === ST_DONE ? '\u2713' : (s.state === ST_LOCKED ? '\u2717' : '\u2022'), x, 0,
                   s.state === ST_DONE ? LTGREEN : (s.state === ST_LOCKED ? LTRED : LTGREY));
      x += 9;
    }
  }
}

function footer(txt, col) {
  Screen.rect(0, SH - 8, SW, 8, DGREY);
  Screen.text(txt, 0, 24, col === undefined ? LTGREY : col);
}

function drawPortrait(art, px, py) {
  for (let y = 0; y < art.length; y++) {
    const row = art[y];
    for (let x = 0; x < row.length; x++) {
      const c = row[x];
      if (c === '.') continue;
      Screen.px(px + x, py + y, parseInt(c, 16));
    }
  }
}

function drawPortrait2x(art, px, py, forceCol) {
  for (let y = 0; y < art.length; y++) {
    const row = art[y];
    for (let x = 0; x < row.length; x++) {
      const c = row[x];
      if (c === '.') continue;
      const col = forceCol >= 0 ? forceCol : parseInt(c, 16);
      Screen.rect(px + x * 2, py + y * 2, 2, 2, col);
    }
  }
}

/* ---------------- Dialog ---------------- */
function talkPages(s) {
  const lines = wrapText(s.text, 36);
  const perPage = 6, lastPerPage = s.formula ? 4 : 6;
  const pages = [];
  let rest = lines.slice();
  while (rest.length) {
    const isLast = rest.length <= lastPerPage;
    pages.push(rest.slice(0, isLast ? lastPerPage : perPage));
    rest = rest.slice(isLast ? lastPerPage : perPage);
  }
  return pages.length ? pages : [[]];
}

function renderTalk(t) {
  const s = Game.talk.list[Game.talk.i];
  const bg = BACKGROUNDS[s.bg] || BACKGROUNDS.nacht;
  bg(t);
  const sp = SPEAKERS[s.speaker];
  // Bösewichte stehen rechts, alle anderen links
  if (sp && sp.art) drawPortrait(sp.art(), (s.speaker === 'fab' || s.speaker === 'realia') ? 268 : 12, BGY + 64);
  panel(4, 124, 312, 66, sp ? sp.col : LTGREY);
  if (sp) {
    Screen.rect(12, 120, sp.name.length * 8 + 8, 9, sp.col);
    Screen.textPx(sp.name, 16, 121, BLACK);
  }
  const pages = talkPages(s);
  const pg = pages[Math.min(Game.page, pages.length - 1)];
  const last = Game.page >= pages.length - 1;
  const shownChars = Game.typing ? Game.typed : 1e9;
  let cnt = 0, ly = 132;
  for (let i = 0; i < pg.length; i++) {
    let ln = pg[i];
    if (cnt + ln.length > shownChars) ln = ln.substr(0, Math.max(0, shownChars - cnt));
    cnt += pg[i].length;
    Screen.textPx(ln, 12, ly, WHITE);
    ly += 9;
  }
  if (s.formula && last && !Game.typing) drawFormulaCentered(s.formula, Math.max(ly + 2, 168), YELLOW);
  if (pages.length > 1) {
    const lbl = (Game.page + 1) + '/' + pages.length;
    Screen.textPx(lbl, 316 - lbl.length * 8, 114, GREY);
  }
  if (!Game.typing && (Math.floor(t * 2) % 2)) Screen.glyph('▄', 300, 180, LTGREEN);
  footer(Game.typing ? ' ...' : (last ? ' LEERTASTE oder tippen: weiter' : ' LEERTASTE: nächste Seite'));
  hot(0, 8, SW, SH - 16, { next: true });
}

  let x = px;
  for (const ch of str) { Screen.glyph(ch, x, py, col); x += 8; }

  const W = Game.chapter.walk || {}, w = Game.walk;

  Screen.rect(0, 8, SW, 112, BLUE);            // Nachthimmel im Traum
  drawStars(t * 0.4);
  // ferne Hügel: eine Sinuskurve, natürlich
  for (let px = 0; px < SW; px++) {
    const y = Math.round(78 + Math.sin((px + cam * 0.25) / 34) * 10);
    Screen.rect(px, y, 1, 120 - y, PURPLE);
  }
  // nahe Hügel
  for (let px = 0; px < SW; px++) {
    const y = Math.round(96 + Math.sin((px + cam * 0.6) / 22 + 1) * 6);
    Screen.rect(px, y, 1, 120 - y, GREEN);
  }
  // Weg
  Screen.rect(0, 112, SW, 8, BROWN);
  for (let px = 0; px < SW; px += 6) Screen.px((px - Math.round(cam) % 6 + 6) % SW, 115, ORANGE);

  // Wegweiser aus dem Kapitel
  for (const sg of (W.signs || [])) {
    const sx = Math.round(sg.at * 3 - cam + 140);
    if (sx < -80 || sx > SW + 10) continue;

    Screen.frame(sx - 2, 80, lw, 11, ORANGE);
    textScroll(sg.text, sx + 1, 82, YELLOW);
  }

  // Ziel des Weges: Stadttor (Kapitel 1) oder Steg mit Fischerboot (Kapitel 2)
  const gx = Math.round(w.goal * 3 - cam + 150);

    if (gx < SW + 60) drawStegZiel(gx - 40, t, W.destLabel || '');

      shown += ln.length + 1;

function renderMini(t) {
  const s = Game.task, m = Game.mini;
  Screen.clear(BLACK);
  const st = Game.stations[Game.cur];
  if (st.hints > 0 && s.hints) {
    const h = s.hints[Math.min(st.hints, s.hints.length) - 1];
    const lines = wrapText(h, 39).slice(0, 2);
    lines.forEach((ln, i) => Screen.textPx(ln, 2, 10 + i * 9, YELLOW));
  } else {
    Screen.textPx(s.title, 2, 10, LTGREEN);
    Screen.textPx('Stelle genau diese Funktion ein:', 2, 19, GREY);
  }
  drawFormulaCentered(s.formula, 30, YELLOW);

  const L = 16, R = 304, T = 48, B = 118;
  const xmin = s.xmin || 0, xmax = s.xmax, ymin = s.ymin, ymax = s.ymax;
  const X = x => L + (x - xmin) / (xmax - xmin) * (R - L);
  const Y = y => B - (y - ymin) / (ymax - ymin) * (B - T);
  for (let gx = Math.ceil(xmin); gx <= xmax; gx += s.gx) { const px = Math.round(X(gx));
    for (let py = T; py <= B; py += 4) Screen.px(px, py, DGREY); }
  for (let gy = Math.ceil(ymin); gy <= ymax; gy += s.gy) { const py = Math.round(Y(gy));
    for (let px = L; px <= R; px += 4) Screen.px(px, py, DGREY); }
  const ax = Math.round(X(Math.max(xmin, Math.min(xmax, 0))));
  Screen.rect(L, Math.round(Y(0)), R - L, 1, GREY);
  Screen.rect(ax, T, 1, B - T, GREY);
  for (let gy = Math.ceil(ymin); gy <= ymax; gy += 2) {
    const py = Math.round(Y(gy));
    if (py < T || py > B - 5 || gy === 0) continue;
    Screen.rect(ax - 2, py, 3, 1, GREY);
    text5(String(gy), ax - 3 - String(gy).length * 5, py - 2, LTGREY);
  }
  Screen.textPx(s.xvar || 't', R - 8, Math.min(B - 9, Math.round(Y(0)) + 2), GREY);
  if (xmin < 0) {
    for (let gx = Math.ceil(xmin / 2) * 2; gx <= xmax; gx += 2) {
      if (gx === 0 || gx === xmax) continue;
      text5(String(gx), Math.round(X(gx)) - String(gx).length * 2, Math.min(B - 4, Math.round(Y(0)) + 3), GREY);
    }
  } else text5(String(xmax), R - 14, Math.min(B - 4, Math.round(Y(0)) + 4), GREY);

  let mine;
  if (s.fn === 'parab') mine = x => m.A * (x - m.C) * (x - m.C) + m.D;
  else { const trig = s.fn === 'cos' ? Math.cos : Math.sin; mine = x => m.A * trig(m.B * (x - m.C)) + m.D; }
  plotFn(px => Y(mine((px - L) / (R - L) * (xmax - xmin) + xmin)), L, R, YELLOW, T, B);

  const keys = miniKeys(s);
  const params = s.fn === 'parab' ? [
    { k: 'A', v: m.A, sym: 'a', lab: 'Streckung' },
    { k: 'C', v: m.C, sym: 'd', lab: 'nach links/rechts' },
    { k: 'D', v: m.D, sym: 'e', lab: 'nach oben/unten' }
  ] : [
    { k: 'A', v: m.A, lab: 'Amplitude' },
    { k: 'B', v: m.B, lab: 'Streckung' },
    { k: 'C', v: m.C, lab: 'Verschiebung' },
    { k: 'D', v: m.D, lab: 'Mittelwert' }
  ];
  const rowY = params.length === 3 ? [128, 145, 162] : [126, 139, 155, 168];
  params.forEach((p, i) => {
    const y = rowY[i], on = m.sel === i;
    if (on) Screen.rect(2, y - 3, 316, (p.k === 'B') ? 20 : 15, BLUE);
    if (p.k === 'B') { Screen.textPx('B = ', 6, y, on ? WHITE : LTGREY); drawPiFrac(p.v, 38, y - 1, on ? WHITE : LTGREY); }
    else Screen.textPx((p.sym || p.k) + ' = ' + fmtNum(p.v), 6, y, on ? WHITE : LTGREY);
    Screen.textPx(p.lab, s.fn === 'parab' ? 72 : 120, y, on ? LTGREEN : DGREY);
    Screen.rect(252, y - 1, 15, 11, on ? LTBLUE : DGREY); Screen.glyph('-', 255, y, BLACK);
    Screen.rect(290, y - 1, 15, 11, on ? LTBLUE : DGREY); Screen.glyph('+', 293, y, BLACK);
    hot(246, y - 4, 24, 17, { mini: 'dec', i });
    hot(284, y - 4, 24, 17, { mini: 'inc', i });
    hot(0, y - 4, 240, 17, { mini: 'sel', i });
  });

  button(112, 182, 96, 12, 'Prüfen', { miniCheck: true }, LTGREEN, BLACK);
  footer((st.hints < (s.hints ? s.hints.length : 0) ? ' [H] Tipp' : ' ') + '  [K] Karte  Pfeile stellen ein');
  hot(0, SH - 8, 80, 8, { hint: true });
  hot(88, SH - 8, 80, 8, { map: true });
}

function drawPiFrac(v, x, y, col) {
  const dens = [1, 2, 3, 4, 6, 8, 12, 24];
  for (const d of dens) {
    const n = v * d / Math.PI;
    if (Math.abs(n - Math.round(n)) < 0.02) {
      const nn = Math.round(n);
      if (nn === 0) { Screen.textPx('0', x, y + 1, col); return; }
      const num = (Math.abs(nn) === 1 ? '' : Math.abs(nn)) + 'pi';
      drawFormulaAt((nn < 0 ? '-' : '') + (d === 1 ? num : '<<' + num + '/' + d + '>>'), x, y - 4, col);
      return;
    }
  }
  Screen.textPx(fmtNum(v), x, y + 1, col);
}

/* ============================================================
   KAPITEL 2 - LINEARA UND QUADRATA
   E1, lineare und quadratische Funktionen und Gleichungen,
   Klausurvorbereitung (90 Minuten).

   Ablauf: Vorspann -> Weg zum Steg -> Fischer Charlie fragt lineare
   Grundlagen -> Lineara (3 Orte) -> Charlie fragt quadratische
   Grundlagen -> Quadrata (2 Orte) -> Bosskampf -> Abspann.

   Schreibweisen wie im Kurs: Punkt P(2 | 3), Lösungsmenge L = {-2; 2},
   Dezimalkomma, Werkzeuge mit Namen statt Nummern (Rücklauf Runde 1),
   gestreckt/gestaucht immer mit schmaler/breiter. Nicht im Spiel:
   quadratische Ergänzung,
   Formwechsel Normalform -> Scheitelpunktform, d = -b/(2a).
   Zahlen der Probeklausur kommen nicht vor.
   ============================================================ */

/* ---------------- Bausteine in Kursschreibweise ---------------- */
// Koeffizient vor einer Variablen: 1 -> x, -1 -> -x, 2 -> 2x
function cx(v, name) {
  if (Math.abs(v - 1) < 1e-9) return name;
  if (Math.abs(v + 1) < 1e-9) return '-' + name;
  return z(v) + name;
}
// Geradenterm m x + b
function lin(m, b, v) {
  if (Math.abs(m) < 1e-9) return z(b);
  return cx(m, v) + zs(b);
}
// Normalform a x² + b x + c
function quad(a, b, c, v) {
  let s = cx(a, v + '^{2}');
  if (Math.abs(b) > 1e-9) s += (b > 0 ? ' + ' : ' - ') + cx(Math.abs(b), v);
  return s + zs(c);
}
// Scheitelpunktform a·(x - d)² + e
function sform(a, d, e, v) {
  const pre = Math.abs(a - 1) < 1e-9 ? '' : (Math.abs(a + 1) < 1e-9 ? '-' : z(a) + '*');
  const core = Math.abs(d) < 1e-9 ? v + '^{2}' : '(' + zsub(v, d) + ')^{2}';
  return pre + core + zs(e);
}
// Lösungsmenge, aufsteigend, mit Semikolon
function lset(arr) {
  const u = [];
  for (const v of arr) { const r = Math.round(v * 1000) / 1000; if (u.indexOf(r) < 0) u.push(r); }
  u.sort((p, q) => p - q);
  return u.length ? 'L = {' + u.map(v => z(v)).join('; ') + '}' : 'L = { }';
}
// Punkt mit senkrechtem Strich
function pt(n, x, y) { return n + '(' + z(x) + ' | ' + z(y) + ')'; }
// Näherungswert mit ≈, exakter Wert mit =
function zeq(v) { return Math.abs(v * 100 - Math.round(v * 100)) < 1e-9 ? '= ' + z(v) : '≈ ' + z(v, 2); }
// Aus Kandidaten die ersten n ziehen, die sich von allen anderen unterscheiden
function distinct(list) { const out = []; for (const x of list) if (out.indexOf(x) < 0) out.push(x); return out; }

/* Tarife am Bootsverleih: Möwe mit höherer Grundgebühr, Qualle mit höherem
   Stundenpreis. Der Gleichstand liegt immer bei einer ganzen Stundenzahl. */
function tarife(R) {
  const t = R.int(2, 8), m1 = R.pick([3, 4, 5, 6]), dm = R.pick([2, 3, 4, 5]);
  const m2 = m1 + dm, b2 = R.pick([0, 2, 4, 5, 6, 8]), b1 = b2 + dm * t;
  return { t, m1, b1, m2, b2, y: m1 * t + b1 };
}
function tarifFormel(T) {
  return 'M(t) = ' + lin(T.m1, T.b1, 't') + ';   Q(t) = ' + lin(T.m2, T.b2, 't');
}

              ] : c === 0 ? [

                { t: w4, why: 'Ginge, ist aber ein Umweg. Ohne absolutes Glied klammert man x aus und liest beide Lösungen ab.' },
                { t: D, why: 'Das ist die Falle: wer durch x teilt, verliert die Lösung x = 0.' }
              ] : [
                { t: w4, ok: true },
                { t: W1, why: 'Umstellen und Wurzelziehen geht nur ohne x-Glied. Hier sind alle drei Glieder da.' },
                { t: W2, why: 'Ausklammern geht nur ohne absolutes Glied. Hier steht aber ' + z(c) + ' am Ende.' },
                { t: D, why: 'Durch x teilen hilft bei drei Gliedern nicht und kann Lösungen kosten. Hier ist die p-q-Formel dran.' }
              ];
            return {
              context: 'Der Werkzeugmacher will sehen, ob du das richtige Werkzeug greifst.',
              q: 'Welches Werkzeug passt zu dieser Gleichung?',
              formula: eq,
              hints: [
                'Nicht rechnen, nur hinschauen: welche der drei Glieder x², x und Zahl sind da?',

                'Die p-q-Formel braucht vor dem x² eine 1. Sonst erst durch den Vorfaktor teilen.'
              ],
              options: opts,
              explain: 'Richtig. Die Form entscheidet, nicht die Zahlen.',
              verify: { type: 'wahl', a, b, c }
            };
          }
        },

        /* 5.2 Gleichung lösen */
        { id: 'w_loes', kind: 'quiz', pts: 50,

                { t: lset([0, r]), ok: true },

                { t: lset([0, -r]), why: 'Vorzeichen: aus ' + cx(a, 'x') + (b > 0 ? ' + ' : ' - ') + Math.abs(b) + ' = 0 folgt x = ' + z(r) + '.' },
